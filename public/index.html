        html += '<div class="stat-grid">';
        html += '<div class="stat"><div class="n">' + window.usdt(todayVal) + '</div><div class="l">今日营收(USDT)</div></div>';
        html += '<div class="stat"><div class="n" style="color:' + diffColor + '">' + diffSymbol + ' ' + Math.abs(diffPct) + '%</div><div class="l">与昨日对比</div></div>';
        html += '<div class="stat"><div class="n">' + window.usdt(total30 * 100) + '</div><div class="l">近 30 日营收(USDT)</div></div>';
        html += '<div class="stat"><div class="n">' + (orders.filter(function(o){ return o.status === 'delivered'; }).length) + '</div><div class="l">累计发货订单</div></div>';
        html += '</div>';
        html += '</div>';

        // 商品排行 + 支付方式
        html += '<div class="card panel"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px">';
        html += '<div>';
        html += '<div class="section-title" style="margin-top:0">🔥 商品销售排行 Top 10</div>';
        html += '<table><thead><tr><th>#</th><th>商品</th><th style="text-align:right">销量</th><th style="text-align:right">营收(USDT)</th></tr></thead><tbody>';
        if (!prodRank.length){ html += '<tr><td colspan="4" class="empty">暂无数据</td></tr>'; }
        else prodRank.forEach(function(x, i){
          html += '<tr><td>' + (i + 1) + '</td><td>' + _esc(x.name) + '</td>' +
            '<td style="text-align:right">' + x.count + '</td>' +
            '<td style="text-align:right;font-weight:700;color:#e11d48">' + window.usdt(x.revenue) + '</td></tr>';
        });
        html += '</tbody></table>';
        html += '</div>';
        html += '<div>';
        html += '<div class="section-title" style="margin-top:0">💳 支付方式分布</div>';
        var payNames = { alipay: '支付宝', usdt: 'USDT', balance: '余额' };
        var payColors = { alipay: '#1677ff', usdt: '#10b981', balance: '#b45309' };
        Object.keys(payMap).forEach(function(k){
          if (!payMap[k]) return;

/* ============================================================
   [P5-3] 数据自动备份
   ============================================================ */
window.yfBackupData = function(){
  try {
    var db = window.loadDB();
    var copy = JSON.parse(JSON.stringify(db));
    var blob = new Blob([JSON.stringify(copy, null, 2)], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'yunfaka_backup_' + _now().replace(/[^\d]/g, '') + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 500);
    _toast('已导出完整备份','success');
    if (window.yfLog) window.yfLog('backupData', '');
  } catch(e){ _toast('备份失败：' + e.message,'error'); }
};
window.yfRestoreData = function(){
  var input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = function(){
    var f = input.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(e){
      try {
        var data = JSON.parse(e.target.result);
        if (!data || !data.products || !data.orders) throw new Error('文件格式不正确');
        if (!confirm('确定用备份覆盖当前数据？此操作不可撤销。')) return;
        window.saveDB(data);
        _toast('恢复成功，正在刷新…','success');
        if (window.yfLog) window.yfLog('restoreData', '');
        setTimeout(function(){ location.reload(); }, 800);
      } catch(err){ _toast('恢复失败：' + err.message,'error'); }
    };
    rd.readAsText(f);
  };
  input.click();
};

/* 云端自动备份（每 6 小时一次） */
(function(){
  function autoBackup(){
    try {
      var db = window.loadDB();
      var last = db._last_auto_backup || 0;
      if (Date.now() - last < 6 * 3600 * 1000) return;
      fetch('/api/auto-backup', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ db: db, ts: Date.now() })
      }).then(function(r){ return r.json(); }).then(function(d){
        if (d && d.ok){
          db._last_auto_backup = Date.now();
          db._auto_backup_count = (db._auto_backup_count || 0) + 1;
          window.saveDB(db);
          console.log('[AutoBackup] 云端备份成功');
        }
      }).catch(function(){});
    } catch(e){}
  }
  setInterval(autoBackup, 10 * 60 * 1000);
  setTimeout(autoBackup, 120 * 1000);
})();

/* ============================================================
   [P5-4] XSS 加固 - 重定义全局 esc 及渲染函数
   ============================================================ */
(function(){
  // 增强 esc：移除控制字符 + 过滤危险标签
  var origEsc = window.esc || function(s){ return String(s == null ? '' : s); };
  window.esc = function(s){
    var str = String(s == null ? '' : s);
    // 移除控制字符（除换行/制表符）
    str = str.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
    // HTML 转义
    return str.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  };

  // 加固商品名称、描述、公告、备注等渲染
  var origRenderHome = window.renderHome;
  if (typeof origRenderHome === 'function'){
    window.renderHome = function(){
      var r = origRenderHome.apply(this, arguments);
      return r;
    };
  }
})();

/* 加固管理后台表单输入（剥离 HTML 标签） */
window.yfSanitizeInput = function(str){
  if (str == null) return '';
  return String(str)
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
    .replace(/javascript:/gi, '')
    .replace(/on\w+\s*=/gi, '')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
};

/* ============================================================
   [P5-5] 云端同步优化 - 修复多设备冲突
   ============================================================ */
(function(){
  // 记录最后修改时间，用于判断冲突
  var _origSaveDB = window.saveDB;
  window.saveDB = function(db){
    try {
      db._lastModified = Date.now();
      db._modifiedCount = (db._modifiedCount || 0) + 1;
    } catch(e){}
    return _origSaveDB.apply(this, arguments);
  };

  // 冲突检测：如果本地与服务器数据都有新订单，合并
  function mergeOrders(local, srv){
    var localMap = {};
    var srvMap = {};
    (local.orders || []).forEach(function(o){ localMap[o.order_no] = o; });
    (srv.orders || []).forEach(function(o){ srvMap[o.order_no] = o; });
    var merged = [];
    var seen = {};
    // 优先本地（本地操作更实时）
    (local.orders || []).forEach(function(o){ merged.push(o); seen[o.order_no] = true; });
    (srv.orders || []).forEach(function(o){ if (!seen[o.order_no]) merged.push(o); });
    // 按创建时间倒序
    merged.sort(function(a, b){
      var ta = (a.created_at || '').localeCompare(b.created_at || '');
      return -ta;
    });
    return merged;
  }
  function mergeMembers(local, srv){
    var map = {};
    (local.members || []).forEach(function(m){ map[m.username] = m; });
    (srv.members || []).forEach(function(m){
      if (!map[m.username]) map[m.username] = m;
      else {
        // 保留余额更大的（避免本地充值被覆盖）
        if ((m.balance || 0) > (map[m.username].balance || 0)){
          map[m.username].balance = m.balance;
        }
      }
    });
    return Object.keys(map).map(function(k){ return map[k]; });
  }
  window.yfMergeData = function(local, srv){
    var result = JSON.parse(JSON.stringify(srv));
    result.orders = mergeOrders(local, srv);
    result.members = mergeMembers(local, srv);
    result._lastModified = Date.now();
    return result;
  };
})();

// 拦截全局 fetch，检测 /api/state 的 409
var _origFetch = window.fetch;

<!-- ============================================================
     P9-Final · USDT 全局守护（修复重复处理 + 多单并发 + 前后台恢复）
     ============================================================ -->
<script>
(function(){
'use strict';
if (!window.loadDB) { console.warn('[P9] 核心未就绪'); return; }

var _toast = function(m,t){ try{ window.toast(m, t||'success'); }catch(e){ console.log('[P9]',m); } };
var POLL_MS = 30000;
var MAX_CONCURRENCY = 2;
var _globalTimer = null;
var _running = false;

/* 采集所有 pending 的 USDT 目标（过滤 amount_due=0） */
function collectPending(){
  var db = window.loadDB();
  var orders = (db.orders || []).filter(function(o){
    return o.pay_method === 'usdt'
        && o.status === 'pending'
        && (o.amount_due || 0) > 0;
  });
  var recharges = (db.recharges || []).filter(function(r){
    return r.method === 'usdt' && r.status === 'pending';
  });
  return orders.map(function(o){ return o.order_no; })
       .concat(recharges.map(function(r){ return r.id; }));
}

/* 检测单笔 */
function checkOne(id){
  return fetch('/api/usdt-check?order=' + encodeURIComponent(id) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ return { id:id, ok:d.ok, status:d.status, auto:!!d.auto, tx:d.tx }; })
    .catch(function(){ return { id:id, ok:false, error:true }; });
}

/* ⭐ F1 修复：收到 auto:true 只拉最新 state 刷新 UI，绝不再执行业务逻辑 */
function refreshFromServer(){
  return fetch('/api/state?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.ok && d.db) {
        try { localStorage.setItem('yunfaka_db_v15', JSON.stringify(d.db)); } catch(e){}
        window.__DB = d.db;
      }
    })
    .catch(function(){});
}

function tick(manual){
  if (_running) return;
  if (document.hidden && !manual) return;

  var ids = collectPending();
  if (!ids.length) return;

  _running = true;
  var queue = ids.slice();
  var results = [];
  var pending = 0;
  var done = false;

  function finish(){
    _running = false;
    var paid = results.filter(function(r){ return r && r.ok && r.auto; });
    if (paid.length){
      /* 只刷新，不重复处理 */
      refreshFromServer().then(function(){
        var n = paid.length;
        _toast('✅ 检测到 ' + n + ' 笔 USDT 到账，正在同步…', 'success');
        setTimeout(function(){ if (window.route) window.route(); }, 500);
      });
    }
  }

  function next(){
    if (done) return;
    if (!queue.length){
      if (pending === 0){ done = true; finish(); }
      return;
    }
    var id = queue.shift();
    pending++;
    checkOne(id).then(function(res){
      results.push(res);
      pending--;
      if (!queue.length && pending === 0){ done = true; finish(); }
      else next();
    });
  }
  for (var i = 0; i < MAX_CONCURRENCY; i++) next();

<!-- ============================================================
     P11 · 配置独立备份 —— 彻底解决"保存后刷新丢失"
     原理：saveSettings 时额外写独立 key；loadDB 时用独立 key 覆盖 config
     ============================================================ -->
<script>
(function(){
'use strict';

if (!window.loadDB || !window.saveDB){
  console.error('[P11] 核心未就绪');
  return;
}

var CONFIG_OVERRIDE_KEY = 'yf_config_override';
var CONFIG_OVERRIDE_MAX_AGE = 7 * 24 * 3600 * 1000; // 7 天内有效

/* ---------- 1. 保存时写入独立备份 ---------- */
var _origSaveSettings = window.saveSettings;
window.saveSettings = function(){
  var ret = _origSaveSettings.apply(this, arguments);

  /* 独立备份 config */
  try {
    var db = window.loadDB();
    var payload = {
      config: db.config,
      savedAt: Date.now()
    };
    localStorage.setItem(CONFIG_OVERRIDE_KEY, JSON.stringify(payload));
    console.log('%c[P11] ✅ 配置已独立备份（刷新也不会丢）', 'color:#10b981;font-weight:bold');
    console.log('[P11] 备份内容:', {
      tg_bot_token: db.config.tg_bot_token ? db.config.tg_bot_token.slice(0,12)+'…' : '(空)',
      tg_chat_id: db.config.tg_chat_id || '(空)',
      site_name: db.config.site_name,
      usdt_rate: db.config.pay_usdt_rate
    });
  } catch(e){
    console.error('[P11] 备份失败:', e);
  }

  return ret;
};

/* ---------- 2. 覆盖 loadDB：独立备份覆盖 config ---------- */
var _origLoadDB = window.loadDB;
window.loadDB = function(){
  var db = _origLoadDB.apply(this, arguments);
  if (!db) return db;

  try {
    var raw = localStorage.getItem(CONFIG_OVERRIDE_KEY);
    if (!raw) return db;

    var override = JSON.parse(raw);
    if (!override || !override.config || !override.savedAt) return db;

    /* 过期检查 */
    if (Date.now() - override.savedAt > CONFIG_OVERRIDE_MAX_AGE){
      console.warn('[P11] 独立备份已过期，忽略');
      return db;
    }

    /* 合并：独立备份优先 */
    var primary = db.config || {};
    var merged = Object.assign({}, primary, override.config);

    /* 关键：不加日志，否则 loadDB 被高频调用会刷屏 */
    db.config = merged;
  } catch(e){
    console.warn('[P11] 加载独立备份失败:', e);
  }

  return db;
};

/* ---------- 3. 首屏渲染前先验证：独立备份 vs 服务端 ---------- */
setTimeout(function(){
  try {
    var raw = localStorage.getItem(CONFIG_OVERRIDE_KEY);
    if (!raw) return;
    var override = JSON.parse(raw);
    if (!override || !override.config) return;

    fetch('/api/state?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok || !d.db || !d.db.config) return;
        var srvCfg = d.db.config;
        var keys = ['tg_bot_token','tg_chat_id','site_name','pay_usdt_rate','pay_usdt_address'];
        var diff = [];
        keys.forEach(function(k){
          if (String(srvCfg[k]||'') !== String(override.config[k]||'')) diff.push(k);
        });
        if (diff.length){
          console.warn('%c[P11] ⚠️ 服务端配置与本地备份不一致：', 'color:#f59e0b;font-weight:bold', diff);
          console.warn('  → 说明 POST /api/state 未成功，独立备份正在保护你的配置');
          if (window.toast){
            window.toast('⚠️ 服务端保存失败，配置仅本地生效。请检查 /api/state 接口权限', 'error');
          }
        } else {
          console.log('%c[P11] ✅ 服务端配置已同步', 'color:#10b981;font-weight:bold');
        }
      })
      .catch(function(e){ console.warn('[P11] 验证请求失败:', e); });
  } catch(e){}
}, 3000);

/* ---------- 4. 提供手动工具（F12 里执行） ---------- */
window.yfConfigDebug = function(){
  var raw = localStorage.getItem(CONFIG_OVERRIDE_KEY);
  var override = raw ? JSON.parse(raw) : null;
  var db = _origLoadDB.call(window);
  console.group('[P11] 配置诊断');
  console.log('独立备份存在:', !!override);
  if (override){
    console.log('备份时间:', new Date(override.savedAt).toLocaleString());
    console.log('备份 tg_bot_token:', override.config.tg_bot_token || '(空)');
    console.log('备份 tg_chat_id:', override.config.tg_chat_id || '(空)');
  }
  console.log('当前 db.config.tg_bot_token:', db.config.tg_bot_token || '(空)');
  console.log('当前 db.config.tg_chat_id:', db.config.tg_chat_id || '(空)');
  console.log('--- 命令 ---');
  console.log('清除独立备份: yfConfigClearOverride()');
  console.log('强制推送: yfConfigForcePush()');
  console.groupEnd();
};

window.yfConfigClearOverride = function(){
  localStorage.removeItem(CONFIG_OVERRIDE_KEY);
  console.log('[P11] 独立备份已清除');
  if (window.toast) window.toast('已清除独立备份', 'info');
};

window.yfConfigForcePush = function(){
  try {
    var db = window.loadDB();
    fetch('/api/state?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var rev = d && d.rev !== undefined ? d.rev : 0;
        return fetch('/api/state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ db: db, baseRev: rev })
        }).then(function(r){ return r.json(); });
      })
      .then(function(d){
        if (d && d.ok){
          console.log('%c[P11] ✅ 强制推送成功', 'color:#10b981;font-weight:bold');
          if (window.toast) window.toast('强制推送成功 ✅', 'success');
        } else {
          console.error('[P11] ❌ 强制推送失败:', d);
          if (window.toast) window.toast('推送失败：' + (d && d.msg || '未知'), 'error');
        }
      })
      .catch(function(e){
        console.error('[P11] 推送异常:', e);
        if (window.toast) window.toast('推送异常：' + e.message, 'error');
      });
  } catch(e){
    console.error(e);
  }
};

console.log('%c[P11] 配置独立备份已启用 —— 保存后刷新不再丢失', 'color:#e11d48;font-weight:bold;font-size:13px');
console.log('%c  诊断：yfConfigDebug()  |  清除：yfConfigClearOverride()  |  强制推送：yfConfigForcePush()',
  'color:#6b7280;font-size:12px');
})();
</script>

<!-- ============================================================
     P15 · 客服对话框闪烁修复（每 5 秒轮询重建 DOM 导致）
     ============================================================ -->
<script>
(function(){
'use strict';

/* -------- HTML 转义 -------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* -------- 覆盖 csRender：只在内容变化时更新 DOM -------- */
window.csRender = function(msgs){
  var box = document.getElementById('cs-msgs');
  if (!box) return;

  /* 空状态 */
  if (!msgs || !msgs.length){
    var emptyHtml = '<div class="cs-empty">有任何问题请留言，店主会尽快回复～</div>';
    if (box._lastHtml === emptyHtml){
      box.scrollTop = box.scrollHeight;
      return;
    }
    box._lastHtml = emptyHtml;
    box.innerHTML = emptyHtml;
    return;
  }

  /* 拼 HTML */
  var html = msgs.map(function(m){
    var role = (m.role === 'admin') ? 'admin' : 'customer';
    return '<div class="cs-msg ' + role + '">' +
           esc(m.text) +
           '<span class="cs-time">' + esc(m.time || '') + '</span></div>';
  }).join('');

  /* ⭐ 关键：内容完全相同 → 不碰 DOM → 不闪 */
  if (box._lastHtml === html){
    box.scrollTop = box.scrollHeight;
    return;
  }

  /* 记录旧消息条数，用于禁用已存在消息的入场动画 */
  var oldCount = box.querySelectorAll('.cs-msg').length;

  box._lastHtml = html;
  box.innerHTML = html;

  /* 已存在的消息禁用动画（防止全部重播） */
  var all = box.querySelectorAll('.cs-msg');
  for (var i = 0; i < oldCount && i < all.length; i++){
    all[i].style.animation = 'none';
  }

  box.scrollTop = box.scrollHeight;

  /* 未读红点 */
  var adminCount = msgs.filter(function(m){ return m.role === 'admin'; }).length;
  var csPanel = document.getElementById('cs-panel');
  if (adminCount > (window._csLastAdmin || 0) && csPanel && !csPanel.classList.contains('open')){
    var floatBtn = document.getElementById('cs-float');
    if (floatBtn) floatBtn.classList.add('has-msg');
  }
  window._csLastAdmin = adminCount;
};

/* -------- 覆盖 csSend：避免发送后立刻重建整个列表 -------- */
window.csSend = function(){
  var input = document.getElementById('cs-input');
  if (!input) return;
  var text = input.value.trim();
  if (!text) return;

  var btn = document.getElementById('cs-send');
  var msgsBox = document.getElementById('cs-msgs');

  /* 本地追加（不重建整个列表） */
  if (msgsBox){
    var emptyDiv = msgsBox.querySelector('.cs-empty');
    if (emptyDiv) emptyDiv.remove();

    var now = new Date();
    var p = function(n){ return String(n).padStart(2, '0'); };
    var timeStr = now.getFullYear() + '-' + p(now.getMonth()+1) + '-' + p(now.getDate())
                + ' ' + p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds());

    var msgDiv = document.createElement('div');
    msgDiv.className = 'cs-msg customer';
    msgDiv.innerHTML = esc(text) + '<span class="cs-time">' + timeStr + '</span>';
    msgsBox.appendChild(msgDiv);
    msgsBox.scrollTop = msgsBox.scrollHeight;

    /* ⭐ 本地追加后，标记 _lastHtml 为"过期"，让 csPoll 拿到服务端数据后重建一次（合并） */
    msgsBox._lastHtml = '__local_append__';
  }

  input.value = '';
  if (btn){ btn.disabled = true; btn.textContent = '发送中'; }

  var session = localStorage.getItem('yunfaka_chat_session') || '';
  fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session: session, text: text })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (btn){ btn.disabled = false; btn.textContent = '发送'; }
    if (d.ok){
      if (window.csPoll) window.csPoll();
    } else {
      alert('发送失败：' + (d.msg || '未知错误'));
    }
  })
  .catch(function(){
    if (btn){ btn.disabled = false; btn.textContent = '发送'; }
    alert('网络错误，请检查网络后重试');
  });
};

console.log('%c[P15] 客服对话框闪烁修复已启用（只在内容变化时更新 DOM）',
  'color:#10b981;font-weight:bold;font-size:12px');
})();
</script>
<!-- ============================================================
     P18 · 独立本地配置持久化（不依赖服务端，保存永不丢失）
     ============================================================ -->
<script>
(function(){
'use strict';

var CFG_KEY = 'yf_cfg_v1';

function getMyCfg(){
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch(e){ return null; }
}
function setMyCfg(cfg){
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch(e){}
}
function V(id, fb){ var e = document.getElementById(id); return e ? String(e.value).trim() : (fb || ''); }
function C(id, fb){ var e = document.getElementById(id); return e ? !!e.checked : !!fb; }
function N(id, fb){ var e = document.getElementById(id); if (!e) return fb; var v = parseFloat(e.value); return isNaN(v) ? fb : v; }

/* ===== 终极 saveSettings（不依赖任何历史补丁） ===== */
window.saveSettings = function(){
  var db = window.__yfRawLoadDB ? window.__yfRawLoadDB() : (window.loadDB() || {});
  var old = db.config || {};
  var myOld = getMyCfg() || {};
  var base = Object.assign({}, old, myOld);

  var next = {
    site_name: V('cfg-name', base.site_name || '云发卡') || '云发卡',
    hero_subtitle: V('cfg-hero-sub', base.hero_subtitle || ''),
    tg_username: V('cfg-tg', base.tg_username || '').replace(/^@/, ''),
    tg_btn_color: V('cfg-tg-color', base.tg_btn_color || '#0088cc') || '#0088cc',
    tg_notify_enabled: C('cfg-tg-notify', base.tg_notify_enabled !== false),
    tg_bot_token: V('cfg-tg-bot-token', base.tg_bot_token || ''),
    tg_chat_id: V('cfg-tg-chat-id', base.tg_chat_id || ''),
    balance_enabled: C('cfg-balance-enabled', base.balance_enabled !== false),
    recharge_min: Math.round(N('cfg-recharge-min', (base.recharge_min || 1000) / 100) * 100) || 1000,
    pay_alipay_enabled: C('cfg-alipay-enabled', base.pay_alipay_enabled !== false),
    pay_alipay_mode: V('cfg-alipay-mode', base.pay_alipay_mode || 'redpacket') || 'redpacket',
    pay_alipay_redpacket_prefix: (V('cfg-rp-prefix', base.pay_alipay_redpacket_prefix || 'YFK').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'YFK').slice(0, 6),
    pay_alipay_qr: V('cfg-alipay-qr', base.pay_alipay_qr || ''),
    pay_usdt_enabled: C('cfg-usdt-enabled', base.pay_usdt_enabled !== false),
    pay_usdt_address: V('cfg-usdt-address', base.pay_usdt_address || ''),
    pay_usdt_network: V('cfg-usdt-network', base.pay_usdt_network || 'TRC20') || 'TRC20',
    pay_usdt_rate: N('cfg-usdt-rate', base.pay_usdt_rate || 7.2) || 7.2,
    luban_markup: N('cfg-luban-markup', base.luban_markup || 1.3) || 1.3,
    luban_common_cost: N('cfg-luban-common-cost', base.luban_common_cost || 2) || 2
  };

  /* 保留未编辑字段 */
  Object.keys(base).forEach(function(k){ if (next[k] === undefined) next[k] = base[k]; });

  /* ⭐ 1. 存独立 key（最重要，永不丢失） */
  setMyCfg(next);

  /* ⭐ 2. 写进主 db */
  db.config = next;
  try { localStorage.setItem('yunfaka_db_v15', JSON.stringify(db)); } catch(e){}

  /* 3. 尝试推服务端（失败也无所谓，不影响本地） */
  try {
    fetch('/api/state?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        var rev = d && d.rev !== undefined ? d.rev : 0;
        return fetch('/api/state', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ db: db, baseRev: rev })
        });
      })
      .then(function(r){
        console.log('[P18] 服务端同步状态码:', r.status);
      })
      .catch(function(e){ console.warn('[P18] 服务端同步失败（本地已保存）', e); });
  } catch(e){}

  /* 刷新 UI */
  try { if (window.applySiteConfig) window.applySiteConfig(); } catch(e){}
  try { if (window.renderSettings) window.renderSettings(); } catch(e){}

  if (window.toast) window.toast('设置已保存 ✅', 'success');
  console.log('[P18] 已保存到独立 key:', {
    site_name: next.site_name,
    tg_bot_token: next.tg_bot_token ? next.tg_bot_token.slice(0, 12) + '…' : '(空)',
    tg_chat_id: next.tg_chat_id || '(空)'
  });
};

/* ===== 覆盖 loadDB：独立配置永远优先 ===== */
var _ldb = window.loadDB;
window.__yfRawLoadDB = _ldb;
window.loadDB = function(){
  var db = _ldb.apply(this, arguments);
  var myCfg = getMyCfg();
  if (db && myCfg){
    db.config = Object.assign({}, db.config || {}, myCfg);
  }
  return db;
};

/* ===== 工具（在浏览器地址栏没法执行时用控制台） ===== */
window.yfShowCfg = function(){
  var c = getMyCfg();
  alert(c ? '当前已保存的配置：\n\n' + JSON.stringify({
    site_name: c.site_name,
    tg_bot_token: c.tg_bot_token ? c.tg_bot_token.slice(0, 12) + '…' : '(空)',
    tg_chat_id: c.tg_chat_id || '(空)',
    pay_usdt_rate: c.pay_usdt_rate,
    pay_usdt_address: c.pay_usdt_address ? c.pay_usdt_address.slice(0, 8) + '…' : '(空)'
  }, null, 2) : '未保存过任何配置');
};
window.yfClearCfg = function(){
  if (!confirm('确定清空所有本地配置？')) return;
  localStorage.removeItem(CFG_KEY);
  localStorage.removeItem('yf_config_override');
  localStorage.removeItem('yunfaka_db_v15');
  alert('已清空，请刷新页面');
};

console.log('%c[P18] 独立配置持久化已启用（保存永不丢失）', 'color:#10b981;font-weight:bold;font-size:13px');
console.log('查看已存配置：yfShowCfg()  |  清空：yfClearCfg()');
})();
</script>
<!-- ============================================================
     P19 · Luban 管理优化
     - 把「设置」里的 Luban 字段移入「Luban接码」标签页
     - 后台商品列表显示上游成本价
     - 一键同步上游商品并按加价倍数重算价格
     ============================================================ -->
<script>
(function(){
'use strict';
if (!window.loadDB || !window.renderLuban) { console.warn('[P19] 核心未就绪'); return; }

var _toast = function(m,t){ try{ window.toast(m, t||'success'); }catch(e){ console.log('[P19]', m); } };
var _esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

/* ===== 1. 从「设置」页隐藏 Luban 字段 ===== */
var _origRenderSettings = window.renderSettings;
window.renderSettings = function(){
  var r = _origRenderSettings.apply(this, arguments);
  setTimeout(function(){
    var ids = ['cfg-luban-markup', 'cfg-luban-common-cost'];
    ids.forEach(function(id){
      var el = document.getElementById(id);
      if (!el) return;
      var lbl = el.closest('label.field');
      if (lbl) lbl.style.display = 'none';
    });
  }, 60);
  return r;
};

/* ===== 2. 完全重写 renderLuban ===== */
window.renderLuban = function(){
  var db = window.loadDB();
  var cfg = db.config || {};
  var lubanProducts = db.products.filter(function(p){ return p.source === 'luban'; });
  var markup = Number(cfg.luban_markup) || 1.3;
  var commonCost = Number(cfg.luban_common_cost) || 2;
  var rate = Number(cfg.pay_usdt_rate) || 7.2;

  var fmtUsdt = function(fen){ return (Number(fen||0)/100/rate).toFixed(2); };
  var fmtYuan = function(fen){ return (Number(fen||0)/100).toFixed(2); };

  /* 商品行 */
  var rows = lubanProducts.length ? lubanProducts.map(function(p){
    var originUsd = parseFloat(p.luban_origin_cost || 0);
    var costUsd = '$' + originUsd.toFixed(4);
    var costCny = '≈ ¥' + (originUsd * rate).toFixed(2);
    var priceUsd = fmtUsdt(p.price);
    var priceCny = fmtYuan(p.price);
    return '<tr>' +
      '<td><b>' + _esc(p.name) + '</b></td>' +
      '<td>' + _esc(p.luban_country || '-') + '</td>' +
      '<td class="mono" style="font-size:12px;color:#6b7280">' + costUsd +
        '<br><span class="muted" style="font-size:11px;font-weight:400">' + costCny + '</span></td>' +
      '<td style="font-weight:700;color:#e11d48">' + priceUsd + ' USDT' +
        '<br><span class="muted" style="font-weight:400;font-size:11px">≈ ¥' + priceCny + '</span></td>' +
      '<td><span class="badge ' + (p.active ? 'ok' : 'gray') + '">' + (p.active ? '上架' : '下架') + '</span></td>' +
      '<td style="text-align:right;white-space:nowrap">' +
        '<button class="btn sm ghost" onclick="lubanToggleProduct(' + p.id + ')">' + (p.active ? '下架' : '上架') + '</button> ' +
        '<button class="btn sm danger" onclick="deleteProduct(' + p.id + ')">删除</button>' +
      '</td></tr>';
  }).join('') : '<tr><td colspan="6" class="empty">还没有同步接码服务</td></tr>';

  var html = '';

  /* --- 加价配置面板 --- */
  html += '<div class="card panel" style="background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #93c5fd">';
  html += '<h2 style="margin:0 0 14px">⚙️ 加价与同步配置</h2>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px">';
  html += '<label class="field" style="margin:0"><span>加价倍数（上游成本 × 倍数 = 我站售价）</span><input id="p19-markup" type="number" step="0.05" min="1" value="' + markup + '"></label>';
  html += '<label class="field" style="margin:0"><span>通用接码成本（元/条）</span><input id="p19-common-cost" type="number" step="0.1" min="0.1" value="' + commonCost + '"></label>';
  html += '<label class="field" style="margin:0"><span>汇率（1 USDT = ? CNY）</span><input id="p19-rate" type="number" step="0.01" min="1" value="' + rate + '"></label>';
  html += '</div>';
  html += '<div style="background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#1e40af;line-height:1.8">';
  html += '<b>💡 当前规则：</b>售价 = 上游成本(USD) × ' + markup + ' 倍 × 汇率 ' + rate + '<br>';
  html += '通用接码售价：<b style="color:#e11d48;font-size:15px">' + (commonCost * markup).toFixed(2) + ' 元</b> （≈ ' + ((commonCost * markup) / rate).toFixed(2) + ' USDT）<br>';
  html += '已上架 <b>' + lubanProducts.length + '</b> 个接码服务';
  html += '</div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  html += '<button class="btn primary" id="p19-save">💾 保存并重算价格</button>';
  html += '<button class="btn ghost" id="p19-sync" style="background:#fff">🔄 同步上游商品（全量）</button>';
  html += '<button class="btn ghost" id="p19-refresh-cost" style="background:#fff">💰 仅刷新成本价</button>';
  html += '</div>';
  html += '</div>';

  /* --- 按筛选同步面板 --- */
  html += '<div class="card panel">';
  html += '<h2>📥 按筛选同步</h2>';
  html += '<div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">';
  html += '<div style="flex:1;min-width:160px"><div class="muted" style="font-size:12px;margin-bottom:6px">国家（中文名）</div><input id="luban-filter-country" placeholder="留空 = 全部"></div>';
  html += '<div style="flex:1;min-width:160px"><div class="muted" style="font-size:12px;margin-bottom:6px">服务关键词</div><input id="luban-filter-service" placeholder="留空 = 全部"></div>';
  html += '<button class="btn primary" onclick="lubanSyncServices()">📥 按筛选拉取</button>';
  html += '</div>';
  html += '</div>';

  /* --- 商品列表 --- */
  html += '<div class="card panel">';
  html += '<div class="spread" style="margin-bottom:12px"><h2 style="margin:0">接码商品列表（' + lubanProducts.length + '）</h2>';
  html += '<span class="muted" style="font-size:12px">共 ' + lubanProducts.length + ' 个</span>';
  html += '</div>';
  html += '<div style="overflow-x:auto"><table><thead><tr>';
  html += '<th>服务</th><th>国家</th><th>上游成本</th><th>我站售价</th><th>状态</th><th></th>';
  html += '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  html += '</div>';

  var body = document.getElementById('tab-body');
  if (body) body.innerHTML = html;

  /* ===== 绑定按钮事件 ===== */

  /* 保存并重算 */
  var saveBtn = document.getElementById('p19-save');
  if (saveBtn) saveBtn.onclick = function(){
    var db2 = window.loadDB();
    var m = parseFloat(document.getElementById('p19-markup').value) || 1.3;
    var c = parseFloat(document.getElementById('p19-common-cost').value) || 2;
    var rt = parseFloat(document.getElementById('p19-rate').value) || 7.2;
    db2.config.luban_markup = m;
    db2.config.luban_common_cost = c;
    db2.config.pay_usdt_rate = rt;

    var count = 0;
    (db2.products || []).forEach(function(p){
      if (p.source === 'luban' && p.luban_type === 'sms'){
        var origin = parseFloat(p.luban_origin_cost || 0);
        if (origin > 0){
          p.price = Math.max(1, Math.round(origin * rt * m * 100));
          count++;
        }
      }
    });

    window.saveDB(db2);
    _toast('已保存并重算 ' + count + ' 个商品价格 ✅');
    setTimeout(function(){ window.renderLuban(); }, 500);
  };

  /* 全量同步上游 */
  var syncBtn = document.getElementById('p19-sync');
  if (syncBtn) syncBtn.onclick = function(){
    var db2 = window.loadDB();
    db2.config.luban_markup = parseFloat(document.getElementById('p19-markup').value) || 1.3;
    db2.config.luban_common_cost = parseFloat(document.getElementById('p19-common-cost').value) || 2;
    db2.config.pay_usdt_rate = parseFloat(document.getElementById('p19-rate').value) || 7.2;
    window.saveDB(db2);

    if (typeof window.lubanSyncServices === 'function'){
      var c1 = document.getElementById('luban-filter-country');
      var c2 = document.getElementById('luban-filter-service');
      if (c1) c1.value = '';
      if (c2) c2.value = '';
      window.lubanSyncServices();
    }
  };

  /* 仅刷新成本价 */
  var refreshBtn = document.getElementById('p19-refresh-cost');
  if (refreshBtn) refreshBtn.onclick = function(){
    _toast('正在拉取最新成本价…');
    var page = 1;
    var allItems = [];
    var emptyStreak = 0;

    function fetchPage(){
      return fetch('/api/luban?action=services&language=zh&page=' + page)
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d.code !== 0) throw new Error(d.msg || '拉取失败');
          var list = Array.isArray(d.msg) ? d.msg : [];
          if (list.length > 0){
            allItems.push.apply(allItems, list);
            emptyStreak = 0;
            page++;
            if (page > 30) return null;
            return new Promise(function(res){ setTimeout(function(){ res(fetchPage()); }, 150); });
          }
          emptyStreak++;
          if (emptyStreak >= 2) return null;
          page++;
          if (page > 30) return null;
          return new Promise(function(res){ setTimeout(function(){ res(fetchPage()); }, 300); });
        });
    }

    fetchPage().then(function(){
      if (!allItems.length){ _toast('未拉取到数据', 'error'); return; }
      var db2 = window.loadDB();
      var m = Number(db2.config.luban_markup) || 1.3;
      var rt = Number(db2.config.pay_usdt_rate) || 7.2;
      var updated = 0, added = 0;
      allItems.forEach(function(s){
        var exist = (db2.products || []).find(function(p){
          return p.source === 'luban' && String(p.luban_service_id) === String(s.service_id);
        });
        var origin = parseFloat(s.origin_cost);
        if (isNaN(origin)) origin = (parseFloat(s.cost) || 0) / 1.3;
        var newPrice = Math.max(1, Math.round(origin * rt * m * 100));
        if (exist){
          exist.luban_origin_cost = origin.toFixed(2);
          exist.price = newPrice;
          updated++;
        } else if (s.service_name){
          db2.seq.product++;
          db2.products.push({
            id: db2.seq.product,
            name: '[接码] ' + s.service_name + ' · ' + (s.country_name_zh || ''),
            price: newPrice,
            description: '国家：' + (s.country_name_zh || '') + ' ｜ 服务：' + s.service_name,
            note: '请在 20 分钟内完成注册',
            category_id: 0, active: true, created_at: (function(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());})(),
            skus: [], source: 'luban', luban_type: 'sms',
            luban_service_id: String(s.service_id),
            luban_service_name: s.service_name,
            luban_country: s.country_name_zh || s.country_name_en || '',
            luban_origin_cost: origin.toFixed(2)
          });
          added++;
        }
      });
      window.saveDB(db2);
      _toast('已刷新：更新 ' + updated + ' 个，新增 ' + added + ' 个 ✅');
      setTimeout(function(){ window.renderLuban(); }, 500);
    }).catch(function(e){ _toast('刷新失败：' + e.message, 'error'); });
  };
};

console.log('%c[P19] Luban 管理优化已启用：设置页字段已隐藏 · 成本价显示 · 一键同步',
  'color:#6366f1;font-weight:bold;font-size:13px');
})();
</script>
<!-- ============================================================
     P20 · Luban 管理增强
     - 修复上游余额显示（P19 遗漏）
     - 通用接码成本显示 + 保存
     - 上游价格/服务变动 → 自动同步到平台
     - 自动同步开关 + 间隔设置 + 上次同步时间
     ============================================================ -->
<script>
(function(){
'use strict';
if (!window.loadDB) { console.warn('[P20] 核心未就绪'); return; }

var _toast = function(m,t){ try{ window.toast(m, t||'success'); }catch(e){ console.log('[P20]', m); } };
var _esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var _now = function(){ var d=new Date(),p=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); };

/* ============ 工具1：全量拉取上游服务 ============ */
window.yfLubanFetchAll = function(){
  var page = 1;
  var allItems = [];
  var emptyStreak = 0;
  var maxPages = 50;
  function fetchPage(){
    return fetch('/api/luban?action=services&language=zh&page=' + page)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.code !== 0) throw new Error(d.msg || '拉取失败');
        var list = Array.isArray(d.msg) ? d.msg : [];
        if (list.length > 0){
          allItems.push.apply(allItems, list);
          emptyStreak = 0;
          page++;
          if (page > maxPages) return null;
          return new Promise(function(res){ setTimeout(function(){ res(fetchPage()); }, 150); });
        }
        emptyStreak++;
        if (emptyStreak >= 2) return null;
        page++;
        if (page > maxPages) return null;
        return new Promise(function(res){ setTimeout(function(){ res(fetchPage()); }, 300); });
      });
  }
  return fetchPage().then(function(){ return allItems; });
};

/* ============ 工具2：合并上游服务到本地（自动识别增/改/删） ============ */
window.yfLubanMergeServices = function(allItems){
  var db = window.loadDB();
  var m = Number(db.config.luban_markup) || 1.3;
  var rt = Number(db.config.pay_usdt_rate) || 7.2;
  var added = 0, updated = 0, removed = 0, restored = 0;
  var remoteIds = {};

  allItems.forEach(function(s){
    var sid = String(s.service_id);
    if (!sid) return;
    remoteIds[sid] = true;

    var origin = parseFloat(s.origin_cost);
    if (isNaN(origin)) origin = (parseFloat(s.cost) || 0) / 1.3;
    var newPrice = Math.max(1, Math.round(origin * rt * m * 100));

    var exist = (db.products || []).find(function(p){
      return p.source === 'luban' && String(p.luban_service_id) === sid;
    });

    if (exist){
      var oldCost = parseFloat(exist.luban_origin_cost || 0);
      var oldPrice = exist.price;
      var wasRemoved = !!exist.luban_removed;

      exist.luban_origin_cost = origin.toFixed(2);
      exist.price = newPrice;
      exist.luban_service_name = s.service_name || exist.luban_service_name;
      exist.luban_country = s.country_name_zh || s.country_name_en || exist.luban_country;
      exist.name = '[接码] ' + (s.service_name || '') + ' · ' + (s.country_name_zh || '');
      exist.description = '国家：' + (s.country_name_zh || '') + ' ｜ 服务：' + s.service_name;

      if (wasRemoved){
        exist.luban_removed = false;
        exist.active = true;
        restored++;
      } else if (oldCost !== origin || oldPrice !== newPrice){
        updated++;
      }
    } else if (s.service_name){
      db.seq.product++;
      db.products.push({
        id: db.seq.product,
        name: '[接码] ' + s.service_name + ' · ' + (s.country_name_zh || ''),
        price: newPrice,
        description: '国家：' + (s.country_name_zh || '') + ' ｜ 服务：' + s.service_name,
        note: '请在 20 分钟内完成注册',
        category_id: 0, active: true, created_at: _now(),
        skus: [], source: 'luban', luban_type: 'sms',
        luban_service_id: sid,
        luban_service_name: s.service_name,
        luban_country: s.country_name_zh || s.country_name_en || '',
        luban_origin_cost: origin.toFixed(2)
      });
      added++;
    }
  });

  /* 上游已删除的服务 → 自动下架 */
  (db.products || []).forEach(function(p){
    if (p.source === 'luban' && p.luban_type === 'sms' && p.luban_service_id && p.active){
      if (!remoteIds[String(p.luban_service_id)]){
        p.active = false;
        p.luban_removed = true;
        removed++;
      }
    }
  });

  db.config.luban_last_sync = Date.now();
  window.saveDB(db);
  return { added: added, updated: updated, removed: removed, restored: restored };
};

/* ============ 自动同步定时器（每 10 分钟检查一次） ============ */
(function(){
  function autoCheck(){
    try {
      var db = window.loadDB();
      var cfg = db.config || {};
      if (cfg.luban_auto_sync === false) return;
      var last = Number(cfg.luban_last_sync) || 0;
      var hours = Number(cfg.luban_sync_interval_hours) || 6;
      if (Date.now() - last < hours * 3600 * 1000) return;

      console.log('[P20] 触发自动同步上游…');
      window.yfLubanFetchAll().then(function(items){
        if (!items || !items.length) return;
        var r = window.yfLubanMergeServices(items);
        console.log('[P20] 自动同步完成：', r);
        var total = r.added + r.updated + r.removed + r.restored;
        if (total > 0){
          _toast('🔄 Luban 自动同步：新增 ' + r.added + '，改价 ' + r.updated + '，下架 ' + r.removed + '，恢复 ' + r.restored);
        }
        if (location.hash.indexOf('#/admin') === 0 && window.renderLuban){
          setTimeout(function(){ window.renderLuban(); }, 500);
        }
      }).catch(function(e){ console.warn('[P20] 自动同步失败:', e); });
    } catch(e){}
  }
  setInterval(autoCheck, 10 * 60 * 1000);
  setTimeout(autoCheck, 30 * 1000);
})();

/* ============ 完全重写 renderLuban ============ */
window.renderLuban = function(){
  var db = window.loadDB();
  var cfg = db.config || {};
  var lubanProducts = db.products.filter(function(p){ return p.source === 'luban'; });
  var markup = Number(cfg.luban_markup) || 1.3;
  var commonCost = Number(cfg.luban_common_cost) || 2;
  var rate = Number(cfg.pay_usdt_rate) || 7.2;
  var autoSync = cfg.luban_auto_sync !== false;
  var syncHours = Number(cfg.luban_sync_interval_hours) || 6;
  var lastSync = Number(cfg.luban_last_sync) || 0;
  var lastSyncText = lastSync ? new Date(lastSync).toLocaleString('zh-CN') : '从未同步';

  var fmtUsdt = function(fen){ return (Number(fen||0)/100/rate).toFixed(2); };
  var fmtYuan = function(fen){ return (Number(fen||0)/100).toFixed(2); };

  var body = document.getElementById('tab-body');
  if (!body) return;

  var html = '';

  /* --- 1. 顶部余额条 --- */
  html += '<div class="card panel" style="padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #86efac">';
  html += '<span style="font-weight:700;color:#065f46">💳 Luban 上游余额：</span>';
  html += '<span id="p20-balance-val" class="mono" style="color:#10b981;font-weight:800;font-size:16px">查询中…</span>';
  html += '<button class="btn ghost sm" id="p20-balance-refresh" style="margin-left:auto;background:#fff">🔄 刷新余额</button>';
  html += '</div>';

  /* --- 2. 加价与同步配置 --- */
  html += '<div class="card panel" style="background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #93c5fd">';
  html += '<h2 style="margin:0 0 14px">⚙️ 加价与同步配置</h2>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px">';
  html += '<label class="field" style="margin:0"><span>接码加价倍数（成本 × 倍数 = 售价）</span><input id="p20-markup" type="number" step="0.05" min="1" value="' + markup + '"></label>';
  html += '<label class="field" style="margin:0"><span>通用接码成本（元/条）</span><input id="p20-common-cost" type="number" step="0.1" min="0.1" value="' + commonCost + '"></label>';
  html += '<label class="field" style="margin:0"><span>汇率（1 USDT = ? CNY）</span><input id="p20-rate" type="number" step="0.01" min="1" value="' + rate + '"></label>';
  html += '</div>';

  /* 价格预览 */
  html += '<div style="background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#1e40af;line-height:1.9">';
  html += '<b>💰 当前规则：</b>售价 = 上游成本(USD) × <b>' + markup + '</b> × 汇率 <b>' + rate + '</b><br>';
  html += '📱 <b>通用接码</b>：成本 <b>' + commonCost + ' 元</b> → 售价 <b style="color:#e11d48;font-size:16px">' + (commonCost * markup).toFixed(2) + ' 元</b>（≈ ' + ((commonCost * markup) / rate).toFixed(2) + ' USDT）';
  html += '</div>';

  /* 自动同步开关 */
  html += '<div style="background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:14px">';
  html += '<label style="display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;font-size:14px">';
  html += '<input type="checkbox" id="p20-auto-sync" ' + (autoSync ? 'checked' : '') + '>';
  html += '启用自动同步（定期检查上游价格/服务变动，自动同步到平台）';
  html += '</label>';
  html += '<div style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;flex-wrap:wrap">';
  html += '<span class="muted">同步间隔：</span>';
  html += '<input id="p20-sync-hours" type="number" min="1" max="72" step="1" value="' + syncHours + '" style="width:80px">';
  html += '<span class="muted">小时</span>';
  html += '<span class="muted" style="margin-left:auto;font-size:12px">🕐 上次同步：' + _esc(lastSyncText) + '</span>';
  html += '</div>';
  html += '</div>';

  /* 按钮 */
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  html += '<button class="btn primary" id="p20-save">💾 保存并重算价格</button>';
  html += '<button class="btn ghost" id="p20-sync-full" style="background:#fff">🔄 立即同步上游商品</button>';
  html += '</div>';
  html += '</div>';

  /* --- 3. 按筛选拉取 --- */
  html += '<div class="card panel">';
  html += '<h2>📥 按筛选拉取</h2>';
  html += '<div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">';
  html += '<div style="flex:1;min-width:160px"><div class="muted" style="font-size:12px;margin-bottom:6px">国家（中文名）</div><input id="luban-filter-country" placeholder="留空 = 全部"></div>';
  html += '<div style="flex:1;min-width:160px"><div class="muted" style="font-size:12px;margin-bottom:6px">服务关键词</div><input id="luban-filter-service" placeholder="留空 = 全部"></div>';
  html += '<button class="btn primary" onclick="lubanSyncServices()">📥 按筛选拉取</button>';
  html += '</div>';
  html += '</div>';

  /* --- 4. 商品列表 --- */
  var activeCount = lubanProducts.filter(function(p){ return p.active; }).length;
  html += '<div class="card panel">';
  html += '<div class="spread" style="margin-bottom:12px;flex-wrap:wrap;gap:8px">';
  html += '<h2 style="margin:0">接码商品列表（' + lubanProducts.length + '，上架 ' + activeCount + '）</h2>';
  html += '<input id="p20-search" placeholder="🔍 搜索服务/国家" style="width:200px;padding:6px 10px;font-size:13px">';
  html += '</div>';

  if (!lubanProducts.length){
    html += '<div class="empty">还没有同步接码服务，点上方「🔄 立即同步上游商品」开始</div>';
  } else {
    html += '<div style="overflow-x:auto"><table id="p20-prod-table"><thead><tr>';
    html += '<th>服务</th><th>国家</th><th>上游成本</th><th>我站售价</th><th>状态</th><th></th>';
    html += '</tr></thead><tbody>';

    lubanProducts.forEach(function(p){
      var originUsd = parseFloat(p.luban_origin_cost || 0);
      var costDisplay = originUsd > 0
        ? '$' + originUsd.toFixed(4) + '<br><span class="muted" style="font-size:11px;font-weight:400">≈ ¥' + (originUsd * rate).toFixed(2) + '</span>'
        : '<span class="muted">未知</span>';
      var priceUsd = fmtUsdt(p.price);
      var priceCny = fmtYuan(p.price);
      var statusBadge;
      if (p.luban_removed) statusBadge = '<span class="badge no">上游已下架</span>';
      else if (p.active) statusBadge = '<span class="badge ok">上架</span>';
      else statusBadge = '<span class="badge gray">下架</span>';

      html += '<tr data-search="' + _esc((p.luban_service_name || p.name || '') + ' ' + (p.luban_country || '')).toLowerCase() + '">';
      html += '<td><b>' + _esc(p.luban_service_name || p.name) + '</b></td>';
      html += '<td>' + _esc(p.luban_country || '-') + '</td>';
      html += '<td class="mono" style="font-size:12px;color:#6b7280">' + costDisplay + '</td>';
      html += '<td style="font-weight:700;color:#e11d48">' + priceUsd + ' USDT<br><span class="muted" style="font-weight:400;font-size:11px">≈ ¥' + priceCny + '</span></td>';
      html += '<td>' + statusBadge + '</td>';
      html += '<td style="text-align:right;white-space:nowrap">';
      html += '<button class="btn sm ghost" onclick="lubanToggleProduct(' + p.id + ')">' + (p.active ? '下架' : '上架') + '</button> ';
      html += '<button class="btn sm danger" onclick="deleteProduct(' + p.id + ')">删除</button>';
      html += '</td></tr>';
    });

    html += '</tbody></table></div>';
  }
  html += '</div>';

  body.innerHTML = html;

  /* ===== 绑定事件 ===== */

  /* 余额查询 */
  function loadBalance(){
    var valEl = document.getElementById('p20-balance-val');
    if (!valEl) return;
    valEl.textContent = '查询中…';
    valEl.style.color = '#6b7280';
    fetch('/api/luban?action=balance')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var el = document.getElementById('p20-balance-val');
        if (!el) return;
        var bal = null;
        if (d){
          if (d.code === 0 && d.msg && d.msg.balance !== undefined) bal = d.msg.balance;
          else if (d.balance !== undefined) bal = d.balance;
          else if (d.msg && typeof d.msg === 'object' && d.msg.balance !== undefined) bal = d.msg.balance;
        }
        if (bal !== null){
          el.textContent = bal + ' USD';
          el.style.color = '#10b981';
        } else {
          el.textContent = '查询失败：' + ((d && d.msg) || '未知响应');
          el.style.color = '#ef4444';
        }
      })
      .catch(function(e){
        var el = document.getElementById('p20-balance-val');
        if (el){
          el.textContent = '查询失败：' + e.message;
          el.style.color = '#ef4444';
        }
      });
  }
  loadBalance();

  var balBtn = document.getElementById('p20-balance-refresh');
  if (balBtn) balBtn.onclick = loadBalance;

  /* 保存并重算 */
  var saveBtn = document.getElementById('p20-save');
  if (saveBtn) saveBtn.onclick = function(){
    var db2 = window.loadDB();
    var m = parseFloat(document.getElementById('p20-markup').value) || 1.3;
    var c = parseFloat(document.getElementById('p20-common-cost').value) || 2;
    var rt = parseFloat(document.getElementById('p20-rate').value) || 7.2;
    var as = document.getElementById('p20-auto-sync').checked;
    var sh = parseFloat(document.getElementById('p20-sync-hours').value) || 6;

    db2.config.luban_markup = m;
    db2.config.luban_common_cost = c;
    db2.config.pay_usdt_rate = rt;
    db2.config.luban_auto_sync = as;
    db2.config.luban_sync_interval_hours = sh;

    var count = 0;
    (db2.products || []).forEach(function(p){
      if (p.source === 'luban' && p.luban_type === 'sms'){
        var origin = parseFloat(p.luban_origin_cost || 0);
        if (origin > 0){
          p.price = Math.max(1, Math.round(origin * rt * m * 100));
          count++;
        }
      }
    });

    window.saveDB(db2);
    _toast('✅ 已保存并重算 ' + count + ' 个商品价格，通用接码售价 ¥' + (c * m).toFixed(2));
    setTimeout(function(){ window.renderLuban(); }, 400);
  };

  /* 立即同步上游商品 */
  var syncBtn = document.getElementById('p20-sync-full');
  if (syncBtn) syncBtn.onclick = function(){
    var db2 = window.loadDB();
    db2.config.luban_markup = parseFloat(document.getElementById('p20-markup').value) || 1.3;
    db2.config.luban_common_cost = parseFloat(document.getElementById('p20-common-cost').value) || 2;
    db2.config.pay_usdt_rate = parseFloat(document.getElementById('p20-rate').value) || 7.2;
    db2.config.luban_auto_sync = document.getElementById('p20-auto-sync').checked;
    db2.config.luban_sync_interval_hours = parseFloat(document.getElementById('p20-sync-hours').value) || 6;
    window.saveDB(db2);

    _toast('正在同步上游商品…');
    var btn = this;
    btn.disabled = true;
    btn.textContent = '同步中…';

    window.yfLubanFetchAll().then(function(items){
      if (!items || !items.length){
        _toast('未拉取到数据', 'error');
        btn.disabled = false;
        btn.textContent = '🔄 立即同步上游商品';
        return;
      }
      var r = window.yfLubanMergeServices(items);
      _toast('✅ 同步完成：新增 ' + r.added + '，改价 ' + r.updated + '，下架 ' + r.removed + '，恢复 ' + r.restored);
      setTimeout(function(){ window.renderLuban(); }, 500);
    }).catch(function(e){
      _toast('同步失败：' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = '🔄 立即同步上游商品';
    });
  };

  /* 商品列表搜索 */
  var searchEl = document.getElementById('p20-search');
  if (searchEl) searchEl.oninput = function(){
    var kw = this.value.trim().toLowerCase();
    var rows = document.querySelectorAll('#p20-prod-table tbody tr');
    rows.forEach(function(tr){
      var s = tr.getAttribute('data-search') || '';
      tr.style.display = (!kw || s.indexOf(kw) >= 0) ? '' : 'none';
    });
  };
};

console.log('%c[P20] Luban 管理增强：余额条 + 通用接码成本 + 自动同步 已加载',
  'color:#6366f1;font-weight:bold;font-size:13px');
})();
</script>
