<!DOCTYPE html>

<title>云发卡 · 自动发货</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e8eaf0;--primary:#6366f1;--primary2:#8b5cf6;--danger:#ef4444;--ok:#10b981;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -8px rgba(16,24,40,.12)}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font-family:inherit}
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:inline-block;flex-shrink:0}
.nav nav{display:flex;gap:6px;align-items:center}
.nav nav a{padding:8px 14px;border-radius:10px;font-size:14px;color:var(--muted);transition:.15s;white-space:nowrap}
.nav nav a:hover{background:#f0f1f6;color:var(--text)}
.tg-btn{display:inline-flex!important;align-items:center;gap:5px;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;color:#fff!important;background:linear-gradient(135deg,#29b6f6,#0088cc);box-shadow:0 4px 12px -4px rgba(0,136,204,.7);transition:.18s}
.tg-btn:hover{transform:translateY(-1px);filter:brightness(1.05);background:#0088cc!important}
.tg-btn svg{width:16px;height:16px;fill:#fff}
.tg-float{position:fixed;right:22px;bottom:26px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#29b6f6,#0088cc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -6px rgba(0,136,204,.75);z-index:150;transition:.2s}
.tg-float:hover{transform:scale(1.08) translateY(-2px)}
.tg-float svg{width:26px;height:26px;fill:#fff}
.tg-float::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0,136,204,.35);animation:pulse 2.2s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
main{max-width:1080px;margin:0 auto;padding:24px 20px 90px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;background:#eef0f6;color:var(--text)}
.btn:hover{filter:brightness(.97)}.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 14px -4px rgba(99,102,241,.6)}
.btn.danger{background:#fee2e2;color:#b91c1c}.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}.btn.block{display:block;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;outline:none;transition:.15s;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
input[type=checkbox]{width:auto;accent-color:var(--primary)}
label.field{display:block;margin-bottom:14px}
label.field > span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}

.hero h1{margin:0 0 8px;font-size:26px;letter-spacing:.5px}.hero p{margin:0;opacity:.92;font-size:14px}

.cat-tab{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;font-family:inherit}
.cat-tab:hover{border-color:#c7cbe0;color:var(--text)}
.cat-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;box-shadow:0 4px 12px -4px rgba(99,102,241,.55)}
.cat-tab .n{opacity:.65;font-weight:500;margin-left:5px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.product{padding:20px;display:flex;flex-direction:column;gap:12px;transition:.18s}
.product:hover{transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(16,24,40,.22)}
.p-name{font-size:16px;font-weight:700}

.p-price{font-size:22px;font-weight:800;color:#e11d48}.p-price small{font-size:13px;font-weight:600}

.sku-tags{display:flex;flex-wrap:wrap;gap:4px}

.codebox{background:#0f172a;color:#7dd3fc;padding:14px 16px;border-radius:10px;font-size:15px;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}

.redpacket-box .lbl{font-size:13px;opacity:.9;margin-bottom:8px;position:relative;z-index:1}
.redpacket-box .code{font-size:32px;font-weight:900;letter-spacing:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-bottom:12px;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.2)}

.redpacket-steps{background:#fff5f5;border:1px dashed #fc8181;border-radius:10px;padding:14px 18px;font-size:13px;color:#742a2a;line-height:2;margin-bottom:14px}

.redpacket-steps b{color:#c53030}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:18px;width:100%;max-width:440px;padding:24px;box-shadow:0 24px 60px -12px rgba(0,0,0,.35);animation:pop .2s;max-height:90vh;overflow-y:auto}

.modal.wide{max-width:560px}
.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);background:#1f2430;color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#b91c1c}.toast.success{background:#047857}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{padding:9px 16px;border-radius:10px;border:0;background:#eef0f6;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}

.section-title{font-size:15px;font-weight:700;margin:26px 0 12px}
.member-card{background:linear-gradient(135deg,#1e293b,#334155);border-radius:18px;padding:22px 24px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden}

.member-card .amt{font-size:34px;font-weight:800;letter-spacing:.5px}
.member-card .amt small{font-size:16px;font-weight:600;opacity:.85}
.member-card .id{font-size:12px;opacity:.7;margin-top:8px;position:relative;z-index:1;line-height:1.8}
.member-card .id b{color:#c7d2fe}
.quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick-amounts button{padding:10px 18px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);font-family:inherit;transition:.15s}
.quick-amounts button:hover{border-color:var(--primary);color:var(--primary)}

.auth-panel{max-width:420px;margin:40px auto}
.auth-tabs{display:flex;background:#eef0f6;border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:10px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);border-radius:9px;transition:.15s;font-family:inherit}

.auth-tip{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.7}
.field-err{color:#b91c1c;font-size:12px;margin-top:6px;display:block;min-height:14px}
.find-pwd-link{text-align:center;font-size:13px;margin:10px 0 0}
.find-pwd-link a{color:#6366f1;font-weight:600}
.rp-code-cell{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;color:#e91e63;letter-spacing:1px;font-size:13px}
.sku-editor{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.sku-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}

.sku-row .sku-name{flex:2}

@media (max-width:600px){.nav nav a:not(.tg-btn){padding:8px 9px;font-size:13px}#nav-tg{display:none!important}.hero h1{font-size:21px}.tg-float{right:16px;bottom:18px;width:50px;height:50px}.pay-method{min-width:80px;padding:10px 12px;font-size:13px}.member-card .amt{font-size:28px}.redpacket-box .code{font-size:26px;letter-spacing:2px}.modal.wide{max-width:100%}}
</style>
</head>

<script>
/* ==================================================================
   云发卡 v12：SKU 多规格 + TG 订单通知 + 口令红包 + USDT 自动检测
   （兼容旧浏览器版本，不使用 ?. ?? ||= 等新语法）
   ================================================================== */
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); };
var yuan = function (fen) { return (Number(fen || 0) / 100).toFixed(2); };

var toastTimer;
function toast(msg, type) {
  var t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = 'toast'; }, 2600);
}
function openModal(html, wide) {
  $('#modal-box').innerHTML = html;
  $('#modal-box').classList.toggle('wide', !!wide);
  $('#modal').classList.remove('hidden');
}
function closeModal() { $('#modal').classList.add('hidden'); $('#modal-box').innerHTML = ''; }
$('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });

function copyText(text, btn) {
  var done = function () { var o = btn.textContent; btn.textContent='已复制 ✓'; setTimeout(function(){btn.textContent=o;},1400); };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(text).then(done).catch(function(){fallbackCopy(text,done);});
  else fallbackCopy(text, done);
}
function fallbackCopy(text, cb) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e) { toast('复制失败','error'); }
  document.body.removeChild(ta);
}

function hashPwd(pwd) {
  var salt = 'yfk2024salt';
  var str = salt + '::' + pwd + '::' + salt;
  var h1 = 0x811c9dc5, h2 = 0x1000193;
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 + c, 0x85ebca6b) >>> 0;
  }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}

/* ---------------- 数据层 ---------------- */
var STORE_KEY = 'yunfaka_db_v12';
var MY_KEY = 'yunfaka_my_orders';
var MEMBER_KEY = 'yunfaka_member_user';
var LS_SECRET = 'yunfaka_last_secret';
var SS_ADMIN = 'yunfaka_admin';

function now() {
  var d = new Date(), p = function (n) { return String(n).padStart(2,'0'); };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function randStr(len) {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var s=''; for(var i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function genCard() { return randStr(4) + '-' + randStr(4) + '-' + randStr(4) + '-' + randStr(4); }
function genOrderNo() {
  var d = new Date(), p = function(n){return String(n).padStart(2,'0');};
  return '' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + Math.floor(Math.random()*9000+1000);
}
function genRechargeId() { return 'R'+Date.now()+Math.floor(Math.random()*900+100); }
function genSkuId() { return Date.now() + Math.floor(Math.random()*1000); }
function genRedpacketCode(prefix) {
  var p = String(prefix || 'YFK').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'YFK';
  return p + randStr(6);
}

function seedDB() {
  var db = { seq:{product:0,card:0,category:0}, config:Object.assign({}, DEFAULT_CONFIG),
    categories:[], products:[], cards:[], orders:[], members:[], recharges:[] };
  var addCat = function(name){ var id = ++db.seq.category; db.categories.push({id:id,name:name}); return id; };
  var c1 = addCat('会员卡券'), c2 = addCat('游戏点卡'), c3 = addCat('软件工具');

  var addProductWithSkus = function(name, desc, note, catId, skus, cardsPerSku) {
    var id = ++db.seq.product;
    var product = {
      id: id, name: name, description: desc, note: note, active: true,
      category_id: catId, created_at: now(), skus: []
    };
    for (var i = 0; i < skus.length; i++) {
      product.skus.push({ id: genSkuId() + i, name: skus[i].name, price: skus[i].price });
    }
    db.products.push(product);
    for (var si = 0; si < product.skus.length; si++) {
      for (var k=0;k<cardsPerSku[si];k++){
        db.seq.card++;
        db.cards.push({
          id: db.seq.card, product_id: id, sku_id: product.skus[si].id,
          content: genCard(), status:'unused', order_no:'', used_at:'', created_at: now()
        });
      }
    }
  };

  var addProduct = function(name, price, desc, note, catId, cardCount) {
    var id = ++db.seq.product;
    db.products.push({ id: id, name: name, price: price, description: desc, note: note, active: true, category_id: catId, created_at: now(), skus: [] });
    for (var i=0;i<cardCount;i++){
      db.seq.card++;
      db.cards.push({ id: db.seq.card, product_id: id, sku_id: 0, content: genCard(), status:'unused', order_no:'', used_at:'', created_at: now() });
    }
  };

  addProductWithSkus('视频会员', '多规格可选，自动发货', '请前往官方 App 兑换', c1,
    [{name:'1个月', price:990},{name:'3个月', price:2580},{name:'1年', price:8800}], [8,5,3]);
  addProduct('音乐会员季卡', 2580, '自动发货 · 支持全网通', '兑换后 90 天内有效', c1, 5);
  addProduct('云盘超级会员年卡', 9900, '官方直充 · 秒到账', '请勿泄露卡密', c1, 3);
  addProduct('游戏点券 1000 点', 8800, '自动发货 · 全国通用', '充值后立即到账', c2, 0);
  addProduct('PDF 转换工具 1 年授权', 4900, '官方授权 · 自动发码', '激活后一年内有效', c3, 6);
  return db;
}
function loadDB() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) { var d = seedDB(); saveDB(d); return d; }
    var dd = JSON.parse(raw);
    if (!dd.products || !dd.cards || !dd.orders) throw new Error('bad');
    if (!dd.config) dd.config = Object.assign({}, DEFAULT_CONFIG);
    Object.keys(DEFAULT_CONFIG).forEach(function(k){ if (dd.config[k] === undefined) dd.config[k] = DEFAULT_CONFIG[k]; });
    if (!Array.isArray(dd.categories)) dd.categories = [];
    if (!Array.isArray(dd.members)) dd.members = [];
    if (!Array.isArray(dd.recharges)) dd.recharges = [];
    dd.products.forEach(function(p){ if (!Array.isArray(p.skus)) p.skus = []; });
    dd.cards.forEach(function(c){ if (c.sku_id === undefined) c.sku_id = 0; });
    dd.members = dd.members.filter(function(m){ return m && m.username && m.password; });
    dd.members.forEach(function(m){ if (m.secret === undefined && m.contact !== undefined) m.secret = m.contact; });
    dd.orders.forEach(function(o){ if (o.secret === undefined && o.contact !== undefined) o.secret = o.contact; });
    if (!dd.seq) dd.seq = {product:0,card:0,category:0};
    if (!dd.seq.category) dd.seq.category = dd.categories.reduce(function(m,c){ return Math.max(m, c.id||0); }, 0);
    return dd;
  } catch(e) { var d2 = seedDB(); saveDB(d2); return d2; }
}
function saveDB(db) { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
function getConfig(db) { return db.config || DEFAULT_CONFIG; }

function getSkus(p) { return (p && Array.isArray(p.skus)) ? p.skus : []; }
function hasSkus(p) { return getSkus(p).length > 0; }
function getMinPrice(p) {
  var skus = getSkus(p);
  if (!skus.length) return p.price;
  var min = skus[0].price;
  for (var i = 1; i < skus.length; i++) { if (skus[i].price < min) min = skus[i].price; }
  return min;
}
function getSkuById(p, skuId) {
  var skus = getSkus(p);
  for (var i = 0; i < skus.length; i++) {
    if (String(skus[i].id) === String(skuId)) return skus[i];
  }
  return null;
}
function productStock(db, p, skuId) {
  if (!hasSkus(p)) {
    return db.cards.filter(function(c){ return c.product_id === p.id && c.status === 'unused' && (!c.sku_id || c.sku_id === 0); }).length;
  }
  if (skuId === undefined) {
    return db.cards.filter(function(c){ return c.product_id === p.id && c.status === 'unused'; }).length;
  }
  return db.cards.filter(function(c){ return c.product_id === p.id && c.status === 'unused' && String(c.sku_id) === String(skuId); }).length;
}
function getAdminPwdHash(db) {
  var cfg = db.config || {};
  return cfg.admin_pwd_hash || DEFAULT_CONFIG.admin_pwd_hash;
}
function stockOf(db, pid) {
  return db.cards.filter(function(c){ return c.product_id===pid && c.status==='unused'; }).length;
}

function getCurrentUsername() { return localStorage.getItem(MEMBER_KEY) || ''; }
function setCurrentUsername(u) { if (u) localStorage.setItem(MEMBER_KEY, u); else localStorage.removeItem(MEMBER_KEY); }
function getCurrentMember(db) {
  var u = getCurrentUsername();
  if (!u) return null;
  return db.members.find(function(m){ return m.username === u; }) || null;
}
function findMemberByUsername(db, u) { return db.members.find(function(m){ return m.username === u; }); }

function validateUsername(u) {
  if (!u) return '请输入账号';
  if (u.length < 3 || u.length > 20) return '账号长度 3-20 位';
  if (!/^[a-zA-Z0-9_]+$/.test(u)) return '账号只能包含字母、数字、下划线';
  return '';
}
function validatePassword(p) {
  if (!p) return '请输入密码';
  if (p.length < 6) return '密码至少 6 位';
  if (p.length > 40) return '密码最长 40 位';
  return '';
}
function validateSecret(s) {
  if (!s) return '请输入暗号';
  if (s.length < 2) return '暗号至少 2 个字符';
  if (s.length > 60) return '暗号最长 60 个字符';
  return '';
}
function addBalance(db, username, amount) {
  var m = findMemberByUsername(db, username);
  if (!m) return false;
  m.balance = (m.balance||0) + amount; return true;
}
function deductBalance(db, username, amount) {
  var m = findMemberByUsername(db, username);
  if (!m || (m.balance||0) < amount) return false;
  m.balance -= amount; return true;
}
function memberBalance(db, username) {
  var m = findMemberByUsername(db, username);
  return m ? (m.balance||0) : 0;
}

function route() {
  var hash = location.hash.replace(/^#/,'') || '/';
  window.scrollTo(0,0);
  if (hash.indexOf('/order/') === 0) return renderOrderPage(decodeURIComponent(hash.slice(7)));
  if (hash.indexOf('/query') === 0)  return renderQueryPage();
  if (hash.indexOf('/member') === 0) return renderMemberPage();
  if (hash.indexOf('/admin') === 0)  return renderAdminPage();
  return renderHome();
}

      box.innerHTML = '<div class="balance-row" style="background:#f1f5f9;border-color:#cbd5e1;color:#475569"><div class="lbl" style="color:#475569">💎 登录会员可用余额抵扣</div><a href="#/member" onclick="closeModal()" style="font-size:13px;color:#6366f1;font-weight:600">去登录 →</a></div>';
    } else box.innerHTML = '';
    refreshTotals();
  };
  var refreshTotals = function() {
    var q = parseInt(qty.value) || 1;
    var price = getCurrentPrice();
    var amount = price * q;
    var m = getCurrentMember(loadDB());
    var balance = m ? (m.balance||0) : 0;
    var cb = $('#use-balance');
    var useBalance = cb && cb.checked && balanceEnabled && m;
    var deduct = useBalance ? Math.min(balance, amount) : 0;
    var due = amount - deduct;
    $('#buy-unit').textContent = '¥' + yuan(price);
    $('#buy-amount').textContent = '¥' + yuan(amount);
    $('#buy-deduct').textContent = '-¥' + yuan(deduct);
    $('#buy-due').textContent = '¥' + yuan(due);
    var wrap = $('#pay-method-wrap');
    if (due === 0) { wrap.style.opacity='0.4'; wrap.style.pointerEvents='none'; }
    else { wrap.style.opacity='1'; wrap.style.pointerEvents='auto'; }
  };
  var refreshStock = function() {
    var st = getCurrentStock();
    var maxQ = Math.min(50, st);
    qty.setAttribute('max', maxQ);
    if (parseInt(qty.value) > maxQ) qty.value = maxQ;
    $('#buy-stock-label').textContent = st;
    var submitBtn = $('#buy-submit');
    if (st <= 0) { submitBtn.disabled = true; submitBtn.textContent = '该规格缺货'; }
    else { submitBtn.disabled = false; submitBtn.textContent = '确认订单'; }
    refreshTotals();
  };

  if (hasSku) {
    document.querySelectorAll('#buy-skus .sku-option').forEach(function(el){
      el.addEventListener('click', function(){
        if (el.disabled) return;
        document.querySelectorAll('#buy-skus .sku-option').forEach(function(x){x.classList.remove('active');});
        el.classList.add('active');
        currentSkuId = parseInt(el.dataset.sku);
        refreshStock();
      });
    });
  }

  qty.addEventListener('input', function(){
    var v = parseInt(qty.value) || 1;
    var maxQ = Math.min(50, getCurrentStock());
    v = Math.max(1, Math.min(maxQ, v));
    qty.value = v; refreshTotals();
  });
  secretEl.addEventListener('keydown', function(e){ if (e.key==='Enter') submitBuy(p.id); });
  document.querySelectorAll('#pay-methods .pay-method').forEach(function(el){
    el.addEventListener('click', function(){
      document.querySelectorAll('#pay-methods .pay-method').forEach(function(x){x.classList.remove('active');});
      el.classList.add('active');
      var r = el.querySelector('input[type=radio]');
      if (r) r.checked = true;
    });
  });

  window.__buyCurrentSkuId = function () { return currentSkuId; };
  refreshBalance();
  qty.focus(); qty.select();
}

function submitBuy(id) {
  var db = loadDB();
  var cfg = getConfig(db);
  var p = db.products.find(function(x){return x.id === id;});
  if (!p) { toast('商品不存在','error'); return; }
  var hasSku = hasSkus(p);
  var currentSkuId = (typeof window.__buyCurrentSkuId === 'function') ? window.__buyCurrentSkuId() : 0;

  var qtyEl = $('#buy-qty'), secretEl = $('#buy-secret');
  var qty = parseInt(qtyEl.value) || 1;
  var secret = secretEl.value.trim();
  var sErr = validateSecret(secret);
  if (sErr) { toast(sErr,'error'); secretEl.focus(); return; }

  var sku = hasSku ? getSkuById(p, currentSkuId) : null;
  if (hasSku && !sku) { toast('请选择规格','error'); return; }
  var price = hasSku ? sku.price : p.price;
  var stock = productStock(db, p, hasSku ? sku.id : 0);

  if (qty < 1) { toast('数量至少为 1','error'); return; }
  if (qty > stock) { toast('库存不足，当前仅剩 ' + stock + ' 件','error'); return; }

  var amount = price * qty;
  var balanceEnabled = cfg.balance_enabled !== false;
  var member = getCurrentMember(db);
  var cb = $('#use-balance');
  var useBalance = cb && cb.checked && balanceEnabled && member;
  var deduct = 0;
  if (useBalance) {
    var bal = member.balance || 0;
    deduct = Math.min(bal, amount);
    if (deduct > 0 && !deductBalance(db, member.username, deduct)) { toast('余额扣除失败','error'); return; }
  }
  var due = amount - deduct;
  var payMethod = 'balance';
  if (due > 0) {
    var radio = document.querySelector('input[name="pay-method"]:checked');
    if (!radio) { toast('请选择支付方式','error'); return; }
    payMethod = radio.value;
  }
  var orderNo = genOrderNo();
  var order = {
    order_no: orderNo, product_id: id, product_name: p.name,
    sku_id: hasSku ? sku.id : 0,
    sku_name: hasSku ? sku.name : '',
    category_id: p.category_id || 0, quantity: qty, amount: amount, balance_used: deduct,
    amount_due: due, secret: secret, username: member?member.username:'', status: 'pending',
    pay_method: payMethod, cards: [], note: p.note || '', created_at: now(), delivered_at: ''
  };
  if (payMethod === 'alipay') {
    order.redpacket_code = genRedpacketCode(cfg.pay_alipay_redpacket_prefix);
  }
  db.orders.unshift(order);
  saveDB(db);
  saveMyOrder(orderNo, secret);
  localStorage.setItem(LS_SECRET, secret);
  closeModal();
  if (due === 0) {
    payOrder(orderNo);
    toast('余额支付成功，已自动发货 🎉','success');
    if (location.hash === '#/order/'+orderNo) route(); else location.hash = '#/order/'+orderNo;
  } else showPayModal('order', orderNo);
}

function confirmPay(type, id) {
  if (type === 'order') {
    var db = loadDB();
    var o = db.orders.find(function(x){return x.order_no === id;});
    if (!o) return;
    if (o.pay_method === 'usdt') {
      toast('USDT 到账将自动检测，请等待…', 'success');
      closeModal();
      if (location.hash === '#/order/'+id) route(); else location.hash = '#/order/'+id;
      return;
    }
    o.status = 'pending_review';
    o.submitted_at = now();
    saveDB(db);
    closeModal();
    toast('已提交，正在通知商家审核', 'success');
    notifyTg(o.order_no);
    if (location.hash === '#/order/'+id) route(); else location.hash = '#/order/'+id;
  } else if (type === 'recharge') {
    var db2 = loadDB();
    var r = db2.recharges.find(function(x){return x.id === id;});
    if (!r) return;
    if (r.status === 'success') { toast('该充值已到账','success'); return; }
    if (!addBalance(db2, r.username, r.amount)) { toast('账号不存在','error'); return; }
    r.status = 'success'; r.completed_at = now();
    saveDB(db2);
    closeModal();
    toast('充值成功，余额已到账 💰','success');
    if (location.hash === '#/member') route(); else location.hash = '#/member';
  }
}
function payOrder(orderNo) {
  var db = loadDB();
  var o = db.orders.find(function(x){return x.order_no === orderNo;});
  if (!o || o.status !== 'pending') return;
  var available = db.cards.filter(function(c){
    if (c.product_id !== o.product_id) return false;
    if (c.status !== 'unused') return false;
    var orderSku = o.sku_id || 0;
    var cardSku = c.sku_id || 0;
    return String(orderSku) === String(cardSku);
  });
  if (available.length >= o.quantity) {
    available.slice(0, o.quantity).forEach(function(c){
      c.status='used'; c.order_no=o.order_no; c.used_at=now();
      o.cards.push(c.content);
    });
    o.status = 'delivered'; o.delivered_at = now();
  } else o.status = 'out_of_stock';
  saveDB(db);
}

/* ---------------- USDT 自动检测 ---------------- */
var _usdtPollTimer = null;
function startUsdtPolling(orderNo) {
  if (_usdtPollTimer) clearInterval(_usdtPollTimer);
  var check = function () {
    fetch('/api/usdt-check?order=' + encodeURIComponent(orderNo)).then(function(r){return r.json();}).then(function(d){
      if (d && d.ok && d.status && d.status !== 'pending') {
        clearInterval(_usdtPollTimer);
        _usdtPollTimer = null;
        toast('USDT 已到账，系统已自动发货 🎉', 'success');
        fetch('/api/state?t=' + Date.now()).then(function(r2){return r2.json();}).then(function(d2){
          if (d2 && d2.ok && d2.db) { window.__DB = d2.db; }
          route();
        });
      }
    }).catch(function(){});
  };
  check();
  _usdtPollTimer = setInterval(check, 30000);
}

function forceCheckUsdt(orderNo) {
  toast('正在检测…');
  fetch('/api/usdt-check?order=' + encodeURIComponent(orderNo)).then(function(r){return r.json();}).then(function(d){
    if (d && d.ok && d.status && d.status !== 'pending') {
      toast('USDT 已到账，系统已自动发货 🎉', 'success');
      fetch('/api/state?t=' + Date.now()).then(function(r2){return r2.json();}).then(function(d2){
        if (d2 && d2.ok && d2.db) { window.__DB = d2.db; }
        route();
      });
    } else if (d && d.ok) {
      toast('暂未检测到匹配的转账，请稍后重试', 'error');
    } else {
      toast((d && d.msg) || '检测失败', 'error');
    }
  }).catch(function(){ toast('网络错误', 'error'); });
}

/* ---------------- 管理员审核 ---------------- */
function approveOrder(orderNo) {
  var db = loadDB();
  var o = db.orders.find(function(x){return x.order_no === orderNo;});
  if (!o) return;
  if (o.status !== 'pending_review') { toast('订单状态不对', 'error'); return; }
  if (!confirm('确认已收款 ¥' + yuan(o.amount_due) + '，为客户发货？')) return;

  var orderSku = o.sku_id || 0;
  var available = db.cards.filter(function(c){
    if (c.product_id !== o.product_id) return false;
    if (c.status !== 'unused') return false;
    var cardSku = c.sku_id || 0;
    return String(cardSku) === String(orderSku);
  });
  if (available.length < o.quantity) {
    toast('该规格库存不足，需要 ' + o.quantity + ' 条，只有 ' + available.length + ' 条', 'error');
    return;
  }
  available.slice(0, o.quantity).forEach(function(c){
    c.status = 'used';
    c.order_no = o.order_no;
    c.used_at = now();
    o.cards.push(c.content);
  });
  o.status = 'delivered';
  o.delivered_at = now();
  o.approved_at = now();
  saveDB(db);
  toast('已确认发货 ✅', 'success');
  renderOrders();
}

function rejectOrder(orderNo) {
  var db = loadDB();
  var o = db.orders.find(function(x){return x.order_no === orderNo;});
  if (!o) return;
  if (!confirm('确定驳回订单 ' + orderNo + '？客户将看到"订单已驳回"。')) return;
  o.status = 'rejected';
  o.rejected_at = now();
  saveDB(db);
  toast('订单已驳回', 'success');
  renderOrders();
}

function resendTg(orderNo) {
  var db = loadDB();
  var cfg = getConfig(db);
  if (!cfg.tg_bot_token || !cfg.tg_chat_id) {
    toast('请先在「设置」里配置 TG Bot Token 和 Chat ID', 'error');
    return;
  }
  toast('正在发送…');
  fetch('/api/tg-notify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order_no: orderNo })
  }).then(function(r){return r.json();}).then(function(d){
    if (d && d.ok) toast('TG 通知已发送 ✅', 'success');
    else toast((d && d.msg) || '发送失败', 'error');
  }).catch(function(){ toast('网络错误', 'error'); });
}

function memberRegister() {
  var username = $('#reg-username').value.trim();
  var password = $('#reg-password').value;
  var confirm = $('#reg-confirm').value;
  var secret = $('#reg-secret').value.trim();
  var errEl = $('#reg-err');
  var uErr = validateUsername(username);
  if (uErr) { errEl.textContent=uErr; toast(uErr,'error'); return; }
  var pErr = validatePassword(password);
  if (pErr) { errEl.textContent=pErr; toast(pErr,'error'); return; }
  if (password !== confirm) { errEl.textContent='两次输入的密码不一致'; toast('两次输入的密码不一致','error'); return; }
  var sErr = validateSecret(secret);
  if (sErr) { errEl.textContent=sErr; toast(sErr,'error'); return; }
  errEl.textContent = '';
  var db = loadDB();
  if (findMemberByUsername(db, username)) { errEl.textContent='该账号已被注册'; toast('该账号已被注册','error'); return; }
  db.members.push({ username: username, password: hashPwd(password), secret: secret, balance: 0, created_at: now() });
  saveDB(db);
  setCurrentUsername(username);
  localStorage.setItem(LS_SECRET, secret);
  toast('注册成功，已自动登录 🎉','success');
  route();
}
function memberLogin() {
  var username = $('#login-username').value.trim();
  var password = $('#login-password').value;
  var errEl = $('#login-err');
  if (!username) { errEl.textContent='请输入账号'; toast('请输入账号','error'); return; }
  if (!password) { errEl.textContent='请输入密码'; toast('请输入密码','error'); return; }
  var db = loadDB();
  var m = findMemberByUsername(db, username);
  if (!m) { errEl.textContent='账号不存在'; toast('账号不存在','error'); return; }
  if (m.password !== hashPwd(password)) { errEl.textContent='密码错误'; toast('密码错误','error'); return; }
  errEl.textContent = '';
  setCurrentUsername(username);
  if (m.secret) localStorage.setItem(LS_SECRET, m.secret);
  toast('登录成功','success');
  route();
}
function memberFindPwd() {
  var username = $('#fp-username').value.trim();
  var secret = $('#fp-secret').value.trim();
  var errEl = $('#fp-err');
  if (!username) { errEl.textContent='请输入账号'; toast('请输入账号','error'); return; }
  if (!secret) { errEl.textContent='请输入暗号'; toast('请输入暗号','error'); return; }
  var db = loadDB();
  var m = findMemberByUsername(db, username);
  if (!m) { errEl.textContent='账号不存在'; toast('账号不存在','error'); return; }
  if (m.secret !== secret) { errEl.textContent='暗号错误'; toast('暗号错误','error'); return; }
  errEl.textContent = '';
  openResetPwdByUser(username);
}
function openResetPwdByUser(username) {
  openModal('<h3>重置登录密码</h3>' +
    '<div class="kv" style="margin-bottom:14px"><span class="k">账号</span><span class="v">' + esc(username) + '</span></div>' +
    '<label class="field"><span>新密码（至少 6 位）</span><input id="fp-newpwd" type="password" placeholder="请输入新密码" maxlength="40"></label>' +
    '<label class="field"><span>确认新密码</span><input id="fp-newpwd2" type="password" placeholder="再次输入新密码" maxlength="40"></label>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveFindPwd(\'' + esc(username) + '\')">确认重置</button></div>');
  ['#fp-newpwd','#fp-newpwd2'].forEach(function(s){
    var el=$(s); if(el) el.addEventListener('keydown',function(e){if(e.key==='Enter')saveFindPwd(username);});
  });
  var p = $('#fp-newpwd'); if (p) p.focus();
}
function saveFindPwd(username) {
  var p1 = $('#fp-newpwd').value, p2 = $('#fp-newpwd2').value;
  var pErr = validatePassword(p1);
  if (pErr) { toast(pErr,'error'); return; }
  if (p1 !== p2) { toast('两次输入的密码不一致','error'); return; }
  var db = loadDB();
  var m = findMemberByUsername(db, username);
  if (!m) { toast('账号不存在','error'); return; }
  m.password = hashPwd(p1);
  saveDB(db);
  closeModal();
  toast('密码已重置，请使用新密码登录','success');
  authTab = 'login';
  renderAuthPage();
}

function submitRecharge() {
  var db = loadDB();
  var cfg = getConfig(db);
  var member = getCurrentMember(db);
  if (!member) { toast('请先登录','error'); return; }
  var amount = Math.round(parseFloat($('#rc-amount').value || '0') * 100);
  var min = cfg.recharge_min || 1000;
  if (!(amount >= min)) { toast('最低充值 ¥' + yuan(min),'error'); return; }
  var radio = document.querySelector('input[name="rc-method"]:checked');
  if (!radio) { toast('请选择支付方式','error'); return; }
  var id = genRechargeId();
  var rc = {
    id: id, username: member.username, secret: member.secret || '',
    amount: amount, method: radio.value, status: 'pending', created_at: now(), completed_at: ''
  };
  if (radio.value === 'alipay') {
    rc.redpacket_code = genRedpacketCode(cfg.pay_alipay_redpacket_prefix);
  }
  db.recharges.unshift(rc);
  saveDB(db);
  showPayModal('recharge', id);
}

  $('#nc-name').addEventListener('keydown', function(e){ if (e.key==='Enter') createCategory(); });

function createCategory() {
  var name = $('#nc-name').value.trim();
  if (!name) { toast('请输入分类名称','error'); return; }
  var db = loadDB();
  if (db.categories.some(function(c){return c.name === name;})) { toast('该分类已存在','error'); return; }
  db.seq.category++;
  db.categories.push({ id: db.seq.category, name: name });
  saveDB(db);
  toast('分类已添加','success');
  renderCategories();
}
function editCategory(id) {
  var db = loadDB();
  var c = db.categories.find(function(x){return x.id === id;});
  if (!c) return;
  openModal('<h3>重命名分类</h3>' +
    '<label class="field"><span>分类名称</span><input id="ec-name" value="' + esc(c.name) + '" maxlength="12"></label>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveCategory(' + id + ')">保存</button></div>');
  var inp = $('#ec-name');
  inp.focus(); inp.select();
  inp.addEventListener('keydown', function(e){ if (e.key==='Enter') saveCategory(id); });
}
function saveCategory(id) {
  var name = $('#ec-name').value.trim();
  if (!name) { toast('分类名称不能为空','error'); return; }
  var db = loadDB();
  if (db.categories.some(function(c){return c.id !== id && c.name === name;})) { toast('该分类名已存在','error'); return; }
  var c = db.categories.find(function(x){return x.id === id;});
  if (!c) return;
  c.name = name;
  saveDB(db);
  closeModal();
  toast('已保存','success');
  renderCategories();
}
function moveCategory(id, dir) {
  var db = loadDB();
  var i = db.categories.findIndex(function(c){return c.id === id;});
  var j = i + dir;
  if (i < 0 || j < 0 || j >= db.categories.length) return;
  var tmp = db.categories[i]; db.categories[i] = db.categories[j]; db.categories[j] = tmp;
  saveDB(db);
  renderCategories();
}
function deleteCategory(id) {
  var db = loadDB();
  var c = db.categories.find(function(x){return x.id === id;});
  if (!c) return;
  var n = db.products.filter(function(p){return String(p.category_id) === String(id);}).length;
  var msg = n > 0 ? '分类「' + c.name + '」下有 ' + n + ' 个商品，删除后这些商品将变为「未分类」。确定删除？' : '确定删除分类「' + c.name + '」？';
  if (!confirm(msg)) return;
  db.categories = db.categories.filter(function(x){return x.id !== id;});
  db.products.forEach(function(p){ if (String(p.category_id) === String(id)) p.category_id = 0; });
  saveDB(db);
  toast('分类已删除','success');
  renderCategories();
}

function categoryOptions(db, selectedId) {
  var sel = String(selectedId || 0);
  var opts = '<option value="0" ' + (sel==='0'?'selected':'') + '>未分类</option>';
  db.categories.forEach(function(c){ opts += '<option value="' + c.id + '" ' + (sel===String(c.id)?'selected':'') + '>' + esc(c.name) + '</option>'; });
  return opts;
}

function skuEditorHtml(skus) {
  var list = Array.isArray(skus) ? skus : [];
  var rows = '';
  list.forEach(function(s){
    rows += '<div class="sku-row" data-sku-id="' + s.id + '">' +
      '<input class="sku-name" type="text" value="' + esc(s.name) + '" placeholder="规格名，如：1个月" maxlength="20">' +
      '<input class="sku-price" type="number" step="0.01" value="' + (s.price/100).toFixed(2) + '" placeholder="价格">' +
      '<button class="sku-del" type="button" onclick="removeSkuRow(this)">删除</button>' +
    '</div>';
  });
  return '<div class="sku-editor" id="sku-editor">' +
    '<div class="sku-hint">💡 不添加规格 = 单价格商品；添加多条 = 客户购买时选择规格（每条规格独立价格和卡密池）</div>' +
    '<div id="sku-rows">' + rows + '</div>' +
    '<button class="sku-add" type="button" onclick="addSkuRow()">+ 添加规格</button>' +
  '</div>';
}

function addSkuRow() {
  var box = document.getElementById('sku-rows');
  if (!box) return;
  var div = document.createElement('div');
  div.className = 'sku-row';
  div.dataset.skuId = String(genSkuId());
  div.innerHTML = '<input class="sku-name" type="text" placeholder="规格名，如：3个月" maxlength="20">' +
    '<input class="sku-price" type="number" step="0.01" placeholder="价格">' +
    '<button class="sku-del" type="button" onclick="removeSkuRow(this)">删除</button>';
  box.appendChild(div);
  var nameInput = div.querySelector('.sku-name');
  if (nameInput) nameInput.focus();
}
function removeSkuRow(btn) {
  var row = btn.parentNode;
  while (row && row.className.indexOf('sku-row') === -1) row = row.parentNode;
  if (row && row.parentNode) row.parentNode.removeChild(row);
}
function collectSkusFromEditor() {
  var rows = document.querySelectorAll('#sku-rows .sku-row');
  var skus = [];
  var seen = {};
  rows.forEach(function(r){
    var name = r.querySelector('.sku-name').value.trim();
    var priceStr = r.querySelector('.sku-price').value;
    var price = Math.round(parseFloat(priceStr || '0') * 100);
    if (!name) return;
    if (seen[name]) return;
    seen[name] = true;
    var id = parseInt(r.dataset.skuId);
    if (!id) id = genSkuId();
    r.dataset.skuId = String(id);
    skus.push({ id: id, name: name, price: price >= 0 ? price : 0 });
  });
  return skus;
}

function createProduct() {
  var name = $('#np-name').value.trim();
  var price = Math.round(parseFloat($('#np-price').value || '0') * 100);
  var skus = collectSkusFromEditor();
  if (!name) { toast('请填写商品名称','error'); return; }
  if (!skus.length && !(price >= 0)) { toast('请填写正确的价格','error'); return; }
  var db = loadDB();
  db.seq.product++;
  db.products.push({
    id: db.seq.product, name: name,
    price: skus.length ? skus[0].price : price,
    description: $('#np-desc').value.trim(),
    note: $('#np-note').value.trim(),
    category_id: parseInt($('#np-cat').value) || 0,
    active: true, created_at: now(),
    skus: skus
  });
  saveDB(db);
  toast(skus.length ? ('创建成功，已添加 ' + skus.length + ' 个规格') : '创建成功','success');
  renderProducts();
}
function editProduct(id) {
  var db = loadDB();
  var p = db.products.find(function(x){return x.id === id;});
  if (!p) return;
  var skus = getSkus(p);
  openModal('<h3>编辑商品</h3>' +
    '<label class="field"><span>商品名称</span><input id="ep-name" value="' + esc(p.name) + '"></label>' +
    '<label class="field"><span>基础价格（元）</span><input id="ep-price" type="number" step="0.01" value="' + (p.price/100).toFixed(2) + '"></label>' +
    '<label class="field"><span>所属分类</span><select id="ep-cat">' + categoryOptions(db, p.category_id) + '</select></label>' +
    '<label class="field"><span>商品描述</span><input id="ep-desc" value="' + esc(p.description||'') + '"></label>' +
    '<label class="field"><span>发货说明</span><input id="ep-note" value="' + esc(p.note||'') + '"></label>' +
    '<label class="field"><span>规格（可选）</span>' + skuEditorHtml(skus) + '</label>' +
    '<label class="field"><span>状态</span><select id="ep-active">' +
      '<option value="1" ' + (p.active?'selected':'') + '>上架</option>' +
      '<option value="0" ' + (!p.active?'selected':'') + '>下架</option>' +
    '</select></label>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveProduct(' + id + ')">保存</button></div>', true);
}
function saveProduct(id) {
  var db = loadDB();
  var p = db.products.find(function(x){return x.id === id;});
  if (!p) return;
  var name = $('#ep-name').value.trim();
  if (!name) { toast('商品名称不能为空','error'); return; }
  var skus = collectSkusFromEditor();
  var basePrice = Math.round(parseFloat($('#ep-price').value || '0') * 100);
  p.name = name;
  p.price = skus.length ? skus[0].price : basePrice;
  p.category_id = parseInt($('#ep-cat').value) || 0;
  p.description = $('#ep-desc').value.trim();
  p.note = $('#ep-note').value.trim();
  p.skus = skus;
  p.active = $('#ep-active').value === '1';
  saveDB(db); closeModal();
  toast('已保存','success');
  renderProducts();
}
function deleteProduct(id) {
  if (!confirm('确定删除该商品吗？其下所有卡密也会一并删除。')) return;
  var db = loadDB();
  db.products = db.products.filter(function(p){return p.id !== id;});
  db.cards = db.cards.filter(function(c){return c.product_id !== id;});
  saveDB(db);

function renderCards() {
  var db = loadDB();

  db.products.forEach(function(p){

    '<label class="field"><span>选择商品</span><select id="ic-pid" onchange="onCardProductChange()">' + (opts||'<option value="">请先创建商品</option>') + '</select></label>' +
    '<div id="ic-sku-wrap"></div>' +
    '<label class="field"><span>卡密内容（一行一条，自动去重）</span>' +
      '<textarea id="ic-text" rows="6" placeholder="CARD-0001-XXXX-YYYY&#10;CARD-0002-AAAA-BBBB"></textarea>' +
    '</label>' +
    '<button class="btn primary" onclick="importCards()">导入卡密</button>' +
  '</div>' +
  '<div class="card panel"><div class="spread"><h2 style="margin:0">卡密列表</h2>' +
      '<select id="ic-filter" style="width:auto" onchange="loadCards()">' +
        '<option value="unused">未使用</option><option value="used">已售出</option><option value="all">全部</option>' +
      '</select></div>' +
    '<div id="cards-list" style="margin-top:16px"><div class="loading">加载中…</div></div>' +
  '</div>';
  onCardProductChange();
}
function onCardProductChange() {
  var db = loadDB();
  var pid = parseInt($('#ic-pid').value);
  var wrap = $('#ic-sku-wrap');
  if (!wrap) return;
  if (!pid) { wrap.innerHTML = ''; loadCards(); return; }
  var p = db.products.find(function(x){return x.id === pid;});
  if (!p) { wrap.innerHTML = ''; loadCards(); return; }
  var skus = getSkus(p);
  if (!skus.length) {
    wrap.innerHTML = '';
  } else {
    var opts = '';
    skus.forEach(function(s){
      var cnt = db.cards.filter(function(c){return c.product_id === pid && String(c.sku_id)===String(s.id) && c.status==='unused';}).length;
      opts += '<option value="' + s.id + '">' + esc(s.name) + ' ¥' + yuan(s.price) + '（可用 ' + cnt + '）</option>';
    });
    wrap.innerHTML = '<label class="field"><span>选择规格（导入的卡密会归到这个规格下）</span><select id="ic-skuid">' + opts + '</select></label>';
  }
  loadCards();
}
function importCards() {
  var db = loadDB();
  var pid = parseInt($('#ic-pid').value);
  var text = $('#ic-text').value;
  if (!pid) { toast('请先创建商品','error'); return; }
  if (!text.trim()) { toast('请输入卡密内容','error'); return; }
  var p = db.products.find(function(x){return x.id === pid;});
  var skus = getSkus(p);
  var skuId = 0;
  if (skus.length) {
    var skuEl = $('#ic-skuid');
    if (!skuEl) { toast('请选择规格','error'); return; }
    skuId = parseInt(skuEl.value);
  }
  var lines = text.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  var exist = {};
  db.cards.filter(function(c){return c.product_id === pid && String(c.sku_id||0)===String(skuId);}).forEach(function(c){ exist[c.content] = true; });
  var added = 0, skipped = 0;
  lines.forEach(function(line){
    if (exist[line]) { skipped++; return; }
    exist[line] = true;
    db.seq.card++;
    db.cards.push({ id: db.seq.card, product_id: pid, sku_id: skuId, content: line, status: 'unused', order_no: '', used_at: '', created_at: now() });
    added++;
  });
  saveDB(db);
  $('#ic-text').value = '';
  toast('成功导入 ' + added + ' 条' + (skipped?('，跳过重复 ' + skipped + ' 条'):''),'success');
  renderCards();
}
function loadCards() {
  var db = loadDB();
  var pidEl = $('#ic-pid');
  var box = $('#cards-list');
  if (!pidEl || !box) return;
  var pid = parseInt(pidEl.value);
  var filter = $('#ic-filter').value;
  if (!pid) { box.innerHTML = '<div class="empty">请先创建商品</div>'; return; }
  var p = db.products.find(function(x){return x.id === pid;});
  var list = db.cards.filter(function(c){return c.product_id === pid;});
  if (p && hasSkus(p)) {
    var skuEl = $('#ic-skuid');
    if (skuEl) {
      var sid = parseInt(skuEl.value);
      list = list.filter(function(c){return String(c.sku_id||0) === String(sid);});
    }
  }
  if (filter !== 'all') list = list.filter(function(c){return c.status === filter;});
  if (!list.length) { box.innerHTML = '<div class="empty">暂无卡密</div>'; return; }
  var rows = '';
  list.forEach(function(c){
    rows += '<tr>' +
      '<td class="mono">' + esc(c.content) + '</td>' +
      '<td><span class="badge ' + (c.status==='unused'?'ok':'gray') + '">' + (c.status==='unused'?'未使用':'已售出') + '</span></td>' +
      '<td class="mono muted" style="font-size:12px">' + esc(c.order_no||'-') + '</td>' +
      '<td class="muted" style="font-size:12px">' + esc(c.used_at||c.created_at) + '</td>' +
      '<td style="text-align:right">' + (c.status==='unused'?'<button class="btn sm danger" onclick="deleteCard(' + c.id + ')">删除</button>':'') + '</td>' +
    '</tr>';
  });
  box.innerHTML = '<div style="overflow-x:auto"><table>' +
    '<thead><tr><th>卡密</th><th>状态</th><th>关联订单</th><th>时间</th><th></th></tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
  '</table></div>';
}
function deleteCard(id) {
  if (!confirm('确定删除这条卡密？')) return;
  var db = loadDB();
  db.cards = db.cards.filter(function(c){return c.id !== id;});
  saveDB(db);
  toast('已删除','success');
  loadCards();
}

function redeliver(orderNo) {
  var db = loadDB();
  var o = db.orders.find(function(x){return x.order_no === orderNo;});
  if (!o) { toast('订单不存在','error'); return; }
  var need = o.quantity - o.cards.length;
  var orderSku = o.sku_id || 0;
  var available = db.cards.filter(function(c){return c.product_id === o.product_id && c.status === 'unused' && String(c.sku_id||0)===String(orderSku);});
  if (available.length < need) { toast('该规格库存仍不足，还需 ' + (need - available.length) + ' 条','error'); return; }
  available.slice(0, need).forEach(function(c){
    c.status='used'; c.order_no=o.order_no; c.used_at=now();
    o.cards.push(c.content);
  });
  o.status = 'delivered'; o.delivered_at = now();
  saveDB(db);
  toast('补发成功','success');
  renderOrders();
}
function viewOrderCards(orderNo) {
  var db = loadDB();
  var o = db.orders.find(function(x){return x.order_no === orderNo;});

  var html = '<h3>订单卡密</h3><p class="muted mono" style="font-size:12px;margin-top:-10px">' + esc(orderNo) + '</p>';
  o.cards.forEach(function(c){
    html += '<div class="codebox"><span class="mono">' + esc(c) + '</span><button data-v="' + esc(c) + '" onclick="copyText(this.dataset.v,this)">复制</button></div>';

  openModal(html);
}

    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: chatId, text: '✅ 云发卡 TG 通知测试成功！\n\n收到这条消息说明配置正确。' })

function saveAdminPwd() {

  var newPwd = $('#pwd-new').value;

  if (pErr) { toast(pErr,'error'); return; }

  var db = loadDB();
  if (hashPwd(oldPwd) !== getAdminPwdHash(db)) { toast('当前密码错误','error'); return; }

  saveDB(db);
  toast('管理密码已修改 ✅','success');

}

function saveSettings() {

    tg_username: tg,
    tg_notify_enabled: $('#cfg-tg-notify').checked,
    tg_bot_token: $('#cfg-tg-bot-token').value.trim(),

    pay_usdt_enabled: $('#cfg-usdt-enabled').checked,

    pay_usdt_network: $('#cfg-usdt-network').value.trim() || 'TRC20',

  var alipayQrEl = $('#cfg-alipay-qr');

<!-- ================= 多设备同步补丁 ================= -->
<script>
(function () {
  var API = '/api/state';
  var TOKEN = localStorage.getItem('ACCESS_TOKEN') || '';
  var POLL_MS = 4000;
  var rev = 0, pushing = false, pendingPush = null, lastLocalWrite = 0;

  function emptyDB() {
    return { seq:{product:0,card:0,category:0}, config:{}, categories:[],
             products:[], cards:[], orders:[], members:[], recharges:[] };
  }

  window.__DB = null;
  window.__ready = false;

  var _loadDB = window.loadDB;
  var _saveDB = window.saveDB;
  var _route  = window.route;

  window.route = function () {
    if (!window.__ready) {
      var app = document.getElementById('app');
      if (app) app.innerHTML = '<div class="loading">正在同步数据…</div>';
      return;
    }
    if (typeof applySiteConfig === 'function') applySiteConfig();
    return _route.apply(this, arguments);
  };

  window.loadDB = function () { return window.__DB || emptyDB(); };
  window.saveDB = function (db) {
    window.__DB = db;
    lastLocalWrite = Date.now();
    pendingPush = db;
    if (!pushing) { pushing = true; setTimeout(flushPush, 250); }
  };

  function headers() {
    var h = { 'Content-Type':'application/json' };
    if (TOKEN) h['X-Access-Token'] = TOKEN;
    return h;
  }

  function flushPush() {
    if (!pendingPush) { pushing = false; return; }
    var payload = { db: pendingPush, baseRev: rev };
    pendingPush = null;
    fetch(API, { method:'POST', headers:headers(), body:JSON.stringify(payload) }).then(function(r){
      if (r.status === 409) {
        return r.json().then(function(d){
          rev = d.rev; window.__DB = d.db;
          window.route();
          toast('检测到其他设备的修改，已同步最新数据','error');
        });
      }
      return r.json().then(function(d){
        if (d && d.ok) rev = d.rev;
      });
    }).catch(function(e){ console.warn('同步失败', e); }).then(function(){
      pushing = false;
      if (pendingPush) { pushing = true; setTimeout(flushPush, 250); }
    });
  }

  function pullState(first) {
    fetch(API + '?t=' + Date.now(), { headers: headers() }).then(function(r){return r.json();}).then(function(d){
      if (!d.ok) throw new Error(d.msg || 'failed');

      if (d.db === null) {
        var local = _loadDB();
        window.__DB = local;
        window.saveDB(local);
        window.__ready = true;
        window.route();
        return;
      }

      if (!first && Date.now() - lastLocalWrite < 1500) return;
      if (d.rev !== rev) {
        rev = d.rev; window.__DB = d.db;
        if (first) window.__ready = true;
        window.route();
      } else if (first) {
        window.__ready = true;
        window.route();
      }
    }).catch(function(e){
      if (first) {
        var local2 = _loadDB();
        window.__DB = local2;
        window.__ready = true;
        window.route();
        toast('无法连接服务器，正在使用本地数据','error');
      }
    });
  }

  pullState(true).then(function(){
    setInterval(function(){ pullState(false); }, POLL_MS);
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) pullState(false);
    });
    window.addEventListener('online', function(){ pullState(false); });
  });
})();
</script>
