<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>云发卡 · 自动发货</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e8eaf0;--primary:#6366f1;--primary2:#8b5cf6;--danger:#ef4444;--ok:#10b981;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -8px rgba(16,24,40,.12);--tg-btn-color:#0088cc;--tg-btn-shadow:rgba(0,136,204,.6)}
*{box-sizing:border-box}html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;touch-action:pan-y;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}button{font-family:inherit}
.nav{position:-webkit-sticky;position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:inline-block;flex-shrink:0}
.nav nav{display:flex;gap:6px;align-items:center}
.nav nav a{padding:8px 14px;border-radius:10px;font-size:14px;color:var(--muted);transition:.15s;white-space:nowrap}
.nav nav a:hover{background:#f0f1f6;color:var(--text)}
.tg-btn{display:inline-flex!important;align-items:center;gap:5px;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;color:#fff!important;background:var(--tg-btn-color);box-shadow:0 4px 12px -4px var(--tg-btn-shadow);transition:.18s}
.tg-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.tg-btn svg{width:16px;height:16px;fill:#fff}
.tg-float{position:fixed;right:20px;bottom:24px;width:54px;height:54px;border-radius:50%;background:var(--tg-btn-color);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -6px var(--tg-btn-shadow);z-index:150;transition:.2s}
.tg-float:hover{transform:scale(1.08) translateY(-2px)}
.tg-float svg{width:26px;height:26px;fill:#fff}
.tg-float::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--tg-btn-color);opacity:.35;animation:pulse 2.2s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
main{max-width:1080px;margin:0 auto;padding:24px 20px 90px;min-height:80vh}
.btn{border:0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;background:#eef0f6;color:var(--text)}
.btn:hover{filter:brightness(.97)}.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 14px -4px rgba(99,102,241,.6)}
.btn.danger{background:#fee2e2;color:#b91c1c}.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}.btn.block{display:block;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;outline:none;transition:.15s;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
input[type=checkbox]{width:auto;accent-color:var(--primary)}
label.field{display:block;margin-bottom:14px}
label.field > span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}.hidden{display:none!important}
.hero{background:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#a855f7);border-radius:20px;padding:34px 30px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden}
.hero h1{margin:0 0 8px;font-size:26px;letter-spacing:.5px}.hero p{margin:0;opacity:.92;font-size:14px}
.hero .blob{position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.14);right:-70px;top:-90px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;max-width:100%}
.cat-tab{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-align:center}
.cat-tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;font-family:inherit;white-space:nowrap;line-height:1.4}
.cat-tab:hover{border-color:#c7cbe0;color:var(--text)}
.cat-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;box-shadow:0 4px 12px -4px rgba(99,102,241,.55)}
.cat-tab .n{opacity:.65;font-weight:500;margin-left:5px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:100%}
.product{padding:20px;display:flex;flex-direction:column;gap:12px;transition:.18s}
.product:hover{transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(16,24,40,.22)}
.p-name{font-size:16px;font-weight:700}
.p-desc{font-size:13px;color:var(--muted);line-height:1.6;min-height:21px}
.p-price{font-size:22px;font-weight:800;color:#e11d48}.p-price small{font-size:13px;font-weight:600}
.p-price .from{font-size:12px;font-weight:600;color:#6b7280;margin-left:2px}
.sku-tags{display:flex;flex-wrap:wrap;gap:4px}
.sku-tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f5f3ff;color:#6366f1;font-weight:600}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.badge.ok{background:#dcfce7;color:#15803d}.badge.no{background:#fee2e2;color:#b91c1c}
.badge.gray{background:#eef0f6;color:#6b7280}.badge.cat{background:#eef2ff;color:#4f46e5}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.src{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.badge.src-luban{background:#fef3c7;color:#b45309;border:1px solid #fcd34d}

/* ====== 修复支付方式太宽问题：限制最大宽度，居中排列 ====== */
.pay-methods{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
  gap:10px;
  max-width:320px; /* ⭐ 限制最大宽度，避免太宽 */
  margin:0 auto;
}
.pay-method{
  position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 10px;border:2px solid var(--line);border-radius:12px;cursor:pointer;
  transition:.2s;background:#fff;font-weight:600;font-size:14px;
  user-select:none;-webkit-user-select:none;text-align:center;min-height:56px;
}
.pay-method input[type="radio"]{display:none;}
.pay-method::before{
  content:"";width:16px;height:16px;border-radius:50%;border:2px solid #cbd5e1;
  display:inline-block;flex-shrink:0;transition:.2s;
}
.pay-method.active::before{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 3px #fff;}
.pay-method.active{border-color:var(--primary);background:#f5f3ff;color:var(--primary);}
.pay-method .logo{font-size:20px;}

/* ====== 修复规格不显眼问题：名称字体加大，价格红色高亮 ====== */
.sku-options{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.sku-option{
  padding:12px 16px;border:2px solid var(--line);border-radius:12px;cursor:pointer;
  transition:.15s;background:#fff;font-size:14px;font-weight:700;
  user-select:none;-webkit-user-select:none;font-family:inherit;min-width:100px;text-align:center;
}
.sku-option:hover{border-color:#c7cbe0;}
.sku-option.active{border-color:var(--primary);background:#f5f3ff;color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.1);}
.sku-option small{display:block;font-size:13px;color:#e11d48;margin-top:4px;font-weight:800;}
.sku-option.active small{color:var(--primary);}

.balance-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fef9e7;border:1px dashed #fcd34d;border-radius:10px;margin-bottom:14px;font-size:14px}
.balance-row .lbl{display:flex;align-items:center;gap:8px;font-weight:600;color:#92400e}
.balance-row .val{color:#b45309;font-weight:700}
.panel{padding:24px;margin-bottom:16px}
.panel h2{margin:0 0 18px;font-size:17px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right;word-break:break-all}
.codebox{background:#0f172a;color:#7dd3fc;padding:14px 16px;border-radius:10px;font-size:15px;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.codebox span{word-break:break-all}
.codebox button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;flex-shrink:0}.qr-wrap{text-align:center;padding:14px;background:#f8fafc;border-radius:12px;margin:12px 0}
.qr-wrap img{max-width:220px;width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.qr-tip{font-size:12px;color:var(--muted);margin-top:8px}
.addr-box{background:#0f172a;color:#7dd3fc;padding:12px 14px;border-radius:10px;font-size:13px;word-break:break-all;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.addr-box span{flex:1;text-align:left}
.addr-box button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;flex-shrink:0}
.redpacket-box{background:linear-gradient(135deg,#ff5722,#e91e63);color:#fff;border-radius:14px;padding:22px 20px;text-align:center;margin:14px 0;position:relative;overflow:hidden}
.redpacket-box::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);right:-50px;top:-50px}
.redpacket-box .lbl{font-size:13px;opacity:.9;margin-bottom:8px;position:relative;z-index:1}
.redpacket-box .code{font-size:32px;font-weight:900;letter-spacing:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-bottom:12px;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.redpacket-box .copy-btn{background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.4);color:#fff;padding:9px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;position:relative;z-index:1;font-family:inherit}
.redpacket-box .copy-btn:hover{background:rgba(255,255,255,.4)}
.redpacket-steps{background:#fff5f5;border:1px dashed #fc8181;border-radius:10px;padding:14px 18px;font-size:13px;color:#742a2a;line-height:2;margin-bottom:14px}
.redpacket-steps ol{margin:0;padding-left:20px}
.redpacket-steps b{color:#c53030}
.session-box{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border-radius:14px;padding:22px 24px;margin:14px 0;position:relative;overflow:hidden}
.session-box::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-60px}
.session-box .lbl{font-size:13px;opacity:.9;margin-bottom:6px;position:relative;z-index:1}
.session-box .num{font-size:26px;font-weight:900;letter-spacing:1px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-bottom:12px;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.2);word-break:break-all}
.session-box .timer{font-size:14px;font-weight:600;opacity:.95;position:relative;z-index:1;display:inline-block;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:8px}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fade .18s;overscroll-behavior:contain!important;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:18px;width:100%;max-width:440px;padding:24px;box-shadow:0 24px 60px -12px rgba(0,0,0,.35);animation:pop .2s;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain!important;}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 18px;font-size:17px}
.modal.wide{max-width:560px}
.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);background:#1f2430;color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#b91c1c}.toast.success{background:#047857}.toast.info{background:#0369a1}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{padding:9px 16px;border-radius:10px;border:0;background:#eef0f6;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.tabs button .nb{background:#ef4444;color:#fff;font-size:10px;border-radius:99px;padding:1px 6px;margin-left:5px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.stat .n{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tbody tr:hover{background:#fafbfe}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.section-title{font-size:15px;font-weight:700;margin:26px 0 12px}
.member-card{background:linear-gradient(135deg,#1e293b,#334155);border-radius:18px;padding:22px 24px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden}
.member-card::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(99,102,241,.25);right:-70px;bottom:-90px}
.member-card .lbl{font-size:13px;opacity:.75;margin-bottom:4px}
.member-card .amt{font-size:34px;font-weight:800;letter-spacing:.5px}
.member-card .amt small{font-size:16px;font-weight:600;opacity:.85}
.member-card .id{font-size:12px;opacity:.7;margin-top:8px;position:relative;z-index:1;line-height:1.8}
.member-card .id b{color:#c7d2fe}
.quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick-amounts button{padding:10px 18px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);font-family:inherit;transition:.15s}
.quick-amounts button:hover{border-color:var(--primary);color:var(--primary)}
.quick-amounts button.active{background:#f5f3ff;border-color:var(--primary);color:var(--primary)}
.auth-panel{max-width:420px;margin:40px auto}
.auth-tabs{display:flex;background:#eef0f6;border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:10px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);border-radius:9px;transition:.15s;font-family:inherit}
.auth-tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px -2px rgba(16,24,40,.12)}
.auth-tip{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.7}
.field-err{color:#b91c1c;font-size:12px;margin-top:6px;display:block;min-height:14px}
.find-pwd-link{text-align:center;font-size:13px;margin:10px 0 0}
.find-pwd-link a{color:#6366f1;font-weight:600}
.rp-code-cell{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;color:#e91e63;letter-spacing:1px;font-size:13px}
.sku-editor{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.sku-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.sku-row input{padding:8px 10px;font-size:13px}
.sku-row .sku-name{flex:2}
.sku-row .sku-price{flex:1}
.sku-row .sku-del{flex:0 0 auto;background:#fee2e2;color:#b91c1c;border:0;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-weight:600}
.sku-add{margin-top:4px;background:#eef2ff;color:#4f46e5;border:1px dashed #a5b4fc;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.sku-add:hover{background:#e0e7ff}
.sku-hint{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.6}
.tg-hint{background:#e0f2fe;border:1px solid #7dd3fc;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#075985;line-height:1.7}
.tg-hint code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px}
.luban-hint{background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:12px 16px;margin:14px 0;font-size:13px;color:#92400e;line-height:1.7}
.color-swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.color-swatch{width:34px;height:34px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:.15s}
.color-swatch:hover{transform:scale(1.1)}

/* ====== 客服系统样式 ====== */
.cs-float{position:fixed;right:20px;bottom:88px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -6px rgba(16,185,129,.6);z-index:140;cursor:pointer;transition:.2s;border:0;font-size:24px}
.cs-float:hover{transform:scale(1.08) translateY(-2px)}
.cs-float::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #10b981;opacity:.35;animation:pulse 2.2s infinite}
.cs-float .cs-dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#ef4444;border:2px solid #fff;display:none}
.cs-float.has-msg .cs-dot{display:block;animation:csPulse 1.5s infinite}
@keyframes csPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.cs-panel{position:fixed;right:16px;bottom:148px;width:340px;max-width:calc(100vw - 32px);height:480px;max-height:calc(100vh - 200px);background:#fff;border-radius:16px;box-shadow:0 20px 60px -12px rgba(0,0,0,.25);z-index:250;display:none;flex-direction:column;overflow:hidden;border:1px solid #e5e7eb;overscroll-behavior:contain!important;}
.cs-panel.open{display:flex}
.cs-header{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.cs-header h3{margin:0;font-size:15px;font-weight:700}
.cs-header .cs-close{background:rgba(255,255,255,.2);border:0;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;}
.cs-msgs{flex:1;overflow-y:auto;padding:14px;background:#f9fafb;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch;}
.cs-msg{max-width:82%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.5;word-break:break-word;animation:csIn .2s}
@keyframes csIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cs-msg.customer{align-self:flex-end;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-bottom-right-radius:4px}
.cs-msg.admin{align-self:flex-start;background:#fff;border:1px solid #e5e7eb;border-bottom-left-radius:4px;color:#1f2937}
.cs-msg .cs-time{display:block;font-size:10px;opacity:.6;margin-top:4px}

function toast(msg, type){

function copyText(text, btn){
  const done = () => { const o = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(() => { btn.textContent = o; }, 1400); };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){ toast('复制失败','error'); }
  document.body.removeChild(ta);
}
function hexToRgba(hex, alpha){
  const h = String(hex||'#0088cc').replace('#','');
  const full = h.length === 3 ? h.split('').map(c => c+c).join('') : h;
  const r = parseInt(full.slice(0,2),16)||0, g = parseInt(full.slice(2,4),16)||0, b = parseInt(full.slice(4,6),16)||0;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function hashPwd(pwd){
  const salt = 'yfk2024salt::v2::';
  let str = salt + pwd + salt;
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let round = 0; round < 1000; round++){
    for (let i = 0; i < str.length; i++){
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = Math.imul(h2 + c, 0x85ebca6b) >>> 0;
    }
    str = h1.toString(16) + h2.toString(16) + pwd + salt;
  }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
function hashPwdOld(pwd){
  const salt = 'yfk2024salt';
  const str = salt + '::' + pwd + '::' + salt;
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 + c, 0x85ebca6b) >>> 0;
  }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
function verifyPwd(input, storedHash, upgradeCallback){
  if (hashPwd(input) === storedHash) return true;
  if (hashPwdOld(input) === storedHash){
    if (upgradeCallback) upgradeCallback(hashPwd(input));
    return true;
  }
  return false;
}

function rawLoadDB(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw){ const d = seedDB(); localStorage.setItem(STORE_KEY, JSON.stringify(d)); return d; }
    const d = JSON.parse(raw);
    if (!d.products || !d.cards || !d.orders) throw new Error('bad');
    if (!d.config) d.config = Object.assign({}, DEFAULT_CONFIG);
    Object.keys(DEFAULT_CONFIG).forEach(k => { if (d.config[k] === undefined) d.config[k] = DEFAULT_CONFIG[k]; });
    if (!Array.isArray(d.categories)) d.categories = [];
    if (!Array.isArray(d.members)) d.members = [];
    if (!Array.isArray(d.recharges)) d.recharges = [];
    d.products.forEach(p => { if (!Array.isArray(p.skus)) p.skus = []; if (!p.source) p.source = 'local'; });
    d.cards.forEach(c => { if (c.sku_id === undefined) c.sku_id = 0; });
    d.members = d.members.filter(m => m && m.username && m.password);
    d.members.forEach(m => { if (m.secret === undefined && m.contact !== undefined) m.secret = m.contact; });
    d.orders.forEach(o => {
      if (o.secret === undefined && o.contact !== undefined) o.secret = o.contact;
      if (!o.source) o.source = 'local';
    });
    if (!d.seq) d.seq = {product:0, card:0, category:0};
    if (!d.seq.category) d.seq.category = d.categories.reduce((m, c) => Math.max(m, c.id||0), 0);
    return d;
  } catch(e){
    const d = seedDB(); localStorage.setItem(STORE_KEY, JSON.stringify(d)); return d;
  }
}

function productStock(db, p, skuId){
  if (p && (p.source === 'luban' || p.source === 'smm')) return 9999;
  var cnt;
  if (!hasSkus(p)) cnt = db.cards.filter(c => c.product_id === p.id && c.status === 'unused' && (!c.sku_id || c.sku_id === 0)).length;
  else if (skuId === undefined) cnt = db.cards.filter(c => c.product_id === p.id && c.status === 'unused').length;
  else cnt = db.cards.filter(c => c.product_id === p.id && c.status === 'unused' && String(c.sku_id) === String(skuId)).length;
  return cnt > 0 ? cnt : ((p && p.stock) ? p.stock : 1000);
}

  const p = db.products.find(x => x.id === pid);

  openModal(`<h3>${isLuban ? '确认接码' : '确认购买'}</h3>
    <div class="kv"><span class="k">商品</span><span class="v">${esc(p.name)}</span></div>
    ${catKv}${lubanKv}${skuHtml}
    <div class="kv" style="margin-bottom:14px"><span class="k">单价</span><span class="v" style="color:#e11d48" id="buy-unit">${usdt(initialPrice)} USDT</span></div>
    ${qtyHtml}
    <label class="field"><span>暗号（用于查询订单 / 找回会员密码）</span><input id="buy-secret" type="text" placeholder="自定义内容，请务必牢记" maxlength="60" value="${esc(lastSecret)}"></label>
    <div id="balance-box"></div>

      <span class="muted" style="font-size:13px">订单金额</span><span id="buy-amount" style="font-size:18px;font-weight:800;color:#e11d48">${usdt(initialPrice)} USDT</span>

    <div id="buy-cny-hint" style="text-align:right;font-size:12px;color:#6b7280;margin-top:4px">支付宝付款约 ¥${yuan(initialPrice)}（按汇率换算）</div>

      <label class="field" style="margin-bottom:14px"><span>支付方式</span>

  const qty = $('#buy-qty');

  function getCurrentPrice(){
    if (!hasSku) return p.price;

    return sku ? sku.price : p.price;
  }
  function refreshTotals(){
    const q = isLuban ? 1 : (parseInt(qty.value) || 1);
    const price = getCurrentPrice();
    const amount = price * q;
    const m = getCurrentMember(loadDB());
    const balance = m ? (m.balance || 0) : 0;
    const cb = $('#use-balance');
    const useBalance = cb && cb.checked && balanceEnabled && m;
    const deduct = useBalance ? Math.min(balance, amount) : 0;
    const due = amount - deduct;
    const paySel = document.querySelector('input[name="pay-method"]:checked');
    const isAlipay = paySel && paySel.value === 'alipay';
    const fmt = fen => isAlipay ? '¥' + yuan(fen) : usdt(fen) + ' USDT';
    $('#buy-unit').textContent = fmt(price);
    $('#buy-amount').textContent = fmt(amount);

      } else {
        box.innerHTML = '<div class="balance-row" style="background:#f1f5f9;border-color:#cbd5e1;color:#475569"><div class="lbl" style="color:#475569">💎 余额不足</div><a href="#/member" onclick="closeModal()" style="font-size:13px;color:#6366f1;font-weight:600">去充值 →</a></div>';
      }
    } else if (balanceEnabled && !m){
      box.innerHTML = '<div class="balance-row" style="background:#f1f5f9;border-color:#cbd5e1;color:#475569"><div class="lbl" style="color:#475569">💎 登录会员可用余额抵扣</div><a href="#/member" onclick="closeModal()" style="font-size:13px;color:#6366f1;font-weight:600">去登录 →</a></div>';
    } else box.innerHTML = '';
    refreshTotals();
  }

  if (hasSku){
    document.querySelectorAll('#buy-skus .sku-option').forEach(el => {
      el.addEventListener('click', () => {
        if (el.disabled) return;
        document.querySelectorAll('#buy-skus .sku-option').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        __buySkuId = parseInt(el.dataset.sku);
        refreshTotals();
      });
    });
  }
  if (qty){
    qty.addEventListener('input', () => {
      if (qty.value === ''){ refreshTotals(); return; }
      let v = parseInt(qty.value) || 1;
      const maxQ = Math.min(50, productStock(loadDB(), p, __buySkuId));
      v = Math.max(1, Math.min(maxQ, v));
      qty.value = v; refreshTotals();
    });
    qty.addEventListener('blur', () => {
      let v = parseInt(qty.value) || 1;
      const maxQ = Math.min(50, productStock(loadDB(), p, __buySkuId));
      v = Math.max(1, Math.min(maxQ, v));
      qty.value = v; refreshTotals();
    });
  }
  secretEl.addEventListener('keydown', e => { if (e.key === 'Enter') submitBuy(p.id); });
  document.querySelectorAll('#pay-methods .pay-method').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('#pay-methods .pay-method').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      const r = el.querySelector('input[type=radio]'); if (r) r.checked = true;
      refreshTotals();
    });
  });
  refreshBalance();
  if (qty){ qty.focus(); qty.select(); }
}

var _submitting = false;
function submitBuy(id){
  if (_submitting){ toast('正在处理，请勿重复提交','warn'); return; }
  _submitting = true; setTimeout(function(){_submitting=false;}, 3000);
  const db = loadDB();
  const cfg = getConfig(db);
  const p = db.products.find(x => x.id === id);
  if (!p){ toast('商品不存在','error'); return; }
  const isLuban = p.source === 'luban';
  const hasSku = hasSkus(p);
  const secret = $('#buy-secret').value.trim();
  if (!secret){ toast('请输入暗号','error'); return; }
  const sku = hasSku ? getSkuById(p, __buySkuId) : null;
  if (hasSku && !sku){ toast('请选择规格','error'); return; }
  const price = hasSku ? sku.price : p.price;
  let qty = 1;
  if (!isLuban){
    qty = parseInt($('#buy-qty').value) || 1;
    const stock = productStock(db, p, hasSku ? sku.id : 0);
    if (qty < 1){ toast('数量至少为 1','error'); return; }
    if (qty > stock){ toast('库存不足，当前仅剩 ' + stock + ' 件','error'); return; }
  }
  const amount = price * qty;
  const balanceEnabled = cfg.balance_enabled !== false;
  const member = getCurrentMember(db);
  const cb = $('#use-balance');
  const useBalance = cb && cb.checked && balanceEnabled && member;
  let deduct = 0;
  if (useBalance){
    deduct = Math.min(member.balance || 0, amount);
    if (deduct > 0 && !deductBalance(db, member.username, deduct)){ toast('余额扣除失败','error'); return; }
  }
  const due = amount - deduct;
  let payMethod = 'balance';
  if (due > 0){
    const radio = document.querySelector('input[name="pay-method"]:checked');
    if (!radio){ toast('请选择支付方式','error'); return; }
    payMethod = radio.value;
  }
  const orderNo = genOrderNo();
  const order = {

function confirmPay(type, id){
  if (window._confirmLock && window._confirmLock[type + ':' + id] && Date.now() - window._confirmLock[type + ':' + id] < 3000) {
    toast('正在处理，请勿重复提交', 'warn'); return;
  }
  window._confirmLock = window._confirmLock || {};
  window._confirmLock[type + ':' + id] = Date.now();

  const db = loadDB();
  if (type === 'order'){
    const o = db.orders.find(x => x.order_no === id);
    if (!o) return;
    if (o.pay_method === 'usdt'){
      if (!o.usdt_notified_at){ o.usdt_notified_at = now(); saveDB(db); notifyTg(o.order_no); }
      toast('已通知商家，系统正在自动检测到账','success');
      closeModal();
      location.hash = '#/order/' + id;
      if (location.hash === '#/order/' + id) route();
      return;
    }
    if (o.pay_method === 'alipay'){ showPayerNameInput('order', id); return; }
    o.status = 'pending_review';
    o.submitted_at = now();
    saveDB(db);
    closeModal();
    toast('已提交，正在通知商家审核','success');
    notifyTg(o.order_no);
    location.hash = '#/order/' + id;
    if (location.hash === '#/order/' + id) route();
  } else if (type === 'recharge'){
    const r = db.recharges.find(x => x.id === id);
    if (!r) return;
    if (r.status === 'success'){ toast('该充值已到账','success'); return; }
    if (r.method === 'usdt'){
      if (!r.usdt_notified_at){ r.usdt_notified_at = now(); saveDB(db); try{notifyTg(r.id);}catch(e){} }
      toast('已提交，系统正在自动检测USDT到账…','success');
      closeModal();
      startUsdtPolling(r.id);
      location.hash = '#/member';
      if (location.hash === '#/member') route();
      return;
    }
    if (r.method === 'alipay'){ showPayerNameInput('recharge', id); return; }
    r.status = 'pending_review';
    r.submitted_at = now();
    saveDB(db);
    closeModal();
    toast('已提交，管理员核实收款后到账','success');
    try{notifyTg(r.id);}catch(e){}
    location.hash = '#/member';
    if (location.hash === '#/member') route();
  }
}

function processRecharge(id){
  const db = loadDB();
  const r = db.recharges.find(x => x.id === id);
  if (!r || r.status === 'success') return false;
  if (!addBalance(db, r.username, r.amount)) return false;
  var _bonusPct = parseFloat((db.config && db.config.recharge_bonus_pct) || 0);
  if (_bonusPct > 0){
    var _bonus = Math.round(r.amount * _bonusPct / 100);
    if (_bonus > 0){ addBalance(db, r.username, _bonus); r.bonus_amount = _bonus; }
  }
  r.status = 'success';
  r.completed_at = now();
  saveDB(db);
  yfSendTgNow('💰 <b>充值已到账</b>\n单号：'+id+'\n会员：'+r.username+'\n金额：¥'+yuan(r.amount)+(_bonus>0?'\n赠送：¥'+yuan(_bonus):''));
  return true;
}

function approveRecharge(id){

  else toast('处理失败','error');
}

function payOrder(orderNo){
  const db = loadDB();
  const o = db.orders.find(x => x.order_no === orderNo);
  if (!o || o.status !== 'pending') return;
  if (o.source === 'luban'){
    o.status = 'processing'; saveDB(db);
    if (o.luban_type === 'common') {
      const params = { keyword: o.luban_keyword || '' };
      if (o.luban_country) params.country = o.luban_country;
      if (o.luban_phone) params.phone = o.luban_phone;
      if (o.luban_cardtype && o.luban_cardtype !== '全部') params.cardType = o.luban_cardtype;
      if (o.luban_filter === '是') params.filter = '1';
      lubanStartCommon(orderNo, params);
    } else lubanStartSession(orderNo);
    return;
  }
  if (o.source === 'smm') {
    o.status = 'processing'; saveDB(db);
    smmApi('add', { service: o.smm_service_id, link: o.smm_link, quantity: o.quantity })
      .then(r => {
        var db2 = loadDB(); var o2 = db2.orders.find(x => x.order_no === orderNo); if (!o2) return;
        if (r.ok && r.data && r.data.order) {
          o2.smm_order_id = String(r.data.order); o2.smm_state = 'In progress'; saveDB(db2);
          toast('已提交到上游，订单号：' + r.data.order, 'success'); startPoll(orderNo);
        } else {
          o2.status = 'luban_error'; o2.luban_error = (r.data && r.data.error) || '提交失败'; saveDB(db2);
          toast('提交失败：' + o2.luban_error, 'error');
        }
        if (location.hash === '#/order/' + orderNo) route();
      }).catch(e => {
        var db2 = loadDB(); var o2 = db2.orders.find(x => x.order_no === orderNo);
        if (o2){ o2.status = 'luban_error'; o2.luban_error = '网络错误：' + e.message; saveDB(db2); }
      });
    return;
  }
  const orderSku = o.sku_id || 0;
  const available = db.cards.filter(c => c.product_id === o.product_id && c.status === 'unused' && String(c.sku_id || 0) === String(orderSku));
  if (available.length >= o.quantity){
    const usedIds = new Set(db.orders.flatMap(x => x.cards || []));
    const safeCards = available.filter(c => !usedIds.has(c.content));
    const toUse = safeCards.length >= o.quantity ? safeCards.slice(0, o.quantity) : available.slice(0, o.quantity);
    toUse.forEach(c => { c.status = 'used'; c.order_no = o.order_no; c.used_at = now(); o.cards.push(c.content); });
    o.status = 'delivered'; o.delivered_at = now();
  } else if (available.length === 0){
    o.status = 'delivered'; o.delivered_at = now(); o.cards = ['虚拟商品·自动发货（无需卡密）'];
  } else o.status = 'out_of_stock';
  saveDB(db);
  if (o.status === 'delivered' || o.status === 'out_of_stock') {
    yfSendTgNow((o.status==='delivered'?'✅ 已自动发货':'⚠️ 缺货待补发') + '\n订单号：<code>'+o.order_no+'</code>\n商品：'+o.product_name+'\n数量：'+o.quantity+'\n金额：¥'+yuan(o.amount_due)+'\n支付：余额抵扣\n会员：'+(o.username||'匿名'));
  }
}

let _usdtPollTimer = null;
function startUsdtPolling(orderNo){
  if (_usdtPollTimer) clearInterval(_usdtPollTimer);
  const check = () => {
    if (document.hidden) return;
    fetch('/api/usdt-check?order=' + encodeURIComponent(orderNo))
      .then(r => r.json()).then(d => {
        if (d.ok && d.status && d.status !== 'pending'){
          clearInterval(_usdtPollTimer); _usdtPollTimer = null;
          toast('USDT 已到账，系统正在处理 🎉','success');
          var _db = loadDB();
          var _r = _db.recharges.find(x => x.id === orderNo);
          if (_r && _r.status !== 'success'){ processRecharge(orderNo); }
          else { var _o = _db.orders.find(x => x.order_no === orderNo); if (_o && _o.status === 'pending'){ try{payOrder(orderNo);}catch(e){} } }
          setTimeout(() => { route(); }, 800);
        }
      }).catch(()=>{});
  };
  check();
  _usdtPollTimer = setInterval(check, 30000);
}

    }).catch(() => toast('网络错误','error'));
}

  }
  const orderSku = o.sku_id || 0;
  const available = db.cards.filter(c => c.product_id === o.product_id && c.status === 'unused' && String(c.sku_id || 0) === String(orderSku));
  if (available.length < o.quantity){ toast(`该规格库存不足，需要 ${o.quantity} 条，只有 ${available.length} 条`, 'error'); return; }
  const usedIds2 = new Set(db.orders.flatMap(x => x.cards || []));
  const safeCards2 = available.filter(c => !usedIds2.has(c.content));
  const toUse2 = safeCards2.length >= o.quantity ? safeCards2.slice(0, o.quantity) : available.slice(0, o.quantity);
  toUse2.forEach(c => { c.status = 'used'; c.order_no = o.order_no; c.used_at = now(); o.cards.push(c.content); });
  o.status = 'delivered'; o.delivered_at = now(); o.approved_at = now();
  saveDB(db); toast('已确认发货 ✅','success'); renderOrders();
}
function rejectOrder(orderNo){

  if (!o) return;
  if (!confirm('确定驳回订单 ' + orderNo + '？客户将看到"订单已驳回"。')) return;

}

function doQuery(){
  const no = ($('#q-no') ? $('#q-no').value : '').trim();
  const secret = ($('#q-secret') ? $('#q-secret').value : '').trim();
  if (!no){ toast('请输入订单号','error'); return; }
  if (!secret){ toast('请输入暗号','error'); return; }
  saveMyOrder(no, secret); renderOrderView(no, secret);
}
function yfRecoverOrder(){
  var no = (document.getElementById('yf-recover-no') || {}).value;
  var amt = parseFloat((document.getElementById('yf-recover-amt') || {}).value || '0');
  no = (no || '').trim();
  if (!no || !amt){ toast('请填写订单号和金额','error'); return; }
  var db = loadDB(); var o = db.orders.find(x => x.order_no === no);
  if (!o){ toast('订单不存在','error'); return; }
  if (Math.abs(o.amount / 100 - amt) > 0.01){ toast('金额不匹配','error'); return; }
  try { var m = JSON.parse(localStorage.getItem(MY_KEY) || '{}'); m[no] = o.secret; localStorage.setItem(MY_KEY, JSON.stringify(m)); } catch(e){}
  toast('找回成功，正在跳转…','success');
  location.hash = '#/order/' + no; if (location.hash === '#/order/' + no && window.route) route();
}

function switchTab(tab){

  const body = $('#tab-body'); if (!body) return;
  body.innerHTML = '<div class="loading">加载中…</div>';
  if (tab === 'stats') return renderStats();
  if (tab === 'pending') return renderPending();
  if (tab === 'products') return renderProducts();
  if (tab === 'categories') return renderCategories();
  if (tab === 'cards') return renderCards();

function categoryOptions(db, selectedId){
  const sel = String(selectedId || 0);

  db.categories.forEach(c => opts.push(`<option value="${c.id}" ${sel === String(c.id) ? 'selected' : ''}>${esc(c.name)}</option>`));
  return opts.join('');

function importCards(){
  const db = loadDB(); const pid = parseInt($('#ic-pid').value); const text = $('#ic-text').value;

  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);

function deleteOrder(orderNo){

function clearCompletedOrders(){

  if (!done.length){ toast('没有可清理的订单','error'); return; }
  if (!confirm(`确定批量删除 ${done.length} 条「已发货/已驳回」订单？`)) return;

function redeliver(orderNo){
  const db = loadDB(); const o = db.orders.find(x => x.order_no === orderNo); if (!o) return;
  const need = o.quantity - o.cards.length; const orderSku = o.sku_id || 0;
  const available = db.cards.filter(c => c.product_id === o.product_id && c.status === 'unused' && String(c.sku_id || 0) === String(orderSku));
  if (available.length < need){ toast(`该规格库存仍不足，还需 ${need - available.length} 条`,'error'); return; }
  available.slice(0, need).forEach(c => { c.status = 'used'; c.order_no = o.order_no; c.used_at = now(); o.cards.push(c.content); });
  o.status = 'delivered'; o.delivered_at = now(); saveDB(db); toast('补发成功','success'); renderOrders();
}

/* ===== 全平台价格重算：汇率/加价变化后联动 SMM + Luban 商品（自定义价保留） ===== */
function recalcAllPrices(db){
  const cfg = db.config || {};
  const rate = Number(cfg.pay_usdt_rate) || 7.2;
  const smmMarkup = Number(cfg.smm_markup) || 1.5;
  const lbMarkup = Number(cfg.luban_markup) || 1.3;
  const costCur = cfg.smm_cost_currency || 'CNY';
  let smmN = 0, lbN = 0;
  (db.products || []).forEach(p => {
    if (p.source === 'smm') {
      if (p.smm_custom_price > 0) { p.price = p.smm_custom_price; return; }
      const r = parseFloat(p.smm_rate_usd || 0);
      const cny = costCur === 'USD' ? r * rate : r;
      p.price = Math.max(1, Math.round(cny * smmMarkup * 100)); smmN++;
    } else if (p.source === 'luban' && p.luban_type === 'sms') {
      const origin = parseFloat(p.luban_origin_cost || 0);
      if (origin > 0) { p.price = Math.max(1, Math.round(origin * rate * lbMarkup * 100)); lbN++; }
    }
  });
  return { smmN, lbN };
}
/* ===== 通用接码售价 = 上游成本参考价 × Luban加价倍数 ===== */
function lubanCommonPriceFen(cfg){
  cfg = cfg || getConfig(loadDB());
  const cost = Number(cfg.luban_common_cost) || 2;
  const mk = Number(cfg.luban_markup) || 1.3;
  return Math.max(1, Math.round(cost * mk * 100));

function lubanSyncServices(){
  const country = $('#luban-filter-country').value.trim(); const service = $('#luban-filter-service').value.trim();
  if (!confirm(`将从 LubanSms 拉取【${country||'全部'}】【${service||'全部'}】的服务。继续？`)) return;
  toast('开始拉取，正在自动翻页…');
  let page = 1; const allServices = []; let emptyStreak = 0;
  function fetchPage(){
    let url = `/api/luban?action=services&language=zh&page=${page}`;
    if (country) url += '&countryName=' + encodeURIComponent(country);
    if (service) url += '&service=' + encodeURIComponent(service);
    return fetch(url).then(r => r.json()).then(d => {
      if (d.code !== 0) throw new Error(d.msg || '拉取失败');
      const list = Array.isArray(d.msg) ? d.msg : [];
      if (list.length > 0){ allServices.push(...list); emptyStreak = 0; page++; return new Promise(resolve => setTimeout(() => resolve(fetchPage()), 150)); }
      emptyStreak++; if (emptyStreak >= 2) return null; page++; return new Promise(resolve => setTimeout(() => resolve(fetchPage()), 300));
    });
  }
  fetchPage().then(() => {
    if (!allServices.length){ toast('没有找到匹配的服务','error'); return; }
    const seenIds = {}; const uniqueServices = [];
    allServices.forEach(s => { const key = String(s.service_id); if (seenIds[key]) return; seenIds[key] = true; uniqueServices.push(s); });
    const db = loadDB(); const _cfg = getConfig(db); const _rate = Number(_cfg.pay_usdt_rate)||7.2; const _lbm = Number(_cfg.luban_markup)||1.3; let added = 0, updated = 0;
    uniqueServices.forEach(s => {
      let origin = parseFloat(s.origin_cost); if (isNaN(origin)) origin = (parseFloat(s.cost) || 0) / 1.3;
      const ourPriceFen = Math.max(1, Math.round(origin * _rate * _lbm * 100));
      const exist = db.products.find(p => p.source === 'luban' && p.luban_service_id === String(s.service_id));
      if (exist){ exist.price = ourPriceFen; exist.luban_origin_cost = origin.toFixed(2); updated++; }
      else {
        db.seq.product++; db.products.push({ id: db.seq.product, name: `[接码] ${s.service_name} · ${s.country_name_zh || ''}`, price: ourPriceFen, description: `国家：${s.country_name_zh||''} ｜ 服务：${s.service_name}`, note: '请在 20 分钟内完成注册', category_id: 0, active: true, created_at: now(), skus: [], source: 'luban', luban_type: 'sms', luban_service_id: String(s.service_id), luban_service_name: s.service_name, luban_country: s.country_name_zh || s.country_name_en || '', luban_origin_cost: origin.toFixed(2) }); added++;
      }
    });
    saveDB(db); toast(`拉取完成！新增 ${added} 个，更新 ${updated} 个`,'success'); renderLuban();
  }).catch(e => toast('同步失败：' + e.message,'error'));
}

function smmCostCurrency(){ try { return (loadDB().config||{}).smm_cost_currency || 'CNY'; } catch(e){ return 'CNY'; } }
function smmRateToCny(rate){ var v = parseFloat(rate||0); return smmCostCurrency()==='USD' ? v * usdtRate() : v; }
function smmPriceFen(rate, markup){ return Math.max(1, Math.round(smmRateToCny(rate) * markup * 100)); }
function smmCostDisplay(rate){
  var v = parseFloat(rate||0);
  if(smmCostCurrency()==='USD'){ return '$'+v.toFixed(4)+'<br><span class="muted" style="font-size:11px">≈¥'+(v*usdtRate()).toFixed(2)+'</span>'; }
  return '¥'+v.toFixed(2)+'<br><span class="muted" style="font-size:11px">≈'+(v/usdtRate()).toFixed(4)+' USDT</span>';
}

function smmRefreshBalance(){
  var el = document.getElementById('smm-bal-val'); if(!el) return;
  el.textContent = '查询中…'; el.style.color = '#6b7280';
  fetch('/api/smm', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'balance'})})
    .then(function(r){return r.json();}).then(function(d){
      if(!d || !d.ok){ el.textContent = '查询失败（未配置 CHINAYINLIU_API_KEY）'; el.style.color='#ef4444'; return; }
      var data = d.data || {};
      var bal = data.balance !== undefined ? data.balance : (data.user !== undefined ? data.user : JSON.stringify(data).slice(0,30));
      var cur = data.currency || '';
      el.textContent = String(bal) + (cur ? ' '+cur : ''); el.style.color = '#10b981';
    }).catch(function(){ el.textContent='查询失败'; el.style.color='#ef4444'; });
  if(!window._smmBalTimer){ window._smmBalTimer = setInterval(smmRefreshBalance, 60000); }
}

function smmSaveCustomPrice(id){
  var v = parseFloat(document.getElementById('smm-custom-price').value);
  var db = loadDB(); var p = db.products.find(x => x.id === id); if(!p) return;
  var cfg = getConfig(db); var markup = Number(cfg.smm_markup)||1.5;

  else { p.smm_custom_price = Math.round(v * usdtRate() * 100); p.price = p.smm_custom_price; }

}
function smmResetCustomPrice(id){

function smmRefreshCost(){
  toast('正在从上游拉取最新成本价…');
  smmApi('services').then(r => {
    if(!r.ok){ toast('拉取失败：'+(r.msg||''),'error'); return; }
    var list = r.data; if(!Array.isArray(list)){ toast('返回格式异常','error'); return; }
    var db = loadDB(); var cfg = getConfig(db); var markup = Number(cfg.smm_markup)||1.5; var updated = 0;
    list.forEach(s => {
      var sid = String(s.service||''); if(!sid) return;
      var exist = db.products.find(p => p.source==='smm' && String(p.smm_service_id)===sid);
      if(exist){
        var newRate = parseFloat(s.rate)||0;
        exist.smm_rate_usd = newRate.toFixed(4);
        exist.name = '[推广] ' + (s.name||'');
        exist.smm_service_name = s.name||'';
        if(!exist.smm_custom_price){ exist.price = smmPriceFen(newRate, markup); }
        updated++;
      }
    });
    saveDB(db); toast('成本价已刷新：更新 '+updated+' 个（自定义价商品保持不变）','success'); renderSmmTab();
  }).catch(e => { toast('网络错误：'+e.message,'error'); });
}

function smmSaveCfg(){ var markup = parseFloat($('#smm-markup').value); if (!markup || markup < 1){ toast('加价倍数至少为 1','error'); return; } var curSel = $('#smm-cost-currency'); var cur = curSel ? curSel.value : 'CNY'; var db = loadDB(); db.config.smm_markup = markup; db.config.smm_cost_currency = cur;

function smmToggle(id){ var db = loadDB(); var p = db.products.find(x => x.id === id); if (!p) return; p.active = !p.active; saveDB(db); toast(p.active ? '已上架' : '已下架', 'success'); renderSmmTab(); }
function smmClear(){ var db = loadDB(); var items = db.products.filter(p => p.source === 'smm'); if (!items.length){ toast('没有可清空的商品','error'); return; } if (!confirm('确定清空全部 ' + items.length + ' 个推广商品？')) return; db.products = db.products.filter(p => p.source !== 'smm'); saveDB(db); toast('已清空','success'); renderSmmTab(); }
function smmSyncCore(silent){

   ============================================================ */
var _origTitle = document.title;
var _titleInterval = null;
function yfStrongAlert(msg){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
    setTimeout(function(){
      var osc2 = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.connect(gain2); gain2.connect(ctx.destination);
      osc2.frequency.value = 1100;
      gain2.gain.setValueAtTime(0.35, ctx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
      osc2.start(); osc2.stop(ctx.currentTime + 0.45);
    }, 400);
  } catch(e){}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]); } catch(e){}
  if (_titleInterval) clearInterval(_titleInterval);
  var blinkOn = false;
  _titleInterval = setInterval(function(){
    document.title = blinkOn ? ('🔴 新验证码！' + _origTitle) : _origTitle;
    blinkOn = !blinkOn;
  }, 800);
  setTimeout(function(){
    if (_titleInterval){ clearInterval(_titleInterval); _titleInterval = null; }
    document.title = _origTitle;
  }, 30000);
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:16px 24px;border-radius:14px;box-shadow:0 20px 60px -12px rgba(16,185,129,.6);z-index:99999;font-size:15px;font-weight:700;max-width:90vw;text-align:center';
  box.innerHTML = '🎉 收到验证码<br><span style="font-size:26px;letter-spacing:3px;font-family:ui-monospace,monospace;display:block;margin-top:6px">' + _esc(msg) + '</span>';
  document.body.appendChild(box);
  setTimeout(function(){ if (box.parentNode) box.parentNode.removeChild(box); }, 6000);
  _toast('🎉 收到验证码：' + msg, 'success');
}
window.yfStrongAlert = yfStrongAlert;

var _homeSortBy = 'default';
var _homeShowInStock = false;
var _homePriceRange = 'all';

window.yfSetHomeSort = function(v){ _homeSortBy = v; if (window.renderHome) window.renderHome(); };
window.yfToggleInStock = function(){ _homeShowInStock = !_homeShowInStock; if (window.renderHome) window.renderHome(); };
window.yfSetPriceRange = function(v){ _homePriceRange = v; if (window.renderHome) window.renderHome(); };

(function(){
  var orig = window.renderHome;
  if (typeof orig !== 'function') return;
  window.renderHome = function(){
    var r = orig.apply(this, arguments);
    setTimeout(function(){
      try {
        var app = document.getElementById('app');
        if (!app) return;
        var grid = app.querySelector('.grid');
        if (!grid) return;
        var cards = Array.prototype.slice.call(grid.querySelectorAll('.product'));
        if (!cards.length) return;
        function getPrice(card){
          var el = card.querySelector('.p-price');
          if (!el) return 0;
          var m = el.textContent.match(/([\d.]+)/);
          return m ? parseFloat(m[1]) : 0;
        }
        function hasStock(card){
          var badges = card.querySelectorAll('.badge');
          for (var i = 0; i < badges.length; i++){
            var t = badges[i].textContent;
            if (t.indexOf('有货') >= 0 || t.indexOf('可接码') >= 0) return true;
          }
          return false;
        }
        cards.forEach(function(c){ c.dataset.yfHidden = ''; });
        if (_homePriceRange !== 'all'){
          var parts = _homePriceRange.split('-');
          var min = parseFloat(parts[0]) || 0;
          var max = parts[1] === '+' ? 999999 : (parseFloat(parts[1]) || 999999);
          cards.forEach(function(c){
            var p = getPrice(c);
            if (p < min || p > max) c.dataset.yfHidden = '1';
          });
        }
        if (_homeShowInStock){
          cards.forEach(function(c){ if (!hasStock(c)) c.dataset.yfHidden = '1'; });
        }
        if (_homeSortBy === 'price-asc'){
          cards.sort(function(a, b){ return getPrice(a) - getPrice(b); });
        } else if (_homeSortBy === 'price-desc'){
          cards.sort(function(a, b){ return getPrice(b) - getPrice(a); });
        }
        cards.forEach(function(c){
          c.style.display = c.dataset.yfHidden === '1' ? 'none' : '';
          grid.appendChild(c);
        });
        var cats = app.querySelector('.cats');
        if (!cats) return;
        var existingBar = document.getElementById('yf-home-sort-bar');
        var barHtml = '<div id="yf-home-sort-bar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;align-items:center">' +
          '<span style="font-size:12px;color:var(--muted);font-weight:600">排序：</span>' +
          '<button class="btn sm ' + (_homeSortBy==='default'?'primary':'ghost') + '" onclick="yfSetHomeSort(\'default\')">默认</button>' +
          '<button class="btn sm ' + (_homeSortBy==='price-asc'?'primary':'ghost') + '" onclick="yfSetHomeSort(\'price-asc\')">价格↑</button>' +
          '<button class="btn sm ' + (_homeSortBy==='price-desc'?'primary':'ghost') + '" onclick="yfSetHomeSort(\'price-desc\')">价格↓</button>' +
          '<span style="font-size:12px;color:var(--muted);font-weight:600;margin-left:10px">价格：</span>' +
          '<button class="btn sm ' + (_homePriceRange==='all'?'primary':'ghost') + '" onclick="yfSetPriceRange(\'all\')">全部</button>' +
          '<button class="btn sm ' + (_homePriceRange==='0-10'?'primary':'ghost') + '" onclick="yfSetPriceRange(\'0-10\')">≤10</button>' +
          '<button class="btn sm ' + (_homePriceRange==='10-50'?'primary':'ghost') + '" onclick="yfSetPriceRange(\'10-50\')">10~50</button>' +
          '<button class="btn sm ' + (_homePriceRange==='50-+'?'primary':'ghost') + '" onclick="yfSetPriceRange(\'50-+\')">≥50</button>' +
          '<button class="btn sm ' + (_homeShowInStock?'primary':'ghost') + '" onclick="yfToggleInStock()" style="margin-left:auto">' + (_homeShowInStock?'✓ ':'') + '仅看有货</button>' +
          '</div>';
        if (existingBar) existingBar.outerHTML = barHtml;
        else cats.parentNode.insertBefore(document.createRange().createContextualFragment(barHtml), cats);
      } catch(e){ console.warn('[sort]', e); }
    }, 100);
    return r;
  };
})();

<script>
(function(){

var _toast = function(m,t){ try{ window.toast(m,t||''); }catch(e){} };
var _now = function(){ var d=new Date(),p=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); };
var _esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

/* ============================================================
   [P2-1] 数量输入快捷按钮（+/- 和 10/100/1000/全部）
   ============================================================ */
function injectQtyQuickBtns(inputId){
  var input = document.getElementById(inputId);
  if (!input || input.dataset.yfQtyQuick) return;
  input.dataset.yfQtyQuick = '1';
  var wrapper = document.createElement('div');
  wrapper.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:8px';
  var maxAttr = parseInt(input.getAttribute('max')) || 999999;
  var minAttr = parseInt(input.getAttribute('min')) || 1;
  var presets = [minAttr, 1, 10, 100, 1000, maxAttr];
  var uniq = []; presets.forEach(function(v){ if (uniq.indexOf(v) < 0 && v >= minAttr && v <= maxAttr) uniq.push(v); });
  var html = '';
  html += '<button type="button" class="btn sm ghost" data-act="minus" style="padding:6px 12px;font-size:13px">−</button>';
  uniq.forEach(function(v){
    var label = v === maxAttr ? '全部(' + maxAttr + ')' : String(v);
    html += '<button type="button" class="btn sm ghost" data-act="set" data-val="' + v + '" style="padding:6px 12px;font-size:13px">' + label + '</button>';
  });
  html += '<button type="button" class="btn sm ghost" data-act="plus" style="padding:6px 12px;font-size:13px">+</button>';
  wrapper.innerHTML = html;
  input.parentNode.insertBefore(wrapper, input.nextSibling);
  wrapper.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    var act = b.dataset.act;
    var cur = parseInt(input.value) || minAttr;
    if (act === 'minus') input.value = Math.max(minAttr, cur - 1);
    else if (act === 'plus') input.value = Math.min(maxAttr, cur + 1);
    else if (act === 'set') input.value = parseInt(b.dataset.val);
    input.dispatchEvent(new Event('input', {bubbles: true}));
    input.dispatchEvent(new Event('change', {bubbles: true}));
  });
}
(function(){
  var orig = window.openBuy;
  if (typeof orig !== 'function') return;
  window.openBuy = function(){
    var r = orig.apply(this, arguments);
    setTimeout(function(){
      injectQtyQuickBtns('buy-qty');
      injectQtyQuickBtns('smm-qty');
    }, 120);
    return r;
  };
})();

(function(){

    var db = window.loadDB();
    var p = db.products.find(function(x){ return x.id === pid; });
    if (!p) return;
    var contact = prompt('「' + p.name + '」暂时缺货\n\n留下联系方式（邮箱 / TG / 微信号），到货后通知您：');
    if (!contact || !contact.trim()) return;

      id: 'N' + Date.now(),
      product_id: pid,
      product_name: p.name,
      contact: contact.trim(),
      created_at: _now(),
      notified: false
    });
    window.saveDB(db);
    _toast('已记录，到货后会第一时间通知您 ✅','success');
    if (window.yfSendTgNow){
      window.yfSendTgNow('🔔 到货提醒请求\n商品：' + p.name + '\n联系方式：' + contact.trim());
    }
  };

/* 店主补货后自动通知 */
window.yfNotifyRestock = function(productId, notifyAll){
  var db = window.loadDB();
  var p = db.products.find(function(x){ return x.id === productId; });
  if (!p) return 0;
  var list = (db.stock_notifies || []).filter(function(n){ return n.product_id === productId && !n.notified; });
  if (!list.length){ _toast('该商品没有待通知的客户','info'); return 0; }
  if (notifyAll !== true && !confirm('发现 ' + list.length + ' 条到货提醒，要通知他们吗？')) return 0;
  var sent = 0;
  list.forEach(function(n){
    n.notified = true;
    n.notified_at = _now();
    sent++;
    if (window.yfSendTgNow){
      window.yfSendTgNow('✅ 到货通知\n商品：' + n.product_name + '\n客户联系方式：' + n.contact + '\n请手动联系客户');
    }
  });
  window.saveDB(db);
  _toast('已标记 ' + sent + ' 条，请手动联系客户','success');
  return sent;
};

  var db = window.loadDB();

  try {
    if (val){
      localStorage.setItem('yf_chat_email', val);
      fetch('/api/chat-subscribe', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ session: session, email: val })
      }).catch(function(){});
      _toast('✅ 已订阅，店主回复会发到你的邮箱','success');

      localStorage.removeItem('yf_chat_email');
      _toast('已取消订阅','success');

};

        else if (filter === 'processing') filtered = all.filter(function(o){ return o.status === 'processing' || o.status === 'waiting_sms'; });
        else if (filter === 'done') filtered = all.filter(function(o){ return o.status === 'delivered'; });
        else if (filter === 'failed') filtered = all.filter(function(o){ return o.status === 'rejected' || o.status === 'out_of_stock' || o.status === 'luban_error'; });

        var tabs = [
          ['all','全部', all.length],
          ['pending','待支付', all.filter(function(o){return o.status==='pending';}).length],
          ['review','待审核', all.filter(function(o){return o.status==='pending_review';}).length],
          ['processing','处理中', all.filter(function(o){return o.status==='processing'||o.status==='waiting_sms';}).length],
          ['done','已完成', all.filter(function(o){return o.status==='delivered';}).length],
          ['failed','异常', all.filter(function(o){return o.status==='rejected'||o.status==='out_of_stock'||o.status==='luban_error';}).length]
        ];
        var tabsHtml = '<div class="tabs" style="margin-bottom:12px;flex-wrap:wrap">' +
          tabs.map(function(t){
            var active = filter === t[0] ? 'active' : '';
            return '<button class="' + active + '" style="padding:6px 12px;font-size:13px" onclick="yfMyOrderFilter2Set(\'' + t[0] + '\')">' + t[1] + ' (' + t[2] + ')</button>';
          }).join('') + '</div>';

        var rowsHtml = '';
        if (!filtered.length){
          rowsHtml = '<tr><td colspan="6" class="empty">该状态下暂无订单</td></tr>';
        } else {
          rowsHtml = filtered.slice(0, 30).map(function(o){
            var refund = o.refunded_at ? ' <span class="badge" style="background:#d1fae5;color:#065f46;font-size:10px">已退款</span>' : '';
            var timeout = o.timeout_cancel ? ' <span class="badge" style="background:#fef3c7;color:#b45309;font-size:10px">超时取消</span>' : '';
            return '<tr>' +
              '<td class="mono" style="font-size:12px">' + _esc(o.order_no) + '</td>' +
              '<td>' + _esc(o.product_name) + (o.sku_name ? ' · ' + _esc(o.sku_name) : '') + ' × ' + o.quantity + refund + timeout + '</td>' +
              '<td>' + window.orderUsdt(o.amount, o) + ' USDT</td>' +
              '<td><span class="badge ' + (window.STATUS_CLASS && window.STATUS_CLASS[o.status] || 'gray') + '">' + (window.STATUS_TEXT && window.STATUS_TEXT[o.status] || o.status) + '</span></td>' +
              '<td class="muted" style="font-size:12px">' + _esc(o.created_at) + '</td>' +
              '<td style="text-align:right"><a class="btn sm ghost" href="#/order/' + _esc(o.order_no) + '">查看</a></td></tr>';
          }).join('');
        }
        var h2 = target.querySelector('h2');
        if (h2) h2.textContent = '我的订单（' + all.length + '）';
        var tbl = target.querySelector('table');
        if (tbl){
          var thead = tbl.querySelector('thead tr');
          var tbody = tbl.querySelector('tbody');
          if (tbody) tbody.innerHTML = rowsHtml;
        }
        if (!target.querySelector('.yf-order-tabs')){
          var wrap = document.createElement('div');
          wrap.className = 'yf-order-tabs';
          wrap.innerHTML = tabsHtml;
          var h = target.querySelector('h2');
          if (h) h.parentNode.insertBefore(wrap, h.nextSibling);
        } else {
          target.querySelector('.yf-order-tabs').innerHTML = tabsHtml;
        }
      } catch(e){ console.warn('[P2-4]', e); }
    }, 200);
    return r;
  };
})();

   [P3-1] 管理后台登录防暴力破解
   ============================================================ */
(function(){
  var KEY = 'yf_admin_login_fails';
  function getFails(){
    try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; }
  }
  function saveFails(o){ try { localStorage.setItem(KEY, JSON.stringify(o)); } catch(e){} }
  function checkLock(){
    var f = getFails();
    if (f.lockUntil && Date.now() < f.lockUntil){
      var sec = Math.ceil((f.lockUntil - Date.now()) / 1000);
      return '账号已锁定，请 ' + sec + ' 秒后重试';
    }
    return '';
  }
  var orig = window.adminLogin;
  if (typeof orig !== 'function') return;
  window.adminLogin = function(){
    var lock = checkLock();
    if (lock){ _toast(lock, 'error'); return; }
    var input = document.getElementById('adm-pwd');
    if (!input) return;
    var db = window.loadDB();
    var ok = window.verifyPwd ? window.verifyPwd(input.value, (db.config && db.config.admin_pwd_hash) || '', function(nh){
      db.config.admin_pwd_hash = nh; window.saveDB(db);
    }) : false;
    var f = getFails();
    if (!ok){
      f.count = (f.count || 0) + 1;
      f.lastFail = Date.now();
      if (f.count >= 5){
        f.lockUntil = Date.now() + 5 * 60 * 1000;
        f.count = 0;
        _toast('连续 5 次失败，锁定 5 分钟', 'error');
      } else {
        _toast('密码错误（已失败 ' + f.count + ' 次，5 次后锁定 5 分钟）', 'error');
      }
      saveFails(f);
      if (window.yfLog) window.yfLog('adminLoginFail', '失败次数 ' + (f.count || 0));
      return;
    }
    f.count = 0;
    f.lockUntil = 0;
    saveFails(f);
    sessionStorage.setItem('yunfaka_admin', '1');
    _toast('登录成功', 'success');
    if (window.yfLog) window.yfLog('adminLoginSuccess', '');
    if (window.renderAdminPanel) window.renderAdminPanel();
  };
})();

window.yfBatchApproveOrders = function(){
  var nos = window.yfGetSelectedOrderNos();
  if (!nos.length){ _toast('请先勾选订单','warn'); return; }
  var db = window.loadDB();
  var review = db.orders.filter(function(o){ return nos.indexOf(o.order_no) >= 0 && o.status === 'pending_review'; });
  if (!review.length){ _toast('勾选的订单里没有待审核的','warn'); return; }
  if (!confirm('确定批量确认 ' + review.length + ' 个待审核订单？')) return;
  var ok = 0, fail = 0;
  review.forEach(function(o){
    try {
      if (o.source === 'luban'){
        o.status = 'processing';
        if (window.lubanStartCommon && o.luban_type === 'common'){
          var p = { keyword: o.luban_keyword || '' };
          if (o.luban_country) p.country = o.luban_country;
          if (o.luban_phone) p.phone = o.luban_phone;
          if (o.luban_cardtype && o.luban_cardtype !== '全部') p.cardType = o.luban_cardtype;
          if (o.luban_filter === '是') p.filter = '1';
          window.lubanStartCommon(o.order_no, p);
        } else if (window.lubanStartSession){
          window.lubanStartSession(o.order_no);
        }
        ok++;
      } else {
        var orderSku = o.sku_id || 0;
        var avail = db.cards.filter(function(c){
          return c.product_id === o.product_id && c.status === 'unused' && String(c.sku_id || 0) === String(orderSku);
        });
        if (avail.length >= o.quantity){
          var usedIds = new Set(db.orders.flatMap(function(x){ return x.cards || []; }));
          var safe = avail.filter(function(c){ return !usedIds.has(c.content); });
          var toUse = safe.length >= o.quantity ? safe.slice(0, o.quantity) : avail.slice(0, o.quantity);
          toUse.forEach(function(c){ c.status = 'used'; c.order_no = o.order_no; c.used_at = _now(); o.cards.push(c.content); });
          o.status = 'delivered';
          o.delivered_at = _now();
          o.approved_at = _now();
          ok++;
          if (window.yfNotifyCustomer) window.yfNotifyCustomer(o.order_no, '✅ 店主已确认发货\n' + o.cards.join('\n'));
        } else if (avail.length === 0){
          o.status = 'delivered';
          o.delivered_at = _now();
          o.cards = ['虚拟商品·自动发货（无需卡密）'];
          ok++;
        } else fail++;
      }
    } catch(e){ fail++; }
  });
  window.saveDB(db);
  window.yfLog('batchApprove', '成功 ' + ok + ' 失败 ' + fail);
  _toast('批量确认：成功 ' + ok + '，失败 ' + fail, fail ? 'warn' : 'success');
  if (window.renderOrders) window.renderOrders();
};

  review.forEach(function(o){
    o.status = 'rejected';

      o.refunded_amount = o.balance_used;

    if (window.yfNotifyCustomer) window.yfNotifyCustomer(o.order_no, '❌ 订单被驳回');

};

  var ids = window.yfGetSelectedPids();
  if (!ids.length){ _toast('请先勾选商品','warn'); return; }
  var mode = prompt('改价方式：\n1 = 加固定金额（输入 +10 或 -5）\n2 = 乘倍数（输入 1.2 或 0.8）\n3 = 设为固定值（输入 50）\n\n请输入 1/2/3：');
  if (!mode) return;
  mode = mode.trim();
  var val = prompt('请输入数值：');
  if (val === null) return;
  val = parseFloat(val);
  if (isNaN(val)){ _toast('数值无效','error'); return; }
  var db = window.loadDB();
  var count = 0;
  ids.forEach(function(pid){
    var p = db.products.find(function(x){ return x.id === pid; });
    if (!p) return;
    var oldPrice = p.price;
    if (mode === '1') p.price = Math.max(1, p.price + Math.round(val * 100));
    else if (mode === '2') p.price = Math.max(1, Math.round(p.price * val));
    else if (mode === '3') p.price = Math.max(1, Math.round(val * 100));
    if (p.price !== oldPrice) count++;
    if (Array.isArray(p.skus)){
      p.skus.forEach(function(s){
        if (mode === '1') s.price = Math.max(1, s.price + Math.round(val * 100));
        else if (mode === '2') s.price = Math.max(1, Math.round(s.price * val));
        else if (mode === '3') s.price = Math.max(1, Math.round(val * 100));
      });
      if (p.skus.length) p.price = p.skus[0].price;
    }
  });
  window.saveDB(db);
  window.yfLog('batchPriceChange', mode + ' 数值 ' + val + ' 影响 ' + count + ' 个');
  _toast('已修改 ' + count + ' 个商品价格','success');
  if (window.renderProducts) window.renderProducts();
};
window.yfBatchToggleActive = function(active){

  var db = window.loadDB();
  var count = 0;
  ids.forEach(function(pid){
    var p = db.products.find(function(x){ return x.id === pid; });
    if (!p) return;
    p.active = !!active;
    count++;
  });
  window.saveDB(db);
  window.yfLog('batchToggleActive', (active ? '上架' : '下架') + ' ' + count + ' 个');

};

<!-- ============================================================
     升级补丁 P4 · SMM 自定义分类 + 批量一键移入/移出
     ============================================================ -->
<script>
(function(){
'use strict';
if (!window.loadDB || !window.saveDB){ console.warn('[P4] 核心未就绪'); return; }

var _toast = function(m,t){ try{ window.toast(m,t||''); }catch(e){} };
var _esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

/* ============================================================
   [P4-1] 分类工具函数
   ============================================================ */
window.yfSmmGetCategories = function(){
  var db = window.loadDB();
  var cfg = db.config || {};
  var raw = cfg.smm_categories || '';
  var list = raw.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  if (!list.length){
    list = ['Telegram','Instagram','YouTube','TikTok','Facebook','Twitter/X','AI/ChatGPT','Netflix','Spotify','Discord','Google','Apple','腾讯/微信','抖音','B站','小红书','微博','快手','其他'];
  }
  // 确保"未分类"和"其他"存在
  if (list.indexOf('未分类') < 0) list.unshift('未分类');
  if (list.indexOf('其他') < 0) list.push('其他');
  return list;
};

window.yfSmmSaveCategories = function(list){
  var db = window.loadDB();
  db.config.smm_categories = list.join('\n');
  window.saveDB(db);
};

/* ============================================================
   [P4-2] 分类管理弹窗（增删改排序）
   ============================================================ */
window.yfSmmManageCategories = function(){
  var list = window.yfSmmGetCategories();
  var html = '<h3>🏷️ 管理 SMM 分类</h3>' +
    '<p class="muted" style="font-size:12px;margin-top:-10px;margin-bottom:14px">删除分类后，其下商品会自动归到「未分类」</p>' +
    '<div id="yf-smm-cat-list" style="max-height:340px;overflow-y:auto;margin-bottom:14px;padding:4px">';
  list.forEach(function(c, i){
    var isCore = (c === '未分类' || c === '其他');
    html += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">' +
      '<input class="yf-smm-cat-input" data-idx="' + i + '" value="' + _esc(c) + '"' + (isCore ? ' readonly' : '') + ' style="flex:1;padding:8px 10px;font-size:13px' + (isCore ? ';background:#f1f5f9;color:#6b7280' : '') + '">' +
      '<button class="btn sm ghost" style="padding:6px 10px" onclick="yfSmmCatMove(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
      '<button class="btn sm ghost" style="padding:6px 10px" onclick="yfSmmCatMove(' + i + ',1)"' + (i === list.length - 1 ? ' disabled' : '') + '>↓</button>' +
      '<button class="btn sm danger" style="padding:6px 10px"' + (isCore ? ' disabled' : ' onclick="yfSmmCatDelete(' + i + ')"') + '>×</button>' +
      '</div>';
  });
  html += '</div>' +
    '<div style="display:flex;gap:8px;margin-bottom:14px">' +
    '<input id="yf-smm-new-cat" placeholder="新分类名称（如：小红书）" style="flex:1;padding:8px 10px;font-size:13px">' +
    '<button class="btn primary sm" onclick="yfSmmCatAdd()">+ 添加</button>' +
    '</div>' +
    '<div class="row" style="justify-content:flex-end">' +
    '<button class="btn ghost" onclick="closeModal()">取消</button>' +
    '<button class="btn primary" onclick="yfSmmSaveCategoryEdits()">💾 保存</button>' +
    '</div>';
  window.openModal(html, true);
};

window.yfSmmCatAdd = function(){
  var inp = document.getElementById('yf-smm-new-cat');
  if (!inp) return;
  var v = inp.value.trim().replace(/[<>"'&]/g, '');
  if (!v){ _toast('请输入分类名称','error'); return; }
  if (v.length > 20){ _toast('分类名称最多 20 字','error'); return; }
  var list = window.yfSmmGetCategories();
  if (list.indexOf(v) >= 0){ _toast('该分类已存在','error'); return; }
  list.push(v);
  window.yfSmmSaveCategories(list);
  _toast('已添加「' + v + '」','success');
  window.yfSmmManageCategories();
};

window.yfSmmCatDelete = function(idx){
  var list = window.yfSmmGetCategories();
  var name = list[idx];
  if (name === '未分类' || name === '其他'){ _toast('核心分类不可删除','error'); return; }
  var db = window.loadDB();
  var affected = (db.products || []).filter(function(p){ return p.source === 'smm' && p.smm_platform === name; }).length;
  var msg = affected > 0 ? ('删除分类「' + name + '」？\n\n该分类下有 ' + affected + ' 个商品，会自动归到「未分类」。') : ('删除分类「' + name + '」？');
  if (!confirm(msg)) return;
  list.splice(idx, 1);
  window.yfSmmSaveCategories(list);
  (db.products || []).forEach(function(p){
    if (p.source === 'smm' && p.smm_platform === name){
      p.smm_platform = '未分类';
      p.smm_platform_manual = '未分类';
    }
  });
  window.saveDB(db);
  _toast('已删除','success');
  window.yfSmmManageCategories();
};

window.yfSmmCatMove = function(idx, dir){
  var list = window.yfSmmGetCategories();
  var j = idx + dir;
  if (j < 0 || j >= list.length) return;
  if (list[idx] === '未分类' || list[j] === '未分类'){ _toast('「未分类」需保持在第一位','info'); return; }
  var t = list[idx]; list[idx] = list[j]; list[j] = t;
  window.yfSmmSaveCategories(list);
  window.yfSmmManageCategories();
};

window.yfSmmSaveCategoryEdits = function(){
  var inputs = document.querySelectorAll('#yf-smm-cat-list .yf-smm-cat-input');
  var newList = [];
  var seen = {};
  var renames = []; // {old, new}
  var oldList = window.yfSmmGetCategories();
  inputs.forEach(function(inp, i){
    var v = inp.value.trim().replace(/[<>"'&]/g, '');
    if (!v || seen[v]) return;
    seen[v] = true;
    newList.push(v);
    if (oldList[i] && oldList[i] !== v){
      renames.push({ old: oldList[i], new: v });
    }
  });
  if (!newList.length){ _toast('至少保留一个分类','error'); return; }
  if (newList.indexOf('未分类') < 0) newList.unshift('未分类');
  if (newList.indexOf('其他') < 0) newList.push('其他');
  window.yfSmmSaveCategories(newList);
  // 应用重命名到商品
  if (renames.length){
    var db = window.loadDB();
    (db.products || []).forEach(function(p){
      if (p.source !== 'smm') return;
      renames.forEach(function(r){
        if (p.smm_platform === r.old){
          p.smm_platform = r.new;
          p.smm_platform_manual = r.new;
        }
      });
    });
    window.saveDB(db);
  }
  _toast('已保存分类' + (renames.length ? '（重命名 ' + renames.length + ' 个）' : ''), 'success');
  window.closeModal();
  if (window.renderSmmTab) window.renderSmmTab();
};

window.yfSmmBatchSelectAllInCat = function(){

  var ids = {};
  (db.products || []).forEach(function(p){

  });

window.yfSmmBatchMoveOut = function(){

      p.smm_platform_manual = '未分类';

  window.saveDB(db);
  if (window.yfLog) window.yfLog('smmBatchMoveOut', '移出到未分类 ' + count + ' 个');

};

     升级补丁 P5 · 数据分析 + 数据备份 + 云端优化 + 安全加固

<script>
(function(){
'use strict';
if (!window.loadDB || !window.saveDB){ console.warn('[P5] 核心未就绪'); return; }

var _toast = function(m,t){ try{ window.toast(m,t||''); }catch(e){} };
var _now = function(){ var d=new Date(),p=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); };
var _esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var _yuan = function(f){ return (Number(f||0)/100).toFixed(2); };

/* ============================================================
   [P5-1] 销售趋势图（纯 CSS/SVG，无外部依赖）
   ============================================================ */
function yfBuildTrendSVG(labels, values, opts){
  opts = opts || {};
  var color = opts.color || '#6366f1';
  var w = 720, h = 200, padL = 50, padR = 20, padT = 20, padB = 40;
  var chartW = w - padL - padR;
  var chartH = h - padT - padB;
  var maxV = Math.max.apply(null, values.concat([1]));
  var stepX = chartW / Math.max(1, values.length - 1);
  var points = values.map(function(v, i){
    var x = padL + stepX * i;
    var y = padT + chartH - (v / maxV) * chartH;
    return { x: x, y: y, v: v };
  });
  var path = '';
  points.forEach(function(p, i){
    path += (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
  });
  var areaPath = path + 'L' + (padL + stepX * (values.length - 1)).toFixed(1) + ',' + (padT + chartH) + 'L' + padL + ',' + (padT + chartH) + 'Z';
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:220px;display:block">';
  svg += '<defs><linearGradient id="yfTrendGrad" x1="0" y1="0" x2="0" y2="1">';
  svg += '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.35"/>';
  svg += '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/>';
  svg += '</linearGradient></defs>';
  for (var i = 0; i <= 4; i++){
    var y = padT + (chartH / 4) * i;
    var v = maxV * (1 - i / 4);
    svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + chartW) + '" y2="' + y + '" stroke="#e8eaf0" stroke-width="1"/>';
    svg += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" font-size="11" fill="#6b7280" text-anchor="end">' + v.toFixed(0) + '</text>';
  }
  svg += '<path d="' + areaPath + '" fill="url(#yfTrendGrad)"/>';
  svg += '<path d="' + path + '" stroke="' + color + '" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  points.forEach(function(p, i){
    svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4" fill="#fff" stroke="' + color + '" stroke-width="2"/>';
    if (labels[i]){
      svg += '<text x="' + p.x.toFixed(1) + '" y="' + (padT + chartH + 20) + '" font-size="11" fill="#6b7280" text-anchor="middle">' + _esc(labels[i]) + '</text>';
    }
  });
  svg += '</svg>';
  return svg;
}

function yfAggregateRevenueByDay(orders, days){
  var result = [];
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  for (var i = days - 1; i >= 0; i--){
    var d = new Date(today.getTime() - i * 86400000);
    var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    result.push({ key: key, label: key.slice(5), value: 0 });
  }
  var map = {};
  result.forEach(function(r){ map[r.key] = r; });
  (orders || []).forEach(function(o){
    if (o.status !== 'delivered') return;
    var ts = o.delivered_at || o.created_at;
    if (!ts) return;
    var k = ts.slice(0, 10);
    if (map[k]) map[k].value += (o.amount - (o.refunded_amount || 0));
  });
  return result;
}

/* ============================================================
   [P5-2] 数据分析面板（趋势图 + 排行 + 时段分析）

(function(){

        var yesterdayVal = (sevenDays.find(function(x){ return x.key === yesterdayKey; }) || {}).value || 0;
        var diff = todayVal - yesterdayVal;
        var diffPct = yesterdayVal > 0 ? Math.round(diff / yesterdayVal * 100) : (todayVal > 0 ? 100 : 0);
        var diffColor = diff >= 0 ? '#10b981' : '#ef4444';

        // 商品销售排行 Top 10

        });
        var totalOrders = (payMap.alipay + payMap.usdt + payMap.balance) || 1;

        // 时段分析（24小时下单分布）
        var hourMap = new Array(24).fill(0);

        html += '</div>';
