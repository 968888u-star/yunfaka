<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>云发卡 · 自动发货</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e8eaf0;--primary:#6366f1;--primary2:#8b5cf6;--danger:#ef4444;--ok:#10b981;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -8px rgba(16,24,40,.12);--tg-btn-color:#0088cc;--tg-btn-shadow:rgba(0,136,204,.6)}
*{box-sizing:border-box}html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;touch-action:pan-y;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}button{font-family:inherit}
.nav{position:-webkit-sticky;position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:inline-block;flex-shrink:0}
.nav nav{display:flex;gap:6px;align-items:center}
.nav nav a{padding:8px 14px;border-radius:10px;font-size:14px;color:var(--muted);transition:.15s;white-space:nowrap}
.nav nav a:hover{background:#f0f1f6;color:var(--text)}
.tg-btn{display:inline-flex!important;align-items:center;gap:5px;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;color:#fff!important;background:var(--tg-btn-color);box-shadow:0 4px 12px -4px var(--tg-btn-shadow);transition:.18s}
.tg-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.tg-btn svg{width:16px;height:16px;fill:#fff}
.tg-float{position:fixed;right:20px;bottom:24px;width:54px;height:54px;border-radius:50%;background:var(--tg-btn-color);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -6px var(--tg-btn-shadow);z-index:150;transition:.2s}
.tg-float:hover{transform:scale(1.08) translateY(-2px)}
.tg-float svg{width:26px;height:26px;fill:#fff}
.tg-float::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--tg-btn-color);opacity:.35;animation:pulse 2.2s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
main{max-width:1080px;margin:0 auto;padding:24px 20px 90px;min-height:80vh}
.btn{border:0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;background:#eef0f6;color:var(--text)}
.btn:hover{filter:brightness(.97)}.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 14px -4px rgba(99,102,241,.6)}
.btn.danger{background:#fee2e2;color:#b91c1c}.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}.btn.block{display:block;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;outline:none;transition:.15s;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
input[type=checkbox]{width:auto;accent-color:var(--primary)}
label.field{display:block;margin-bottom:14px}
label.field > span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}.hidden{display:none!important}
.hero{background:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#a855f7);border-radius:20px;padding:34px 30px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden}
.hero h1{margin:0 0 8px;font-size:26px;letter-spacing:.5px}.hero p{margin:0;opacity:.92;font-size:14px}
.hero .blob{position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.14);right:-70px;top:-90px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;max-width:100%}
.cat-tab{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-align:center}
.cat-tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;font-family:inherit;white-space:nowrap;line-height:1.4}
.cat-tab:hover{border-color:#c7cbe0;color:var(--text)}
.cat-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;box-shadow:0 4px 12px -4px rgba(99,102,241,.55)}
.cat-tab .n{opacity:.65;font-weight:500;margin-left:5px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:100%}
.product{padding:20px;display:flex;flex-direction:column;gap:12px;transition:.18s}
.product:hover{transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(16,24,40,.22)}
.p-name{font-size:16px;font-weight:700}
.p-desc{font-size:13px;color:var(--muted);line-height:1.6;min-height:21px}
.p-price{font-size:22px;font-weight:800;color:#e11d48}.p-price small{font-size:13px;font-weight:600}
.p-price .from{font-size:12px;font-weight:600;color:#6b7280;margin-left:2px}
.sku-tags{display:flex;flex-wrap:wrap;gap:4px}
.sku-tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f5f3ff;color:#6366f1;font-weight:600}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.badge.ok{background:#dcfce7;color:#15803d}.badge.no{background:#fee2e2;color:#b91c1c}
.badge.gray{background:#eef0f6;color:#6b7280}.badge.cat{background:#eef2ff;color:#4f46e5}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.src{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.badge.src-luban{background:#fef3c7;color:#b45309;border:1px solid #fcd34d}

.pay-methods{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:10px;max-width:320px;margin:0 auto;}
.pay-method{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 10px;border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:.2s;background:#fff;font-weight:600;font-size:14px;user-select:none;-webkit-user-select:none;text-align:center;min-height:56px;}
.pay-method input[type="radio"]{display:none;}
.pay-method::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid #cbd5e1;display:inline-block;flex-shrink:0;transition:.2s;}
.pay-method.active::before{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 3px #fff;}
.pay-method.active{border-color:var(--primary);background:#f5f3ff;color:var(--primary);}
.pay-method .logo{font-size:20px;}

.sku-options{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.sku-option{padding:12px 16px;border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:#fff;font-size:14px;font-weight:700;user-select:none;-webkit-user-select:none;font-family:inherit;min-width:100px;text-align:center;}
.sku-option:hover{border-color:#c7cbe0;}
.sku-option.active{border-color:var(--primary);background:#f5f3ff;color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.1);}
.sku-option small{display:block;font-size:13px;color:#e11d48;margin-top:4px;font-weight:800;}
.sku-option.active small{color:var(--primary);}

.balance-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fef9e7;border:1px dashed #fcd34d;border-radius:10px;margin-bottom:14px;font-size:14px}
.balance-row .lbl{display:flex;align-items:center;gap:8px;font-weight:600;color:#92400e}
.balance-row .val{color:#b45309;font-weight:700}
.panel{padding:24px;margin-bottom:16px}
.panel h2{margin:0 0 18px;font-size:17px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right;word-break:break-all}
.codebox{background:#0f172a;color:#7dd3fc;padding:14px 16px;border-radius:10px;font-size:15px;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.codebox span{word-break:break-all}
.codebox button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;flex-shrink:0}.qr-wrap{text-align:center;padding:14px;background:#f8fafc;border-radius:12px;margin:12px 0}
.qr-wrap img{max-width:220px;width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.qr-tip{font-size:12px;color:var(--muted);margin-top:8px}
.addr-box{background:#0f172a;color:#7dd3fc;padding:12px 14px;border-radius:10px;font-size:13px;word-break:break-all;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.addr-box span{flex:1;text-align:left}
.addr-box button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;flex-shrink:0}
.redpacket-box{background:linear-gradient(135deg,#ff5722,#e91e63);color:#fff;border-radius:14px;padding:22px 20px;text-align:center;margin:14px 0;position:relative;overflow:hidden}
.redpacket-box::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);right:-50px;top:-50px}
.redpacket-box .lbl{font-size:13px;opacity:.9;margin-bottom:8px;position:relative;z-index:1}
.redpacket-box .code{font-size:32px;font-weight:900;letter-spacing:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-bottom:12px;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.redpacket-box .copy-btn{background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.4);color:#fff;padding:9px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;position:relative;z-index:1;font-family:inherit}
.redpacket-box .copy-btn:hover{background:rgba(255,255,255,.4)}
.redpacket-steps{background:#fff5f5;border:1px dashed #fc8181;border-radius:10px;padding:14px 18px;font-size:13px;color:#742a2a;line-height:2;margin-bottom:14px}
.redpacket-steps ol{margin:0;padding-left:20px}
.redpacket-steps b{color:#c53030}
.session-box{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border-radius:14px;padding:22px 24px;margin:14px 0;position:relative;overflow:hidden}
.session-box::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-60px}
.session-box .lbl{font-size:13px;opacity:.9;margin-bottom:6px;position:relative;z-index:1}
.session-box .num{font-size:26px;font-weight:900;letter-spacing:1px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-bottom:12px;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.2);word-break:break-all}
.session-box .timer{font-size:14px;font-weight:600;opacity:.95;position:relative;z-index:1;display:inline-block;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:8px}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fade .18s;overscroll-behavior:contain!important;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:18px;width:100%;max-width:440px;padding:24px;box-shadow:0 24px 60px -12px rgba(0,0,0,.35);animation:pop .2s;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain!important;}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 18px;font-size:17px}
.modal.wide{max-width:560px}
.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);background:#1f2430;color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#b91c1c}.toast.success{background:#047857}.toast.info{background:#0369a1}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{padding:9px 16px;border-radius:10px;border:0;background:#eef0f6;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.tabs button .nb{background:#ef4444;color:#fff;font-size:10px;border-radius:99px;padding:1px 6px;margin-left:5px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.stat .n{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tbody tr:hover{background:#fafbfe}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.section-title{font-size:15px;font-weight:700;margin:26px 0 12px}
.member-card{background:linear-gradient(135deg,#1e293b,#334155);border-radius:18px;padding:22px 24px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden}
.member-card::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(99,102,241,.25);right:-70px;bottom:-90px}
.member-card .lbl{font-size:13px;opacity:.75;margin-bottom:4px}
.member-card .amt{font-size:34px;font-weight:800;letter-spacing:.5px}
.member-card .amt small{font-size:16px;font-weight:600;opacity:.85}
.member-card .id{font-size:12px;opacity:.7;margin-top:8px;position:relative;z-index:1;line-height:1.8}
.member-card .id b{color:#c7d2fe}
.quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick-amounts button{padding:10px 18px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);font-family:inherit;transition:.15s}
.quick-amounts button:hover{border-color:var(--primary);color:var(--primary)}
.quick-amounts button.active{background:#f5f3ff;border-color:var(--primary);color:var(--primary)}
.auth-panel{max-width:420px;margin:40px auto}
.auth-tabs{display:flex;background:#eef0f6;border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:10px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);border-radius:9px;transition:.15s;font-family:inherit}
.auth-tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px -2px rgba(16,24,40,.12)}
.auth-tip{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.7}
.field-err{color:#b91c1c;font-size:12px;margin-top:6px;display:block;min-height:14px}
.find-pwd-link{text-align:center;font-size:13px;margin:10px 0 0}
.find-pwd-link a{color:#6366f1;font-weight:600}
.rp-code-cell{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;color:#e91e63;letter-spacing:1px;font-size:13px}
.sku-editor{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.sku-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.sku-row input{padding:8px 10px;font-size:13px}
.sku-row .sku-name{flex:2}
.sku-row .sku-price{flex:1}
.sku-row .sku-del{flex:0 0 auto;background:#fee2e2;color:#b91c1c;border:0;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-weight:600}
.sku-add{margin-top:4px;background:#eef2ff;color:#4f46e5;border:1px dashed #a5b4fc;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.sku-add:hover{background:#e0e7ff}
.sku-hint{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.6}
.tg-hint{background:#e0f2fe;border:1px solid #7dd3fc;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#075985;line-height:1.7}
.tg-hint code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px}
.luban-hint{background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:12px 16px;margin:14px 0;font-size:13px;color:#92400e;line-height:1.7}
.color-swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.color-swatch{width:34px;height:34px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:.15s}
.color-swatch:hover{transform:scale(1.1)}

.cs-float{position:fixed;right:20px;bottom:88px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -6px rgba(16,185,129,.6);z-index:140;cursor:pointer;transition:.2s;border:0;font-size:24px}
.cs-float:hover{transform:scale(1.08) translateY(-2px)}
.cs-float::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #10b981;opacity:.35;animation:pulse 2.2s infinite}
.cs-float .cs-dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#ef4444;border:2px solid #fff;display:none}
.cs-float.has-msg .cs-dot{display:block;animation:csPulse 1.5s infinite}
@keyframes csPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.cs-panel{position:fixed;right:16px;bottom:148px;width:340px;max-width:calc(100vw - 32px);height:480px;max-height:calc(100vh - 200px);background:#fff;border-radius:16px;box-shadow:0 20px 60px -12px rgba(0,0,0,.25);z-index:250;display:none;flex-direction:column;overflow:hidden;border:1px solid #e5e7eb;overscroll-behavior:contain!important;}
.cs-panel.open{display:flex}
.cs-header{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.cs-header h3{margin:0;font-size:15px;font-weight:700}
.cs-header .cs-close{background:rgba(255,255,255,.2);border:0;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;}
.cs-msgs{flex:1;overflow-y:auto;padding:14px;background:#f9fafb;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch;}
.cs-msg{max-width:82%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.5;word-break:break-word;animation:csIn .2s}
@keyframes csIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cs-msg.customer{align-self:flex-end;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-bottom-right-radius:4px}
.cs-msg.admin{align-self:flex-start;background:#fff;border:1px solid #e5e7eb;border-bottom-left-radius:4px;color:#1f2937}
.cs-msg .cs-time{display:block;font-size:10px;opacity:.6;margin-top:4px}
.cs-input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #e5e7eb;background:#fff;flex-shrink:0}
.cs-input input{flex:1;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;outline:none}
.cs-input input:focus{border-color:#10b981}
.cs-input button{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer;font-size:14px}

<script>
'use strict';

// ======================= 基础工具 =======================
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const usdtRate = () => {
  try { const db = loadDB(); return Number(db.config.pay_usdt_rate) || 7.2; } catch(e){ return 7.2; }

const usdt = fen => (Number(fen||0)/100/usdtRate()).toFixed(2);
const orderUsdt = (fen, order) => (Number(fen||0)/100/(Number(order&&order.usdt_rate) || usdtRate())).toFixed(2);

let toastTimer;
function toast(msg, type){
  const t = $('#toast');
  if(!t) return;
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 3000);
}
function openModal(html, wide){
  $('#modal-box').innerHTML = html;
  $('#modal-box').classList.toggle('wide', !!wide);

function closeModal(){

function copyText(text, btn){
  const done = () => { const o = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(() => { btn.textContent = o; }, 1400); };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){ toast('复制失败','error'); }
  document.body.removeChild(ta);
}
function hexToRgba(hex, alpha){
  const h = String(hex||'#0088cc').replace('#','');
  const full = h.length === 3 ? h.split('').map(c => c+c).join('') : h;
  const r = parseInt(full.slice(0,2),16)||0, g = parseInt(full.slice(2,4),16)||0, b = parseInt(full.slice(4,6),16)||0;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function hashPwd(pwd){
  const salt = 'yfk2024salt::v2::';
  let str = salt + pwd + salt;
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let round = 0; round < 1000; round++){
    for (let i = 0; i < str.length; i++){
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = Math.imul(h2 + c, 0x85ebca6b) >>> 0;
    }
    str = h1.toString(16) + h2.toString(16) + pwd + salt;
  }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
function verifyPwd(input, storedHash){
  return hashPwd(input) === storedHash;
}
function now(){
  const d = new Date(); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function randStr(len){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = '';
  for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random()*chars.length)]; return s;
}
const genCard = () => `${randStr(4)}-${randStr(4)}-${randStr(4)}-${randStr(4)}`;
function genOrderNo(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${Math.floor(Math.random()*900000+100000)}`;
}
const genRechargeId = () => 'R' + Date.now() + Math.floor(Math.random()*900+100);
const genSkuId = () => Date.now() + Math.floor(Math.random()*1000);
function genRedpacketCode(prefix){
  const p = String(prefix||'YFK').toUpperCase().replace(/[^A-Z0-9]/g,'') || 'YFK';
  return p + randStr(6);
}

// ======================= 数据库与状态 =======================
const STORE_KEY = 'yunfaka_db_v15';
const MY_KEY = 'yunfaka_my_orders';
const MEMBER_KEY = 'yunfaka_member_user';
const LS_SECRET = 'yunfaka_last_secret';
const SS_ADMIN = 'yunfaka_admin';

const DEFAULT_CONFIG = {
  site_name: '云发卡', tg_username: 'U345666', tg_btn_color: '#0088cc',
  tg_bot_token: '', tg_chat_id: '', tg_notify_enabled: true,
  admin_pwd_hash: hashPwd('admin888'),
  pay_alipay_enabled: true, pay_alipay_mode: 'redpacket', pay_alipay_redpacket_prefix: 'YFK',
  pay_usdt_enabled: true, pay_usdt_address: 'TQn9Y2khEsLJW1ChVWFMSMeRDow5KcbLSE',
  pay_usdt_network: 'TRC20', pay_usdt_rate: 7.2,
  balance_enabled: true, recharge_min: 1000,
  luban_common_cost: 2, luban_markup: 1.3, luban_auto_sync: true, luban_sync_interval_hours: 6,
  smm_hero_title: '社交媒体推广', smm_hero_subtitle: '关注 / 点赞 / 播放 / 评论',
  smm_usage_text: '1. 选择服务，填写目标链接<br>2. 填写数量<br>3. 提交后自动处理<br>4. 进度在订单详情查看',
  smm_categories: 'Telegram\nInstagram\nYouTube\nTikTok\nFacebook\nTwitter/X\nAI/ChatGPT\nNetflix\nSpotify\nDiscord\nGoogle\nApple\n腾讯/微信\n抖音\nB站\n小红书\n微博\n快手\n其他',
  yf_announcement: ''
};

function seedDB(){
  const db = {
    seq: {product:0, card:0, category:0},
    config: Object.assign({}, DEFAULT_CONFIG),
    categories: [], products: [], cards: [], orders: [], members: [], recharges: [], stock_notifies: [], audit_log: []
  };
  const addCat = name => { const id = ++db.seq.category; db.categories.push({id, name}); return id; };
  const c1 = addCat('会员卡券'), c2 = addCat('游戏点卡'), c3 = addCat('软件工具');
  const addProductWithSkus = (name, desc, note, catId, skus, cardsPerSku) => {
    const id = ++db.seq.product;
    const product = { id, name, description: desc, note, active: true, category_id: catId, created_at: now(), source: 'local',
      skus: skus.map((s, i) => ({id: genSkuId()+i, name: s.name, price: s.price})) };
    db.products.push(product);
    product.skus.forEach((sku, si) => {
      for (let i = 0; i < cardsPerSku[si]; i++){
        db.seq.card++;
        db.cards.push({id: db.seq.card, product_id: id, sku_id: sku.id, content: genCard(), status: 'unused', order_no: '', used_at: '', created_at: now()});
      }
    });
  };
  addProductWithSkus('视频会员', '多规格可选，自动发货', '请前往官方 App 兑换', c1, [{name:'1个月', price:990},{name:'3个月', price:2580}], [5,5]);
  return db;
}

function rawLoadDB(){
  try {
    let raw = localStorage.getItem(STORE_KEY);
    if (!raw) { const d = seedDB(); localStorage.setItem(STORE_KEY, JSON.stringify(d)); return d; }
    const d = JSON.parse(raw);
    if (!d.config) d.config = Object.assign({}, DEFAULT_CONFIG);
    Object.keys(DEFAULT_CONFIG).forEach(k => { if (d.config[k] === undefined) d.config[k] = DEFAULT_CONFIG[k]; });
    if (!Array.isArray(d.categories)) d.categories = [];
    if (!Array.isArray(d.members)) d.members = [];
    if (!Array.isArray(d.recharges)) d.recharges = [];
    if (!Array.isArray(d.orders)) d.orders = [];
    d.products.forEach(p => { if (!Array.isArray(p.skus)) p.skus = []; if (!p.source) p.source = 'local'; });
    if (!d.seq) d.seq = {product:0, card:0, category:0};
    return d;
  } catch(e){ const d = seedDB(); localStorage.setItem(STORE_KEY, JSON.stringify(d)); return d; }
}

window.__DB = null;
window.loadDB = function(){
  if (!window.__DB) window.__DB = rawLoadDB();
  return window.__DB;
};

window.saveDB = function(db) {
  window.__DB = db;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch(e){}
  
  if (window.isSavingDB) return Promise.resolve({ ok: true });
  window.isSavingDB = true;

  const headers = { 'Content-Type': 'application/json' };
  const memToken = localStorage.getItem('yunfaka_member_token');
  const admToken = sessionStorage.getItem('yunfaka_admin_token');
  if (memToken) headers['X-Member-Token'] = memToken;
  if (admToken) headers['X-Admin-Token'] = admToken;

  fetch('/api/state?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      const rev = (d && d.rev) || 0;
      return fetch('/api/state', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({ db: db, baseRev: rev })
      });
    })
    .then(r => r.json())
    .then(d => {
      window.isSavingDB = false;
      if (d && d.ok) {
        window.__REV = d.rev;
      } else if (d && d.rev !== undefined) {
        // 乐观锁冲突，静默拉取最新
        fetch('/api/state?t='+Date.now()).then(r=>r.json()).then(d2 => {
          if (d2.ok && d2.db) { window.__DB = d2.db; localStorage.setItem(STORE_KEY, JSON.stringify(d2.db)); }
        });
      }
    })
    .catch(e => {
      window.isSavingDB = false;
      console.warn('[Sync] 网络异常，已保存至本地', e);
    });
  return Promise.resolve({ ok: true });
};

// ======================= 状态权重保护 =======================
const STATUS_WEIGHT = { 'pending':1, 'pending_review':2, 'processing':3, 'waiting_sms':3, 'delivered':4, 'out_of_stock':4, 'luban_error':4, 'smm_error':4, 'rejected':4 };

// 全局 fetch 拦截，用于数据保护
const _nativeFetch = window.fetch;
window.fetch = function(url, opts) {
  const u = String(url || '');
  
  // 1. 拦截数据读取，防止本地最新状态被服务端旧数据覆盖
  if (u.indexOf('/api/state') >= 0 && (!opts || !opts.method || opts.method === 'GET')) {
    return _nativeFetch.apply(this, arguments).then(function(res) {
      if (!res.ok) return res;
      return res.clone().json().then(function(d) {
        if (d && d.ok && d.db && d.db.orders) {
          const localDb = window.__DB || rawLoadDB();
          let changed = false;
          if (localDb && localDb.orders) {
            const localMap = {};
            localDb.orders.forEach(o => localMap[o.order_no] = o);
            
            d.db.orders.forEach(srvO => {
              const locO = localMap[srvO.order_no];
              if (locO) {
                const lWeight = STATUS_WEIGHT[locO.status] || 0;
                const sWeight = STATUS_WEIGHT[srvO.status] || 0;
                if (lWeight > sWeight || (locO.luban_code && !srvO.luban_code) || (locO.luban_phone && !srvO.luban_phone)) {
                  srvO.status = locO.status;
                  srvO.luban_code = locO.luban_code || srvO.luban_code;
                  srvO.luban_phone = locO.luban_phone || srvO.luban_phone;
                  srvO.luban_request_id = locO.luban_request_id || srvO.luban_request_id;
                  srvO.payer_name = locO.payer_name || srvO.payer_name;
                  changed = true;
                }
              }
            });
          }
          if (changed) {
            return new Response(JSON.stringify(d), { status: res.status, headers: res.headers });
          }
        }
        return res;
      }).catch(() => res);
    });
  }

  // 2. 拦截 USDT 到账检测，一旦到账立即取号
  if (u.indexOf('/api/usdt-check') >= 0) {
    return _nativeFetch.apply(this, arguments).then(function(res) {
      res.clone().json().then(function(d) {
        if (d && d.ok && d.auto && d.status !== 'pending') {
          const db = window.loadDB();
          db.orders.forEach(function(o) {
            if (o.pay_method === 'usdt' && o.status === 'pending') {
              o.status = 'processing';
              window.saveDB(db);
              window.payOrder(o.order_no);
            }
          });
        }
      }).catch(()=>{});
      return res;
    });
  }

  return _nativeFetch.apply(this, arguments);
};

// ======================= 核心业务 =======================
const STATUS_TEXT = {pending:'待支付', pending_review:'待审核', processing:'处理中', waiting_sms:'等待接码', delivered:'已发货', out_of_stock:'缺货待补发', rejected:'已驳回', luban_error:'接码失败', smm_error:'提交失败'};
const STATUS_CLASS = {pending:'gray', pending_review:'warn', processing:'warn', waiting_sms:'warn', delivered:'ok', out_of_stock:'no', rejected:'no', luban_error:'no', smm_error:'no'};

function route(){
  const hash = location.hash.replace(/^#/, '') || '/';
  window.scrollTo(0,0);
  if (!window.__ready){ $('#app').innerHTML = '<div class="loading">正在同步数据…</div>'; return; }
  applySiteConfig();
  
  // 清理离开页面时的轮询
  if (hash.indexOf('/order/') !== 0) {
    if (window._globalPollTimer) { clearInterval(window._globalPollTimer); window._globalPollTimer = null; }
    if (window._pollTimers) {
      Object.keys(window._pollTimers).forEach(k => { clearTimeout(window._pollTimers[k]); delete window._pollTimers[k]; });
    }
  }

  if (hash.indexOf('/luban') === 0) return renderLubanClient();
  if (hash.indexOf('/order/') === 0) return renderOrderPage(decodeURIComponent(hash.slice(7)));
  if (hash.indexOf('/query') === 0) return renderQueryPage();
  if (hash.indexOf('/member') === 0) return renderMemberPage();
  if (hash.indexOf('/admin') === 0) return renderAdminPage();
  if (hash.indexOf('/smm') === 0) return renderSmmClient();
  return renderHome();
}
window.addEventListener('hashchange', route);

// 全局轮询后台审核状态
window._globalPollTimer = setInterval(() => {
  if (!sessionStorage.getItem('yunfaka_admin_token') && location.hash.indexOf('#/order/') === 0) {
    const orderNo = location.hash.split('/').pop();
    fetch('/api/state?t=' + Date.now()).then(r=>r.json()).then(d => {
      if (!d || !d.ok || !d.db) return;
      const srvO = (d.db.orders || []).find(x => x.order_no === orderNo);
      if (!srvO) return;
      const locO = window.loadDB().orders.find(x => x.order_no === orderNo);
      if (locO && locO.status !== srvO.status) {
        window.__DB = d.db;
        localStorage.setItem(STORE_KEY, JSON.stringify(d.db));
        if (srvO.status === 'processing' && window.payOrder) window.payOrder(orderNo);
        else if (window.route) window.route();
      }
    }).catch(()=>{});
  }
}, 12000);

// 订单取号与处理
window.payOrder = function(orderNo) {
  const db = loadDB();
  const o = db.orders.find(x => x.order_no === orderNo);
  if (!o || ['delivered', 'rejected', 'luban_error', 'smm_error'].includes(o.status)) return;
  if (o.luban_phone || o.smm_order_id) return;

  o.status = 'processing';
  saveDB(db);

  if (o.source === 'luban') {
    toast('正在为您分配号码…', 'info');
    if (o.luban_type === 'common') {
      const params = { keyword: o.luban_keyword || '' };
      if (o.luban_country) params.country = o.luban_country;
      if (window.lubanStartCommon) window.lubanStartCommon(orderNo, params);
    } else {
      if (window.lubanStartSession) window.lubanStartSession(orderNo);
    }
  } else if (o.source === 'smm') {
    toast('正在提交推广任务…', 'info');
    if (window.smmApi) {
      window.smmApi('add', { order_no: o.order_no, service: o.smm_service_id, link: o.smm_link, quantity: o.quantity })
        .then(r => {
          const db2 = loadDB(); const o2 = db2.orders.find(x => x.order_no === orderNo); if (!o2) return;
          if (r.ok && r.data && r.data.order) {
            o2.smm_order_id = String(r.data.order); o2.smm_state = 'In progress'; saveDB(db2);
            toast('已提交，服务单号：' + r.data.order, 'success');
            if (window.startPoll) window.startPoll(orderNo);
          } else {
            o2.status = 'smm_error'; o2.smm_error = '提交失败'; saveDB(db2);
          }
        });
    }
  }
  if (location.hash.indexOf('#/order/') === 0) setTimeout(route, 500);
};

window._pollTimers = {};
window.lubanPollSms = function(orderNo, attempt) {
  if (attempt === undefined) attempt = 0;
  if (attempt > 40) return;
  if (window._pollTimers[orderNo]) clearTimeout(window._pollTimers[orderNo]);
  
  const db = loadDB(); const o = db.orders.find(x => x.order_no === orderNo);
  if (!o || !o.luban_request_id) return;
  
  _nativeFetch('/api/luban?action=get_sms&request_id=' + encodeURIComponent(o.luban_request_id) + '&order_no=' + encodeURIComponent(orderNo))
    .then(r => r.json())
    .then(d => {
      const db2 = loadDB(); const o2 = db2.orders.find(x => x.order_no === orderNo); if (!o2) return;
      const sms = d && d.data && (d.data.sms || d.data.code || d.data.message || d.data.text);
      if (d && d.code === 0 && sms) {
        o2.luban_code = String(sms); o2.status = 'delivered'; o2.delivered_at = now();
        saveDB(db2);
        toast('收到验证码：' + o2.luban_code, 'success');
        if (window.yfStrongAlert) window.yfStrongAlert(o2.luban_code);
        if (location.hash.indexOf('#/order/') === 0) route();
      } else {
        window._pollTimers[orderNo] = setTimeout(() => window.lubanPollSms(orderNo, attempt+1), 15000);
      }
    }).catch(() => {
      window._pollTimers[orderNo] = setTimeout(() => window.lubanPollSms(orderNo, attempt+1), 15000);
    });
};

window.lubanCommonPoll = function(orderNo, attempt) {
  if (attempt === undefined) attempt = 0;
  if (attempt > 40) return;
  if (window._pollTimers[orderNo]) clearTimeout(window._pollTimers[orderNo]);
  
  const db = loadDB(); const o = db.orders.find(x => x.order_no === orderNo);
  if (!o || !o.luban_phone) return;
  
  const url = '/api/luban?action=common_get_sms&phone=' + encodeURIComponent(o.luban_phone) + '&keyword=' + encodeURIComponent(o.luban_keyword||'') + '&order_no=' + encodeURIComponent(orderNo);
  _nativeFetch(url)
    .then(r => r.json())
    .then(d => {
      const db2 = loadDB(); const o2 = db2.orders.find(x => x.order_no === orderNo); if (!o2) return;
      const sms = d && d.data && (d.data.sms || d.data.code || d.data.message || d.data.text);
      if (d && d.code === 0 && sms) {
        o2.luban_code = String(sms); o2.status = 'delivered'; o2.delivered_at = now();
        saveDB(db2);
        toast('收到验证码：' + o2.luban_code, 'success');
        if (window.yfStrongAlert) window.yfStrongAlert(o2.luban_code);
        if (location.hash.indexOf('#/order/') === 0) route();
      } else {
        window._pollTimers[orderNo] = setTimeout(() => window.lubanCommonPoll(orderNo, attempt+1), 15000);

};

window.submitBuy = function(id){
  const db = loadDB(); const p = db.products.find(x => x.id === id);
  const secret = $('#buy-secret').value.trim();
  if (!secret) return toast('请输入暗号', 'error');
  const qty = parseInt($('#buy-qty').value) || 1;
  const skuId = p.skus.length ? parseInt(document.querySelector('.sku-option.active').dataset.sku) : 0;
  const sku = p.skus.find(s => s.id === skuId);
  const amount = (sku ? sku.price : p.price) * qty;
  
  const orderNo = genOrderNo();
  db.orders.unshift({
    order_no: orderNo, product_id: p.id, product_name: p.name, sku_id: skuId, sku_name: sku ? sku.name : '',
    quantity: qty, amount: amount, amount_due: amount, secret: secret, status: 'pending', pay_method: 'alipay', cards: [], created_at: now(), usdt_rate: usdtRate()
  });
  saveDB(db);
  saveMyOrder(orderNo, secret);
  closeModal();
  location.hash = '#/order/' + orderNo;
  setTimeout(() => showPayModal('order', orderNo), 500);
};

window.confirmPay = function(type, id){

<script>

var _origFetchP51 = window.fetch;
window.fetch = function(url, opts) {
  var u = String(url || '');
  
  // 修复普通用户给 /api/public 传参时缺少虚拟商品标识的问题
  if (u.indexOf('/api/public') >= 0 && opts && typeof opts.body === 'string') {

          body.source = o.source;
          body.status = o.status; // 确保状态同步
          opts.body = JSON.stringify(body);
        }
      }
    } catch(e){}
  }

  return _origFetchP51.apply(this, arguments);
};

// 3. 统一接管支付成功后的取号动作（余额、USDT、口令红包）
var _origPayOrder = window.payOrder;
window.payOrder = function(orderNo) {
  var db = window.loadDB();
  var o = db.orders.find(x => x.order_no === orderNo);
  if (!o || ['delivered', 'rejected', 'luban_error', 'smm_error'].includes(o.status)) return;
  if (o.luban_phone || o.smm_order_id) return;

  o.status = 'processing';
  window.saveDB(db);

  if (o.source === 'luban') {
    if (window.toast) toast('正在分配号码…', 'info');
    if (o.luban_type === 'common') {

      if (window.lubanStartCommon) window.lubanStartCommon(orderNo, p);

  }
};

// 4. 防状态倒退（解决刷新后待审核退回待支付）
var STATUS_WEIGHT = { 'pending':1, 'pending_review':2, 'processing':3, 'delivered':4, 'rejected':4, 'luban_error':4, 'smm_error':4 };
var _origFetchGetState = window.fetch;
window.fetch = function(url, opts) {
  var u = String(url || '');
  if (u.indexOf('/api/state') >= 0 && (!opts || !opts.method || opts.method === 'GET')) {
    return _origFetchGetState.apply(this, arguments).then(function(res){
      return res.clone().json().then(function(d){
        if (d && d.ok && d.db && d.db.orders) {
          var localDb = window.loadDB();
          var changed = false;
          if (localDb && localDb.orders) {
            var localMap = {};
            localDb.orders.forEach(o => localMap[o.order_no] = o);
            d.db.orders.forEach(srvO => {
              var locO = localMap[srvO.order_no];
              if (locO && (STATUS_WEIGHT[locO.status] || 0) > (STATUS_WEIGHT[srvO.status] || 0)) {
                srvO.status = locO.status; changed = true;
              }
            });
          }
          if (changed) return new Response(JSON.stringify(d), { status: res.status, headers: res.headers });
        }
        return res;
      }).catch(() => res);
    });
  }
  return _origFetchGetState.apply(this, arguments);
};
