<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>云发卡 · 自动发货</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e8eaf0;--primary:#6366f1;--primary2:#8b5cf6;--danger:#ef4444;--ok:#10b981;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -8px rgba(16,24,40,.12);--tg-btn-color:#0088cc;--tg-btn-shadow:rgba(0,136,204,.6)}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}button{font-family:inherit}
.nav{position:-webkit-sticky;position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:inline-block;flex-shrink:0}
.nav nav{display:flex;gap:6px;align-items:center}
.nav nav a{padding:8px 14px;border-radius:10px;font-size:14px;color:var(--muted);transition:.15s;white-space:nowrap}
.nav nav a:hover{background:#f0f1f6;color:var(--text)}
.tg-btn{display:inline-flex!important;align-items:center;gap:5px;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;color:#fff!important;background:var(--tg-btn-color);box-shadow:0 4px 12px -4px var(--tg-btn-shadow);transition:.18s}
.tg-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.tg-btn svg{width:16px;height:16px;fill:#fff}
.tg-float{position:fixed;right:22px;bottom:26px;width:56px;height:56px;border-radius:50%;background:var(--tg-btn-color);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -6px var(--tg-btn-shadow);z-index:150;transition:.2s}
.tg-float:hover{transform:scale(1.08) translateY(-2px)}
.tg-float svg{width:26px;height:26px;fill:#fff}
.tg-float::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--tg-btn-color);opacity:.35;animation:pulse 2.2s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
main{max-width:1080px;margin:0 auto;padding:24px 20px 90px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;background:#eef0f6;color:var(--text)}
.btn:hover{filter:brightness(.97)}.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 14px -4px rgba(99,102,241,.6)}
.btn.danger{background:#fee2e2;color:#b91c1c}.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}.btn.block{display:block;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;outline:none;transition:.15s;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
input[type=checkbox]{width:auto;accent-color:var(--primary)}
label.field{display:block;margin-bottom:14px}
label.field > span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}.hidden{display:none!important}
.hero{background:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#a855f7);border-radius:20px;padding:34px 30px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden}
.hero h1{margin:0 0 8px;font-size:26px;letter-spacing:.5px}.hero p{margin:0;opacity:.92;font-size:14px}
.hero .blob{position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.14);right:-70px;top:-90px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.cat-tab{flex:1 1 44%;min-width:44%;display:flex;align-items:center;justify-content:center;gap:4px;text-align:center}
.cat-tab{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;font-family:inherit}
.cat-tab:hover{border-color:#c7cbe0;color:var(--text)}
.cat-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;box-shadow:0 4px 12px -4px rgba(99,102,241,.55)}
.cat-tab .n{opacity:.65;font-weight:500;margin-left:5px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.product{padding:20px;display:flex;flex-direction:column;gap:12px;transition:.18s}
.product:hover{transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(16,24,40,.22)}
.p-name{font-size:16px;font-weight:700}
.p-desc{font-size:13px;color:var(--muted);line-height:1.6;min-height:21px}
.p-price{font-size:22px;font-weight:800;color:#e11d48}.p-price small{font-size:13px;font-weight:600}
.p-price .from{font-size:12px;font-weight:600;color:#6b7280;margin-left:2px}
.sku-tags{display:flex;flex-wrap:wrap;gap:4px}
.sku-tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f5f3ff;color:#6366f1;font-weight:600}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.badge.ok{background:#dcfce7;color:#15803d}.badge.no{background:#fee2e2;color:#b91c1c}
.badge.gray{background:#eef0f6;color:#6b7280}.badge.cat{background:#eef2ff;color:#4f46e5}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.src{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.badge.src-luban{background:#fef3c7;color:#b45309;border:1px solid #fcd34d}
.pay-methods{display:flex;gap:10px;flex-wrap:wrap}
.pay-method{flex:1;min-width:100px;display:flex;align-items:center;gap:8px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:#fff;font-weight:600;font-size:14px;user-select:none;-webkit-user-select:none}
.pay-method:hover{border-color:#c7cbe0}.pay-method input{width:auto;margin:0}
.pay-method.active{border-color:var(--primary);background:#f5f3ff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.pay-method .logo{font-size:18px}
.sku-options{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.sku-option{padding:10px 16px;border:2px solid var(--line);border-radius:10px;cursor:pointer;transition:.15s;background:#fff;font-size:14px;font-weight:600;user-select:none;-webkit-user-select:none;font-family:inherit}
.sku-option:hover{border-color:#c7cbe0}
.sku-option.active{border-color:var(--primary);background:#f5f3ff;color:var(--primary)}
.sku-option small{display:block;font-size:11px;color:#e11d48;margin-top:2px;font-weight:700}
.sku-option.active small{color:#6366f1}
.balance-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fef9e7;border:1px dashed #fcd34d;border-radius:10px;margin-bottom:14px;font-size:14px}
.balance-row .lbl{display:flex;align-items:center;gap:8px;font-weight:600;color:#92400e}
.balance-row .val{color:#b45309;font-weight:700}
.panel{padding:24px;margin-bottom:16px}
.panel h2{margin:0 0 18px;font-size:17px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right;word-break:break-all}
.codebox{background:#0f172a;color:#7dd3fc;padding:14px 16px;border-radius:10px;font-size:15px;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.codebox span{word-break:break-all}
.codebox button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;flex-shrink:0}.qr-wrap{text-align:center;padding:14px;background:#f8fafc;border-radius:12px;margin:12px 0}
.qr-wrap img{max-width:220px;width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.qr-tip{font-size:12px;color:var(--muted);margin-top:8px}
.addr-box{background:#0f172a;color:#7dd3fc;padding:12px 14px;border-radius:10px;font-size:13px;word-break:break-all;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.addr-box span{flex:1;text-align:left}
.addr-box button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;flex-shrink:0}
.redpacket-box{background:linear-gradient(135deg,#ff5722,#e91e63);color:#fff;border-radius:14px;padding:22px 20px;text-align:center;margin:14px 0;position:relative;overflow:hidden}
.redpacket-box::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);right:-50px;top:-50px}
.redpacket-box .lbl{font-size:13px;opacity:.9;margin-bottom:8px;position:relative;z-index:1}
.redpacket-box .code{font-size:32px;font-weight:900;letter-spacing:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-bottom:12px;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.redpacket-box .copy-btn{background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.4);color:#fff;padding:9px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;position:relative;z-index:1;font-family:inherit}
.redpacket-box .copy-btn:hover{background:rgba(255,255,255,.4)}
.redpacket-steps{background:#fff5f5;border:1px dashed #fc8181;border-radius:10px;padding:14px 18px;font-size:13px;color:#742a2a;line-height:2;margin-bottom:14px}
.redpacket-steps ol{margin:0;padding-left:20px}
.redpacket-steps b{color:#c53030}
.session-box{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border-radius:14px;padding:22px 24px;margin:14px 0;position:relative;overflow:hidden}
.session-box::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-60px}
.session-box .lbl{font-size:13px;opacity:.9;margin-bottom:6px;position:relative;z-index:1}
.session-box .num{font-size:26px;font-weight:900;letter-spacing:1px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-bottom:12px;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.2);word-break:break-all}
.session-box .timer{font-size:14px;font-weight:600;opacity:.95;position:relative;z-index:1;display:inline-block;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:8px}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:18px;width:100%;max-width:440px;padding:24px;box-shadow:0 24px 60px -12px rgba(0,0,0,.35);animation:pop .2s;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 18px;font-size:17px}
.modal.wide{max-width:560px}
.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);background:#1f2430;color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#b91c1c}.toast.success{background:#047857}.toast.info{background:#0369a1}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{padding:9px 16px;border-radius:10px;border:0;background:#eef0f6;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.tabs button .nb{background:#ef4444;color:#fff;font-size:10px;border-radius:99px;padding:1px 6px;margin-left:5px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.stat .n{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tbody tr:hover{background:#fafbfe}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.section-title{font-size:15px;font-weight:700;margin:26px 0 12px}
.member-card{background:linear-gradient(135deg,#1e293b,#334155);border-radius:18px;padding:22px 24px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden}
.member-card::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(99,102,241,.25);right:-70px;bottom:-90px}
.member-card .lbl{font-size:13px;opacity:.75;margin-bottom:4px}
.member-card .amt{font-size:34px;font-weight:800;letter-spacing:.5px}
.member-card .amt small{font-size:16px;font-weight:600;opacity:.85}
.member-card .id{font-size:12px;opacity:.7;margin-top:8px;position:relative;z-index:1;line-height:1.8}
.member-card .id b{color:#c7d2fe}
.quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick-amounts button{padding:10px 18px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);font-family:inherit;transition:.15s}
.quick-amounts button:hover{border-color:var(--primary);color:var(--primary)}
.quick-amounts button.active{background:#f5f3ff;border-color:var(--primary);color:var(--primary)}
.auth-panel{max-width:420px;margin:40px auto}
.auth-tabs{display:flex;background:#eef0f6;border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:10px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);border-radius:9px;transition:.15s;font-family:inherit}
.auth-tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px -2px rgba(16,24,40,.12)}
.auth-tip{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.7}
.field-err{color:#b91c1c;font-size:12px;margin-top:6px;display:block;min-height:14px}
.find-pwd-link{text-align:center;font-size:13px;margin:10px 0 0}
.find-pwd-link a{color:#6366f1;font-weight:600}
.rp-code-cell{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;color:#e91e63;letter-spacing:1px;font-size:13px}
.sku-editor{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.sku-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.sku-row input{padding:8px 10px;font-size:13px}
.sku-row .sku-name{flex:2}
.sku-row .sku-price{flex:1}
.sku-row .sku-del{flex:0 0 auto;background:#fee2e2;color:#b91c1c;border:0;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-weight:600}
.sku-add{margin-top:4px;background:#eef2ff;color:#4f46e5;border:1px dashed #a5b4fc;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.sku-add:hover{background:#e0e7ff}
.sku-hint{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.6}
.tg-hint{background:#e0f2fe;border:1px solid #7dd3fc;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#075985;line-height:1.7}
.tg-hint code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px}
.luban-hint{background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:12px 16px;margin:14px 0;font-size:13px;color:#92400e;line-height:1.7}
.color-swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.color-swatch{width:34px;height:34px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:.15s}
.color-swatch:hover{transform:scale(1.1)}
@media (max-width:600px){.nav nav a:not(.tg-btn){padding:8px 9px;font-size:13px}#nav-tg{display:none!important}.hero h1{font-size:21px}.tg-float{right:16px;bottom:18px;width:50px;height:50px}.pay-method{min-width:80px;padding:10px 12px;font-size:13px}.member-card .amt{font-size:28px}.redpacket-box .code{font-size:26px;letter-spacing:2px}.session-box .num{font-size:20px}.modal.wide{max-width:100%}}
</style>
</head>

<script>
/* ==================================================================
   云发卡 v16 · 完整重构版
   已合并历史所有补丁，删除死代码，新增汇率快照
   ================================================================== */
'use strict';

/* ---------------- 工具函数 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yuan = fen => (Number(fen||0)/100).toFixed(2);

function usdtRate(){
  try {
    const cfg = (window.__DB && window.__DB.config) || {};
    return Number(cfg.pay_usdt_rate_recharge_bonus) || 7.2;
  } catch(e){ return 7.2; }
}
/* 当前汇率换算（用于渲染非订单场景，如商品列表） */
const usdt = fen => (Number(fen||0)/100/usdtRate()).toFixed(2);

/* 汇率快照换算：优先用订单自身记录的汇率，保证历史订单金额不随汇率波动 */
const orderUsdt = (fen, order) => {
  const rate = Number(order && order.usdt_rate) || usdtRate();
  return (Number(fen||0)/100/rate).toFixed(2);
};

let toastTimer;
function toast(msg, type){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 3000);

function copyText(text, btn){

  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){ toast('复制失败','error'); }

function hexToRgba(hex, alpha){
  const h = String(hex||'#0088cc').replace('#','');
  const full = h.length === 3 ? h.split('').map(c => c+c).join('') : h;
  const r = parseInt(full.slice(0,2),16)||0, g = parseInt(full.slice(2,4),16)||0, b = parseInt(full.slice(4,6),16)||0;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function hashPwd(pwd){
  const salt = 'yfk2024salt';
  const str = salt + '::' + pwd + '::' + salt;
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 + c, 0x85ebca6b) >>> 0;
  }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}

function rawLoadDB(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw){ const d = seedDB(); localStorage.setItem(STORE_KEY, JSON.stringify(d)); return d; }
    const d = JSON.parse(raw);
    if (!d.products || !d.cards || !d.orders) throw new Error('bad');
    if (!d.config) d.config = Object.assign({}, DEFAULT_CONFIG);
    Object.keys(DEFAULT_CONFIG).forEach(k => { if (d.config[k] === undefined) d.config[k] = DEFAULT_CONFIG[k]; });
    if (!Array.isArray(d.categories)) d.categories = [];
    if (!Array.isArray(d.members)) d.members = [];
    if (!Array.isArray(d.recharges)) d.recharges = [];
    d.products.forEach(p => { if (!Array.isArray(p.skus)) p.skus = []; if (!p.source) p.source = 'local'; });
    d.cards.forEach(c => { if (c.sku_id === undefined) c.sku_id = 0; });
    d.members = d.members.filter(m => m && m.username && m.password);
    d.members.forEach(m => { if (m.secret === undefined && m.contact !== undefined) m.secret = m.contact; });
    d.orders.forEach(o => {
      if (o.secret === undefined && o.contact !== undefined) o.secret = o.contact;
      if (!o.source) o.source = 'local';
    });
    if (!d.seq) d.seq = {product:0, card:0, category:0};
    if (!d.seq.category) d.seq.category = d.categories.reduce((m, c) => Math.max(m, c.id||0), 0);
    return d;
  } catch(e){
    const d = seedDB();
    localStorage.setItem(STORE_KEY, JSON.stringify(d));
    return d;
  }
}

/* ---------------- 购买 ---------------- */
let __buySkuId = 0;
function openBuy(id){
  const db = loadDB();
  const cfg = getConfig(db);
  const p = db.products.filter(x => x.id === id)[0];
  if (!p){ toast('商品不存在','error'); return; }
  const isLuban = p.source === 'luban';
  const skus = getSkus(p);
  const hasSku = skus.length > 0;
  const totalStock = stockOf(db, id);
  if (!isLuban && totalStock <= 0){ toast('该商品暂时缺货','error'); return; }

  let defaultSkuId = 0;
  if (hasSku){
    let firstOk = null;
    for (let i = 0; i < skus.length; i++) if (productStock(db, p, skus[i].id) > 0){ firstOk = skus[i]; break; }
    defaultSkuId = firstOk ? firstOk.id : skus[0].id;
  }
  __buySkuId = hasSku ? defaultSkuId : 0;

  const alipayEnabled = cfg.pay_alipay_enabled !== false;
  const usdtEnabled = cfg.pay_usdt_enabled !== false;
  const balanceEnabled = cfg.balance_enabled !== false;
  if (!alipayEnabled && !usdtEnabled && !balanceEnabled){ toast('商家未开启支付方式','error'); return; }
  const member = getCurrentMember(db);
  const lastSecret = (member && member.secret) || localStorage.getItem(LS_SECRET) || '';
  const cat = db.categories.filter(c => String(c.id) === String(p.category_id))[0];
  let initialPrice = p.price;
  if (hasSku){ const s = getSkuById(p, defaultSkuId); if (s) initialPrice = s.price; }
  const initialStock = isLuban ? 9999 : (hasSku ? productStock(db, p, defaultSkuId) : productStock(db, p, 0));
  const maxQty = isLuban ? 1 : Math.min(50, initialStock);

  const skuHtml = hasSku ? `<label class="field"><span>选择规格</span><div class="sku-options" id="buy-skus">${skus.map(s => {
    const st = productStock(db, p, s.id);
    const dis = st <= 0;
    const cls = String(s.id)===String(defaultSkuId) ? 'active' : '';
    const disAttr = dis ? 'disabled style="opacity:.4;cursor:not-allowed"' : '';
    return `<button class="sku-option ${cls}" data-sku="${s.id}" ${disAttr}>${esc(s.name)}<small>${usdt(s.price)} USDT${dis?' · 缺货':''}</small></button>`;
  }).join('')}</div></label>` : '';

  const catKv = cat ? `<div class="kv"><span class="k">分类</span><span class="v">${esc(cat.name)}</span></div>` : '';
  const lubanKv = isLuban ? `<div class="kv"><span class="k">接码类型</span><span class="v" style="color:#b45309">${p.luban_type==='common'?'通用短信接收':'验证码接收'}</span></div>
    <div class="kv"><span class="k">国家</span><span class="v">${esc(p.luban_country || '-')}</span></div>` : '';
  const lubanTip = isLuban ? '<div style="background:#fef3c7;border:1px dashed #fcd34d;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:#92400e;line-height:1.6">⚠️ 接码服务：付款后系统会立即分配号码，请在 20 分钟内完成目标平台注册，超时号码将自动释放。</div>' : '';
  const qtyHtml = isLuban ? '' : `<label class="field"><span>购买数量（库存 <span id="buy-stock-label">${initialStock}</span>）</span><input id="buy-qty" type="number" min="1" max="${maxQty}" value="1"></label>`;

  openModal(`<h3>${isLuban ? '确认接码' : '确认购买'}</h3>
    <div class="kv"><span class="k">商品</span><span class="v">${esc(p.name)}</span></div>
    ${catKv}${lubanKv}${skuHtml}
    <div class="kv" style="margin-bottom:14px"><span class="k">单价</span><span class="v" style="color:#e11d48" id="buy-unit">${usdt(initialPrice)} USDT</span></div>
    ${qtyHtml}
    <label class="field"><span>暗号（用于查询订单 / 找回会员密码）</span><input id="buy-secret" type="text" placeholder="自定义内容，请务必牢记" maxlength="60" value="${esc(lastSecret)}"></label>
    <div id="balance-box"></div>
    <div class="spread" style="margin:14px 0;padding-top:14px;border-top:1px dashed var(--line)">
      <span class="muted" style="font-size:13px">订单金额</span><span id="buy-amount" style="font-size:18px;font-weight:800;color:#e11d48">${usdt(initialPrice)} USDT</span>
    </div>
    <div class="spread" style="margin-bottom:8px"><span class="muted" style="font-size:13px">余额抵扣</span><span id="buy-deduct" style="font-weight:700;color:#b45309">-¥0.00</span></div>
    <div class="spread" style="margin-bottom:16px"><span class="muted" style="font-size:13px">还需支付</span><span id="buy-due" style="font-size:20px;font-weight:800;color:#e11d48">${usdt(initialPrice)} USDT</span></div>
    <div id="buy-cny-hint" style="text-align:right;font-size:12px;color:#6b7280;margin-top:4px">支付宝付款约 ¥${yuan(initialPrice)}（按汇率换算）</div>
    ${lubanTip}
    <div id="pay-method-wrap">
      <label class="field" style="margin-bottom:14px"><span>支付方式</span>
        <div class="pay-methods" id="pay-methods">
          ${usdtEnabled ? '<label class="pay-method active" data-method="usdt"><input type="radio" name="pay-method" value="usdt" checked><span class="logo">🪙</span> USDT</label>' : ''}
          ${alipayEnabled ? `<label class="pay-method ${!usdtEnabled?'active':''}" data-method="alipay"><input type="radio" name="pay-method" value="alipay" ${!usdtEnabled?'checked':''}><span class="logo">💰</span> 支付宝</label>` : ''}
        </div>
      </label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:8px">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn primary" id="buy-submit" onclick="submitBuy(${p.id})">${isLuban ? '确认付款并接码' : '确认订单'}</button>
    </div>`);

  const qty = $('#buy-qty');
  const secretEl = $('#buy-secret');

  function getCurrentPrice(){
    if (!hasSku) return p.price;
    const sku = getSkuById(p, __buySkuId);
    return sku ? sku.price : p.price;
  }
  function refreshTotals(){
    const q = isLuban ? 1 : (parseInt(qty.value) || 1);
    const price = getCurrentPrice();
    const amount = price * q;
    const m = getCurrentMember(loadDB());
    const balance = m ? (m.balance || 0) : 0;
    const cb = $('#use-balance');
    const useBalance = cb && cb.checked && balanceEnabled && m;
    const deduct = useBalance ? Math.min(balance, amount) : 0;
    const due = amount - deduct;
    const paySel = document.querySelector('input[name="pay-method"]:checked');
    const isAlipay = paySel && paySel.value === 'alipay';
    const fmt = fen => isAlipay ? '¥' + yuan(fen) : usdt(fen) + ' USDT';
    $('#buy-unit').textContent = fmt(price);
    $('#buy-amount').textContent = fmt(amount);
    $('#buy-deduct').textContent = isAlipay ? '-¥' + yuan(deduct) : '-' + usdt(deduct) + ' USDT';
    $('#buy-due').textContent = fmt(due);
    if ($('#buy-cny-hint')){
      $('#buy-cny-hint').textContent = isAlipay
        ? 'USDT计价约 ' + usdt(due) + ' USDT（按汇率换算）'
        : '支付宝付款约 ¥' + yuan(due) + '（按汇率换算）';
    }
    const wrap = $('#pay-method-wrap');
    if (due === 0){ wrap.style.opacity = '0.4'; wrap.style.pointerEvents = 'none'; }
    else { wrap.style.opacity = '1'; wrap.style.pointerEvents = 'auto'; }
  }
  function refreshBalance(){
    const box = $('#balance-box');
    const m = getCurrentMember(loadDB());
    if (m && balanceEnabled){
      const balance = m.balance || 0;
      if (balance > 0){
        box.innerHTML = `<div class="balance-row"><div class="lbl">💎 会员「${esc(m.username)}」余额 ${usdt(balance)} USDT</div>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#92400e;font-weight:600;font-size:13px">
          <input type="checkbox" id="use-balance" checked> 使用余额抵扣</label></div>`;
        $('#use-balance').addEventListener('change', refreshTotals);
      } else {
        box.innerHTML = '<div class="balance-row" style="background:#f1f5f9;border-color:#cbd5e1;color:#475569"><div class="lbl" style="color:#475569">💎 余额不足</div><a href="#/member" onclick="closeModal()" style="font-size:13px;color:#6366f1;font-weight:600">去充值 →</a></div>';
      }
    } else if (balanceEnabled && !m){
      box.innerHTML = '<div class="balance-row" style="background:#f1f5f9;border-color:#cbd5e1;color:#475569"><div class="lbl" style="color:#475569">💎 登录会员可用余额抵扣</div><a href="#/member" onclick="closeModal()" style="font-size:13px;color:#6366f1;font-weight:600">去登录 →</a></div>';
    } else box.innerHTML = '';
    refreshTotals();
  }

  if (hasSku){
    document.querySelectorAll('#buy-skus .sku-option').forEach(el => {
      el.addEventListener('click', () => {
        if (el.disabled) return;
        document.querySelectorAll('#buy-skus .sku-option').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        __buySkuId = parseInt(el.dataset.sku);
        refreshTotals();
      });
    });
  }
  if (qty){
    qty.addEventListener('input', () => {
      if (qty.value === ''){ refreshTotals(); return; }  /* ⭐ 允许临时删空，方便输入新数字 */
      let v = parseInt(qty.value) || 1;
      const maxQ = Math.min(50, productStock(loadDB(), p, __buySkuId));
      v = Math.max(1, Math.min(maxQ, v));
      qty.value = v;
      refreshTotals();
    });
    qty.addEventListener('blur', () => {
      let v = parseInt(qty.value) || 1;
      const maxQ = Math.min(50, productStock(loadDB(), p, __buySkuId));
      v = Math.max(1, Math.min(maxQ, v));
      qty.value = v;
      refreshTotals();
    });
  }
  secretEl.addEventListener('keydown', e => { if (e.key === 'Enter') submitBuy(p.id); });
  document.querySelectorAll('#pay-methods .pay-method').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('#pay-methods .pay-method').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      const r = el.querySelector('input[type=radio]');
      if (r) r.checked = true;
      refreshTotals();
    });
  });
  refreshBalance();
  if (qty){ qty.focus(); qty.select(); }
}

var _submitting = false;
function submitBuy(id){
  if (_submitting){ toast('正在处理，请勿重复提交','warn'); return; }
  _submitting = true; setTimeout(function(){_submitting=false;}, 3000);
  const db = loadDB();
  const cfg = getConfig(db);
  const p = db.products.filter(x => x.id === id)[0];
  if (!p){ toast('商品不存在','error'); return; }
  const isLuban = p.source === 'luban';
  const hasSku = hasSkus(p);
  const secret = $('#buy-secret').value.trim();
  const sErr = validateSecret(secret);
  if (sErr){ toast(sErr,'error'); $('#buy-secret').focus(); return; }
  const sku = hasSku ? getSkuById(p, __buySkuId) : null;
  if (hasSku && !sku){ toast('请选择规格','error'); return; }
  const price = hasSku ? sku.price : p.price;
  let qty = 1;
  if (!isLuban){
    qty = parseInt($('#buy-qty').value) || 1;
    const stock = productStock(db, p, hasSku ? sku.id : 0);
    if (qty < 1){ toast('数量至少为 1','error'); return; }
    if (qty > stock){ toast('库存不足，当前仅剩 ' + stock + ' 件','error'); return; }
  }
  const amount = price * qty;
  const balanceEnabled = cfg.balance_enabled !== false;
  const member = getCurrentMember(db);
  const cb = $('#use-balance');
  const useBalance = cb && cb.checked && balanceEnabled && member;
  let deduct = 0;
  if (useBalance){
    deduct = Math.min(member.balance || 0, amount);
    if (deduct > 0 && !deductBalance(db, member.username, deduct)){ toast('余额扣除失败','error'); return; }
  }
  const due = amount - deduct;
  let payMethod = 'balance';
  if (due > 0){
    const radio = document.querySelector('input[name="pay-method"]:checked');
    if (!radio){ toast('请选择支付方式','error'); return; }
    payMethod = radio.value;
  }
  const orderNo = genOrderNo();
  const order = {
    order_no: orderNo, product_id: id, product_name: p.name,
    sku_id: hasSku ? sku.id : 0, sku_name: hasSku ? sku.name : '',
    category_id: p.category_id || 0, quantity: qty, amount,
    balance_used: deduct, amount_due: due, secret,
    username: member ? member.username : '',
    status: 'pending', pay_method: payMethod, cards: [],
    note: p.note || '', created_at: now(), delivered_at: '',
    source: p.source || 'local',
    luban_type: p.luban_type || '',
    luban_service_id: p.luban_service_id || '',
    luban_service_name: p.luban_service_name || '',
    luban_country: p.luban_country || '',
    usdt_rate: usdtRate()   /* ⭐ 汇率快照 */
  };
  if (payMethod === 'alipay') order.redpacket_code = genRedpacketCode(cfg.pay_alipay_redpacket_prefix);
  db.orders.unshift(order);
  saveDB(db);
  saveMyOrder(orderNo, secret);
  localStorage.setItem(LS_SECRET, secret);
  closeModal();
  if (due === 0){
    payOrder(orderNo);
    toast('支付成功，正在处理…','success');
    if (location.hash === '#/order/' + orderNo) route();
    else location.hash = '#/order/' + orderNo;
  } else showPayModal('order', orderNo);
}

function confirmPay(type, id){
  const db = loadDB();
  if (type === 'order'){
    const o = db.orders.filter(x => x.order_no === id)[0];
    if (!o) return;
    if (o.pay_method === 'usdt'){
      if (!o.usdt_notified_at){ o.usdt_notified_at = now(); saveDB(db); notifyTg(o.order_no); }
      toast('已通知商家，系统正在自动检测到账','success');
      closeModal();
      location.hash = '#/order/' + id;
      if (location.hash === '#/order/' + id) route();
      return;
    }
    /* ⭐ 支付宝口令红包：先输入付款人姓氏再提交审核 */
    if (o.pay_method === 'alipay'){
      showPayerNameInput('order', id);
      return;
    }
    o.status = 'pending_review';
    o.submitted_at = now();
    saveDB(db);
    closeModal();
    toast('已提交，正在通知商家审核','success');
    notifyTg(o.order_no);
    location.hash = '#/order/' + id;
    if (location.hash === '#/order/' + id) route();
  } else if (type === 'recharge'){
    const r = db.recharges.filter(x => x.id === id)[0];
    if (!r) return;
    if (r.status === 'success'){ toast('该充值已到账','success'); return; }
    if (r.method === 'usdt'){
      if (!r.usdt_notified_at){ r.usdt_notified_at = now(); saveDB(db); try{notifyTg(r.id);}catch(e){} }
      toast('已提交，系统正在自动检测USDT到账…','success');
      closeModal();
      startUsdtPolling(r.id);
      location.hash = '#/member';
      if (location.hash === '#/member') route();
      return;
    }
    /* ⭐ 支付宝充值口令红包：先输入付款人姓氏再提交审核 */
    if (r.method === 'alipay'){
      showPayerNameInput('recharge', id);
      return;
    }
    r.status = 'pending_review';
    r.submitted_at = now();
    saveDB(db);
    closeModal();
    toast('已提交，管理员核实收款后到账','success');
    try{notifyTg(r.id);}catch(e){}
    location.hash = '#/member';
    if (location.hash === '#/member') route();
  }
}

/* ⭐ 充值到账处理（USDT自动到账/后台审核通过时调用） */
function processRecharge(id){
  const db = loadDB();
  const r = db.recharges.filter(x => x.id === id)[0];
  if (!r || r.status === 'success') return false;
  if (!addBalance(db, r.username, r.amount)) return false;
  var _bonusPct = parseFloat((db.config && db.config.recharge_bonus_pct) || 0);
  if (_bonusPct > 0){
    var _bonus = Math.round(r.amount * _bonusPct / 100);
    if (_bonus > 0){ addBalance(db, r.username, _bonus); r.bonus_amount = _bonus; }
  }
  r.status = 'success';
  r.completed_at = now();
  saveDB(db);
  try{notifyTg(r.id + '_recharge_success');}catch(e){}
  return true;
}
/* ⭐ 后台审核充值通过 */
function approveRecharge(id){
  if (!confirm('确认该充值已收款？确认后余额将到账。')) return;
  if (processRecharge(id)){
    toast('充值已到账 ✅','success');
    try{ var _r=loadDB().recharges.find(function(x){return x.id===id;}); if(_r) yfSendTgNow('💰 <b>充值已到账（店主确认）</b>\n\n单号：<code>'+id+'</code>\n会员：'+(_r.username||'-')+'\n金额：¥'+yuan(_r.amount)+(_r.bonus_amount?'\n赠送：¥'+yuan(_r.bonus_amount):'')+'\n付款人：'+(_r.payer_name||'-')); }catch(e){}
    renderMembers();
  }
  else toast('处理失败','error');
}

function cancelOrderRefund(orderNo){
  if (!confirm('确定取消订单？已抵扣的余额 ¥' + yuan((loadDB().orders.filter(function(x){return x.order_no===orderNo;})[0]||{}).balance_used || 0) + ' 将退回到会员账户。')) return;
  var db = loadDB();
  var o = db.orders.filter(function(x){return x.order_no===orderNo;})[0];
  if (!o || o.status !== 'pending'){ toast('订单状态不允许取消','error'); return; }
  if (o.balance_used && o.balance_used > 0){ addBalance(db, o.username, o.balance_used); }
  o.status = 'rejected'; o.completed_at = now();
  saveDB(db);
  toast('订单已取消，余额已退还','success');
  route();
}
function payOrder(orderNo){
  const db = loadDB();
  const o = db.orders.filter(x => x.order_no === orderNo)[0];
  if (!o || o.status !== 'pending') return;
  /* Luban 接码订单 */
  if (o.source === 'luban'){
    o.status = 'processing';
    saveDB(db);
    if (o.luban_type === 'common'){
      const params = { keyword: o.luban_keyword || '' };
      if (o.luban_country) params.country = o.luban_country;
      if (o.luban_phone) params.phone = o.luban_phone;
      if (o.luban_cardtype && o.luban_cardtype !== '全部') params.cardType = o.luban_cardtype;
      if (o.luban_filter === '是') params.filter = '1';
      lubanStartCommon(orderNo, params);
    } else lubanStartSession(orderNo);
    return;
  }
  /* 本地卡密商品 */
  const orderSku = o.sku_id || 0;
  const available = db.cards.filter(c => c.product_id === o.product_id && c.status === 'unused' && String(c.sku_id || 0) === String(orderSku));
  if (available.length >= o.quantity){
    available.slice(0, o.quantity).forEach(c => { c.status = 'used'; c.order_no = o.order_no; c.used_at = now(); o.cards.push(c.content); });
    o.status = 'delivered';
    o.delivered_at = now();
  } else if (available.length === 0){
    /* ⭐ 无卡密虚拟商品：自动发货，无需卡密 */
    o.status = 'delivered';
    o.delivered_at = now();
    o.cards = ['虚拟商品·自动发货（无需卡密）'];
  } else o.status = 'out_of_stock';
  saveDB(db);
  /* ⭐ 余额支付自动发货：通知店主 */
  try {
    if (o.status === 'delivered' || o.status === 'out_of_stock'){
      var _src = o.source === 'luban' ? '[接码]' : (o.source === 'smm' ? '[推广]' : '[商品]');
      var _st = o.status === 'delivered' ? '✅ 已自动发货' : '⚠️ 缺货待补发';
      yfSendTgNow(_st + ' ' + _src + '\n\n订单号：<code>'+o.order_no+'</code>\n商品：'+o.product_name+(o.sku_name?' · '+o.sku_name:'')+'\n数量：'+o.quantity+'\n金额：¥'+yuan(o.amount_due)+'\n支付：余额抵扣\n会员：'+(o.username||'匿名')+'\n暗号：'+(o.secret||'-'));
    }
  } catch(e){}
}

/* ---------------- USDT 轮询 ---------------- */
let _usdtPollTimer = null;
function startUsdtPolling(orderNo){
  if (_usdtPollTimer) clearInterval(_usdtPollTimer);
  const check = () => {
    fetch('/api/usdt-check?order=' + encodeURIComponent(orderNo))
      .then(r => r.json())
      .then(d => {
        if (d.ok && d.status && d.status !== 'pending'){
          clearInterval(_usdtPollTimer); _usdtPollTimer = null;
          toast('USDT 已到账，系统正在处理 🎉','success');
          /* ⭐ USDT到账直连通知店主 */
          try{ yfSendTgNow('🪙 <b>USDT 已到账</b>\n\n单号：<code>'+orderNo+'</code>\n交易哈希：<code>'+(d.tx||'-')+'</code>\n到账金额：'+(d.amount||'-')+' USDT\n系统正在自动处理（发货/加余额）'); }catch(e){}
          /* ⭐ 自动判断是订单还是充值，分别处理 */
          var _db = loadDB();
          var _r = _db.recharges.filter(function(x){return x.id === orderNo;})[0];
          if (_r && _r.status !== 'success'){ processRecharge(orderNo); }  /* 充值→自动加余额 */
          else { var _o = _db.orders.filter(function(x){return x.order_no === orderNo;})[0]; if (_o && _o.status === 'pending'){ try{payOrder(orderNo);}catch(e){} } }  /* 订单→自动发货 */
          setTimeout(function(){ route(); }, 800);
        }
      }).catch(()=>{});
  };
  check();
  _usdtPollTimer = setInterval(check, 30000);
}
function forceCheckUsdt(orderNo){
  toast('正在检测…');
  fetch('/api/usdt-check?order=' + encodeURIComponent(orderNo))

      if (d.ok && d.status && d.status !== 'pending'){

    }).catch(() => toast('网络错误','error'));
}

function memberRegister(){
  const username = $('#reg-username').value.trim();
  const password = $('#reg-password').value;
  const confirmPwd = $('#reg-confirm').value;
  const secret = $('#reg-secret').value.trim();
  const errEl = $('#reg-err');
  const uErr = validateUsername(username);
  if (uErr){ errEl.textContent = uErr; toast(uErr,'error'); return; }
  const pErr = validatePassword(password);
  if (pErr){ errEl.textContent = pErr; toast(pErr,'error'); return; }
  if (password !== confirmPwd){ errEl.textContent = '两次输入的密码不一致'; toast('两次输入的密码不一致','error'); return; }
  const sErr = validateSecret(secret);
  if (sErr){ errEl.textContent = sErr; toast(sErr,'error'); return; }
  errEl.textContent = '';

  if (findMemberByUsername(db, username)){ errEl.textContent = '该账号已被注册'; toast('该账号已被注册','error'); return; }
  db.members.push({username, password: hashPwd(password), secret, balance: 0, created_at: now()});

  setCurrentUsername(username);
  localStorage.setItem(LS_SECRET, secret);

  route();
}
function memberLogin(){
  const username = $('#login-username').value.trim();
  const password = $('#login-password').value;
  const errEl = $('#login-err');
  if (!username){ errEl.textContent = '请输入账号'; toast('请输入账号','error'); return; }
  if (!password){ errEl.textContent = '请输入密码'; toast('请输入密码','error'); return; }
  const db = loadDB();
  const m = findMemberByUsername(db, username);
  if (!m){ errEl.textContent = '账号不存在'; toast('账号不存在','error'); return; }
  if (m.password !== hashPwd(password)){ errEl.textContent = '密码错误'; toast('密码错误','error'); return; }

  route();
}

function submitRecharge(){
  if (_submitting){ toast('正在处理，请勿重复提交','warn'); return; }
  _submitting = true; setTimeout(function(){_submitting=false;}, 3000);
  const db = loadDB();
  const cfg = getConfig(db);
  const member = getCurrentMember(db);
  if (!member){ toast('请先登录','error'); return; }
  const amount = Math.round(parseFloat($('#rc-amount').value || '0') * 100);
  const min = cfg.recharge_min || 1000;
  if (!(amount >= min)){ toast('最低充值 ' + yuan(min) + ' 元（≈' + usdt(min) + ' USDT）','error'); return; }
  const radio = document.querySelector('input[name="rc-method"]:checked');
  if (!radio){ toast('请选择支付方式','error'); return; }
  const id = genRechargeId();
  const rc = {
    id, username: member.username, secret: member.secret || '',
    amount, method: radio.value, status: 'pending',
    created_at: now(), completed_at: '',
    usdt_rate: usdtRate()   /* ⭐ 汇率快照 */
  };
  if (radio.value === 'alipay') rc.redpacket_code = genRedpacketCode(cfg.pay_alipay_redpacket_prefix);
  db.recharges.unshift(rc);
  saveDB(db);
  showPayModal('recharge', id);
}

function createCategory(){
  const name = $('#nc-name').value.trim();

  db.seq.category++;
  db.categories.push({id: db.seq.category, name});
  saveDB(db);
  toast('分类已添加','success');

}
function editCategory(id){
  const db = loadDB();
  const c = db.categories.filter(x => x.id === id)[0];
  if (!c) return;
  openModal(`<h3>重命名分类</h3>
    <label class="field"><span>分类名称</span><input id="ec-name" value="${esc(c.name)}" maxlength="12"></label>
    <div class="row" style="justify-content:flex-end">

      <button class="btn primary" onclick="saveCategory(${id})">保存</button>
    </div>`);
  const inp = $('#ec-name');
  inp.focus(); inp.select();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') saveCategory(id); });
}
function saveCategory(id){
  const name = $('#ec-name').value.trim();
  if (!name){ toast('分类名称不能为空','error'); return; }
  const db = loadDB();
  if (db.categories.some(c => c.id !== id && c.name === name)){ toast('该分类名已存在','error'); return; }
  const c = db.categories.filter(x => x.id === id)[0];
  if (!c) return;
  c.name = name;
  saveDB(db);
  closeModal();
  toast('已保存','success');
  renderCategories();
}
function moveCategory(id, dir){
  const db = loadDB();
  const i = db.categories.findIndex(c => c.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= db.categories.length) return;
  const tmp = db.categories[i];
  db.categories[i] = db.categories[j];
  db.categories[j] = tmp;
  saveDB(db);
  renderCategories();
}
function deleteCategory(id){
  const db = loadDB();
  const c = db.categories.filter(x => x.id === id)[0];
  if (!c) return;
  const n = db.products.filter(p => String(p.category_id) === String(id)).length;
  const msg = n > 0 ? `分类「${c.name}」下有 ${n} 个商品，删除后这些商品将变为「未分类」。确定删除？` : `确定删除分类「${c.name}」？`;
  if (!confirm(msg)) return;
  db.categories = db.categories.filter(x => x.id !== id);
  db.products.forEach(p => { if (String(p.category_id) === String(id)) p.category_id = 0; });
  saveDB(db);
  toast('分类已删除','success');
  renderCategories();
}

function removeSkuRow(btn){ const row = btn.closest('.sku-row'); if (row) row.remove(); }
function collectSkusFromEditor(){
  const rows = document.querySelectorAll('#sku-rows .sku-row');
  const skus = [];
  const seen = {};
  rows.forEach(r => {
    const name = r.querySelector('.sku-name').value.trim();
    const price = Math.round(parseFloat(r.querySelector('.sku-price').value || '0') * 100);
    if (!name || seen[name]) return;
    seen[name] = true;
    let id = parseInt(r.dataset.skuId);
    if (!id) id = genSkuId();
    r.dataset.skuId = String(id);
    skus.push({id, name, price: price >= 0 ? price : 0});

  return skus;

function createProduct(){
  const name = $('#np-name').value.trim();
  const price = Math.round(parseFloat($('#np-price').value || '0') * 100);
  const skus = collectSkusFromEditor();
  if (!name){ toast('请填写商品名称','error'); return; }
  if (!skus.length && !(price >= 0)){ toast('请填写正确的价格','error'); return; }
  const db = loadDB();
  db.seq.product++;
  db.products.push({
    id: db.seq.product, name,
    price: skus.length ? skus[0].price : price,
    description: $('#np-desc').value.trim(),
    note: $('#np-note').value.trim(),
    category_id: parseInt($('#np-cat').value) || 0,
    active: true, created_at: now(), skus, source: 'local'
  });
  saveDB(db);
  toast(skus.length ? `创建成功，已添加 ${skus.length} 个规格` : '创建成功','success');
  renderProducts();
}
function editProduct(id){

function saveProduct(id){
  const db = loadDB();
  const p = db.products.filter(x => x.id === id)[0];
  if (!p) return;
  const name = $('#ep-name').value.trim();
  if (!name){ toast('商品名称不能为空','error'); return; }
  const skus = collectSkusFromEditor();
  const basePrice = Math.round(parseFloat($('#ep-price').value || '0') * 100);
  p.name = name;
  p.price = skus.length ? skus[0].price : basePrice;
  p.category_id = parseInt($('#ep-cat').value) || 0;
  p.description = $('#ep-desc').value.trim();
  p.note = $('#ep-note').value.trim();
  p.skus = skus;
  p.active = $('#ep-active').value === '1';

function onCardProductChange(){
  const db = loadDB();
  const pid = parseInt($('#ic-pid').value);
  const wrap = $('#ic-sku-wrap');
  if (!wrap) return;
  if (!pid){ wrap.innerHTML = ''; loadCards(); return; }
  const p = db.products.filter(x => x.id === pid)[0];
  if (!p){ wrap.innerHTML = ''; loadCards(); return; }
  const skus = getSkus(p);
  if (!skus.length) wrap.innerHTML = '';
  else wrap.innerHTML = `<label class="field"><span>选择规格（导入的卡密会归到这个规格下）</span>
      <select id="ic-skuid" onchange="loadCards()">
        ${skus.map(s => {
          const cnt = db.cards.filter(c => c.product_id === pid && String(c.sku_id) === String(s.id) && c.status === 'unused').length;
          return `<option value="${s.id}">${esc(s.name)} ${usdt(s.price)} USDT（可用 ${cnt}）</option>`;
        }).join('')}
      </select></label>`;
  loadCards();

function importCards(){
  const db = loadDB();
  const pid = parseInt($('#ic-pid').value);
  const text = $('#ic-text').value;
  if (!pid){ toast('请先创建商品','error'); return; }
  if (!text.trim()){ toast('请输入卡密内容','error'); return; }
  const p = db.products.filter(x => x.id === pid)[0];
  const skus = getSkus(p);
  let skuId = 0;
  if (skus.length){
    const skuEl = $('#ic-skuid');
    if (!skuEl){ toast('请选择规格','error'); return; }
    skuId = parseInt(skuEl.value);
  }
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  const existSet = {};
  db.cards.filter(c => c.product_id === pid && String(c.sku_id || 0) === String(skuId)).forEach(c => { existSet[c.content] = true; });
  let added = 0, skipped = 0;
  lines.forEach(line => {
    if (existSet[line]){ skipped++; return; }
    existSet[line] = true;
    db.seq.card++;
    db.cards.push({id: db.seq.card, product_id: pid, sku_id: skuId, content: line, status: 'unused', order_no: '', used_at: '', created_at: now()});
    added++;
  });
  saveDB(db);
  $('#ic-text').value = '';
  toast(`成功导入 ${added} 条` + (skipped ? `，跳过重复 ${skipped} 条` : ''),'success');
  renderCards();
}
function loadCards(){
  const db = loadDB();
  const pidEl = $('#ic-pid');
  const box = $('#cards-list');
  if (!pidEl || !box) return;
  const pid = parseInt(pidEl.value);
  const filter = $('#ic-filter').value;
  if (!pid){ box.innerHTML = '<div class="empty">请先创建商品</div>'; return; }
  const p = db.products.filter(x => x.id === pid)[0];
  let list = db.cards.filter(c => c.product_id === pid);
  if (p && hasSkus(p)){
    const skuEl = $('#ic-skuid');
    if (skuEl){
      const sid = parseInt(skuEl.value);
      list = list.filter(c => String(c.sku_id || 0) === String(sid));
    }
  }
  if (filter !== 'all') list = list.filter(c => c.status === filter);
  if (!list.length){ box.innerHTML = '<div class="empty">暂无卡密</div>'; return; }
  box.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>卡密</th><th>状态</th><th>关联订单</th><th>时间</th><th></th></tr></thead>
    <tbody>${list.map(c => `<tr>
      <td class="mono">${esc(c.content)}</td>
      <td><span class="badge ${c.status === 'unused' ? 'ok' : 'gray'}">${c.status === 'unused' ? '未使用' : '已售出'}</span></td>
      <td class="mono muted" style="font-size:12px">${esc(c.order_no || '-')}</td>
      <td class="muted" style="font-size:12px">${esc(c.used_at || c.created_at)}</td>
      <td style="text-align:right">${c.status === 'unused' ? `<button class="btn sm danger" onclick="deleteCard(${c.id})">删除</button>` : ''}</td>
    </tr>`).join('')}</tbody></table></div>`;
}
function deleteCard(id){
  if (!confirm('确定删除这条卡密？')) return;

  db.cards = db.cards.filter(c => c.id !== id);
  saveDB(db);

  loadCards();
}

function deleteOrder(orderNo){
  const db = loadDB();
  const o = db.orders.filter(x => x.order_no === orderNo)[0];
  if (!o){ toast('订单不存在','error'); return; }
  const status = STATUS_TEXT[o.status] || o.status;
  if (!confirm(`确定删除订单「${orderNo}」？\n\n状态：${status}\n金额：¥${yuan(o.amount)}\n\n删除后不可恢复。`)) return;
  db.orders = db.orders.filter(x => x.order_no !== orderNo);
  saveDB(db);
  toast('订单已删除','success');
  renderOrders();
}
function clearCompletedOrders(){
  const db = loadDB();
  const done = db.orders.filter(o => o.status === 'delivered' || o.status === 'rejected');
  if (!done.length){ toast('没有可清理的订单','error'); return; }
  if (!confirm(`确定批量删除 ${done.length} 条「已发货/已驳回」订单？\n\n待支付、待审核、接码中的订单会保留。\n删除后不可恢复。`)) return;
  db.orders = db.orders.filter(o => o.status !== 'delivered' && o.status !== 'rejected');
  saveDB(db);
  toast(`已清理 ${done.length} 条订单`,'success');
  renderOrders();
}
function redeliver(orderNo){
  const db = loadDB();
  const o = db.orders.filter(x => x.order_no === orderNo)[0];
  if (!o){ toast('订单不存在','error'); return; }
  const need = o.quantity - o.cards.length;
  const orderSku = o.sku_id || 0;
  const available = db.cards.filter(c => c.product_id === o.product_id && c.status === 'unused' && String(c.sku_id || 0) === String(orderSku));
  if (available.length < need){ toast(`该规格库存仍不足，还需 ${need - available.length} 条`,'error'); return; }
  available.slice(0, need).forEach(c => { c.status = 'used'; c.order_no = o.order_no; c.used_at = now(); o.cards.push(c.content); });
  o.status = 'delivered';
  o.delivered_at = now();
  saveDB(db);
  toast('补发成功','success');
  renderOrders();
}
function viewOrderCards(orderNo){

function lubanSyncServices(){
  const countryEl = $('#luban-filter-country');
  const serviceEl = $('#luban-filter-service');
  const country = countryEl ? countryEl.value.trim() : '';
  const service = serviceEl ? serviceEl.value.trim() : '';
  try { localStorage.setItem('luban_filters', JSON.stringify({country, service})); } catch(e){}

  let tip = '将从 LubanSms 拉取';
  if (country) tip += `【${country}】`;
  if (service) tip += `【${service}】`;
  tip += ' 的【全部】服务（自动翻页直到拉完），加价 30% 上架。继续？';
  if (!confirm(tip)) return;
  toast('开始拉取，正在自动翻页…');

  const allServices = [];
  let page = 1;
  const MAX_PAGES = 999;
  let emptyStreak = 0;

  function fetchPage(){
    let url = `/api/luban?action=services&language=zh&page=${page}`;
    if (country) url += '&countryName=' + encodeURIComponent(country);
    if (service) url += '&service=' + encodeURIComponent(service);
    return fetch(url)
      .then(r => r.json())
      .then(d => {
        if (d.code !== 0) throw new Error(d.msg || 'LubanSms 拉取失败');
        const list = Array.isArray(d.msg) ? d.msg : [];
        if (page > 1) toast(`已拉取 ${page - 1} 页，共 ${allServices.length} 个服务…`, 'info');
        if (list.length > 0){
          allServices.push(...list);
          emptyStreak = 0;
          page++;
          if (page > MAX_PAGES) return null;
          return new Promise(resolve => setTimeout(() => resolve(fetchPage()), 150));
        }
        emptyStreak++;
        if (emptyStreak >= 2) return null;
        page++;
        return new Promise(resolve => setTimeout(() => resolve(fetchPage()), 300));
      });
  }

  fetchPage().then(() => {
    if (!allServices.length){ toast('没有找到匹配的服务，试试换个关键词或国家','error'); return; }
    const seenIds = {};
    const uniqueServices = [];
    allServices.forEach(s => {
      const key = String(s.service_id);
      if (seenIds[key]) return;
      seenIds[key] = true;
      uniqueServices.push(s);
    });
    const db = loadDB();
    let added = 0, updated = 0;
    uniqueServices.forEach(s => {
      let origin = parseFloat(s.origin_cost);
      if (isNaN(origin)) origin = (parseFloat(s.cost) || 0) / 1.3;
      const ourPriceFen = Math.round(origin * 7.2 * 100);
      const exist = db.products.find(p => p.source === 'luban' && p.luban_service_id === String(s.service_id));
      if (exist){
        exist.price = ourPriceFen;
        exist.luban_origin_cost = origin.toFixed(2);
        exist.name = `[接码] ${s.service_name} · ${s.country_name_zh || s.country_name_en || ''}`;
        updated++;
      } else {
        db.seq.product++;
        db.products.push({
          id: db.seq.product,
          name: `[接码] ${s.service_name} · ${s.country_name_zh || s.country_name_en || ''}`,
          price: ourPriceFen,
          description: `国家：${s.country_name_zh || s.country_name_en || ''} ｜ 服务：${s.service_name} ｜ 下单后自动分配号码`,
          note: '请在 20 分钟内完成目标平台注册，超时号码将自动释放',
          category_id: 0, active: true, created_at: now(), skus: [],
          source: 'luban', luban_type: 'sms',
          luban_service_id: String(s.service_id),
          luban_service_name: s.service_name,
          luban_country: s.country_name_zh || s.country_name_en || '',
          luban_origin_cost: origin.toFixed(2)
        });
        added++;
      }
    });
    saveDB(db);
    toast(`拉取完成！共 ${uniqueServices.length} 个服务，新增 ${added} 个，更新 ${updated} 个`,'success');
    renderLuban();
  }).catch(e => {
    if (allServices.length > 0){
      const db = loadDB();
      const seenIds = {};
      const uniqueServices = [];
      allServices.forEach(s => {
        const key = String(s.service_id);
        if (seenIds[key]) return;
        seenIds[key] = true;
        uniqueServices.push(s);
      });
      let added = 0;
      uniqueServices.forEach(s => {
        let origin = parseFloat(s.origin_cost);
        if (isNaN(origin)) origin = (parseFloat(s.cost) || 0) / 1.3;
        const ourPriceFen = Math.round(origin * 7.2 * 100);
        const exist = db.products.find(p => p.source === 'luban' && p.luban_service_id === String(s.service_id));
        if (!exist){
          db.seq.product++;
          db.products.push({
            id: db.seq.product,
            name: `[接码] ${s.service_name} · ${s.country_name_zh || s.country_name_en || ''}`,
            price: ourPriceFen,
            description: `国家：${s.country_name_zh || s.country_name_en || ''} ｜ 服务：${s.service_name}`,
            note: '请在 20 分钟内完成目标平台注册，超时号码将自动释放',
            category_id: 0, active: true, created_at: now(), skus: [],
            source: 'luban', luban_type: 'sms',
            luban_service_id: String(s.service_id),
            luban_service_name: s.service_name,
            luban_country: s.country_name_zh || s.country_name_en || '',
            luban_origin_cost: origin.toFixed(2)
          });
          added++;
        }
      });
      saveDB(db);
      toast(`翻页中断，但已保存 ${added} 个服务：${e.message}`,'error');
      renderLuban();
    } else toast('同步失败：' + e.message,'error');
  });
}

/* ---------- 接码会话核心逻辑 ---------- */
function lubanStartSession(orderNo){
  const db = loadDB();
  const o = db.orders.find(x => x.order_no === orderNo);
  if (!o) return;
  o.status = 'waiting_sms';
  o.luban_started_at = Date.now();
  o.luban_deadline = Date.now() + 20 * 60 * 1000;
  saveDB(db);

  fetch(`/api/luban?action=request_number&service_id=${encodeURIComponent(o.luban_service_id)}`)
    .then(r => r.json())
    .then(d => {
      const db2 = loadDB();
      const o2 = db2.orders.find(x => x.order_no === orderNo);
      if (!o2) return;
      if (d.code === 0 && d.number){
        o2.luban_number = d.number;
        o2.luban_request_id = String(d.request_id);
        o2.luban_stage = 'waiting';
        saveDB(db2);
        toast(`号码已分配：${d.number}`,'success');
        lubanPollSms(orderNo, 0);
      } else {
        o2.status = 'luban_error';
        o2.luban_error = d.msg || '请求号码失败';
        saveDB(db2);
        toast('请求号码失败：' + (d.msg || ''),'error');
      }
      if (location.hash.indexOf('/order/' + orderNo) >= 0) route();
    })
    .catch(e => {
      const db2 = loadDB();
      const o2 = db2.orders.find(x => x.order_no === orderNo);
      if (o2){ o2.status = 'luban_error'; o2.luban_error = '网络错误：' + e.message; saveDB(db2); }
      toast('网络错误：' + e.message,'error');
      if (location.hash.indexOf('/order/' + orderNo) >= 0) route();
    });
}
function lubanPollSms(orderNo, attempt){
  const db = loadDB();
  const o = db.orders.find(x => x.order_no === orderNo);
  if (!o || !o.luban_request_id) return;
  if (o.status !== 'waiting_sms') return;
  if (o.luban_deadline && Date.now() > o.luban_deadline){ lubanAutoRelease(orderNo, '接码超时（20分钟）'); return; }
  if (attempt > 240) return;

  fetch(`/api/luban?action=get_sms&request_id=${encodeURIComponent(o.luban_request_id)}`)
    .then(r => r.json())
    .then(d => {
      if (d.code === 0 && d.msg === 'success' && d.sms_code){
        const db2 = loadDB();
        const o2 = db2.orders.find(x => x.order_no === orderNo);
        if (!o2) return;
        o2.luban_code = d.sms_code;
        o2.luban_stage = 'received';
        o2.status = 'delivered';
        o2.delivered_at = now();
        saveDB(db2);
        toast(`🎉 收到验证码：${d.sms_code}`,'success');
        if (location.hash.indexOf('/order/' + orderNo) >= 0) route();
        return;
      }
      setTimeout(() => lubanPollSms(orderNo, attempt + 1), 5000);
    })
    .catch(() => setTimeout(() => lubanPollSms(orderNo, attempt + 1), 5000));
}
function lubanStartCommon(orderNo, params){
  const db = loadDB();
  const o = db.orders.find(x => x.order_no === orderNo);
  if (!o) return;
  o.status = 'waiting_sms';
  o.luban_type = 'common';
  o.luban_started_at = Date.now();
  o.luban_deadline = Date.now() + 20 * 60 * 1000;
  saveDB(db);

  let url = '/api/luban?action=common_request';
  if (params && typeof params === 'object'){
    Object.keys(params).forEach(k => { if (params[k]) url += `&${k}=${encodeURIComponent(params[k])}`; });
  }
  fetch(url)
    .then(r => r.json())
    .then(d => {
      const db2 = loadDB();
      const o2 = db2.orders.find(x => x.order_no === orderNo);
      if (!o2) return;
      if (d.code === 0 && d.phone){
        o2.luban_number = d.phone;
        o2.luban_stage = 'waiting';
        saveDB(db2);
        toast(`号码已分配：${d.phone}`,'success');
        lubanCommonPoll(orderNo, 0);
      } else {
        o2.status = 'luban_error';
        o2.luban_error = d.msg || '请求号码失败';
        saveDB(db2);
        toast('请求号码失败：' + (d.msg || ''),'error');
      }
      if (location.hash.indexOf('/order/' + orderNo) >= 0) route();
    })
    .catch(e => toast('网络错误：' + e.message,'error'));
}
function lubanCommonPoll(orderNo, attempt){
  const db = loadDB();
  const o = db.orders.find(x => x.order_no === orderNo);
  if (!o || !o.luban_number) return;
  if (o.status !== 'waiting_sms') return;
  if (o.luban_deadline && Date.now() > o.luban_deadline){ lubanAutoRelease(orderNo, '接码超时（20分钟）'); return; }
  if (attempt > 240) return;

  const url = `/api/luban?action=common_get_sms&phone=${encodeURIComponent(o.luban_number)}&keyword=${encodeURIComponent(o.luban_keyword || '')}`;
  fetch(url)
    .then(r => r.json())
    .then(d => {
      if (d.code === 0 && d.msg && String(d.msg).length > 5 && d.msg !== 'wait'){
        const db2 = loadDB();
        const o2 = db2.orders.find(x => x.order_no === orderNo);
        if (!o2) return;
        o2.luban_code = String(d.msg);
        o2.luban_stage = 'received';
        o2.status = 'delivered';
        o2.delivered_at = now();
        saveDB(db2);
        toast('🎉 收到短信！','success');
        if (location.hash.indexOf('/order/' + orderNo) >= 0) route();
        return;
      }
      setTimeout(() => lubanCommonPoll(orderNo, attempt + 1), 5000);
    })
    .catch(() => setTimeout(() => lubanCommonPoll(orderNo, attempt + 1), 5000));
}
function lubanAutoRelease(orderNo, reason){
  const db = loadDB();
  const o = db.orders.find(x => x.order_no === orderNo);
  if (!o) return;
  o.status = 'rejected';
  o.luban_error = reason;
  o.luban_released_at = now();
  saveDB(db);
  toast('接码超时，号码已自动释放','error');
  if (location.hash.indexOf('/order/' + orderNo) >= 0) route();
}
function lubanRelease(orderNo){
  const db = loadDB();
  const o = db.orders.find(x => x.order_no === orderNo);
  if (!o) return;
  if (!confirm('确定释放号码？释放后无法再接收短信。')) return;
  const url = o.luban_type === 'common'
    ? `/api/luban?action=common_release&phone=${encodeURIComponent(o.luban_number)}`
    : `/api/luban?action=change_status&request_id=${encodeURIComponent(o.luban_request_id)}&status=reject`;
  fetch(url)
    .then(r => r.json())
    .then(() => {
      const db2 = loadDB();
      const o2 = db2.orders.find(x => x.order_no === orderNo);
      if (!o2) return;
      o2.status = 'rejected';
      o2.luban_released_at = now();
      o2.luban_error = '客户主动释放';
      saveDB(db2);
      toast('号码已释放','success');
      if (location.hash.indexOf('/order/' + orderNo) >= 0) route();
    })
    .catch(e => toast('网络错误：' + e.message,'error'));
}

function lubanClientSearch(page){
  const country = ($('#luban-c-country') && $('#luban-c-country').value) || '';
  const serviceRaw = ($('#luban-c-service') && $('#luban-c-service').value.trim()) || '';

  if (page !== 1){ loadLubanPage(country, serviceRaw, page); return; }

  _lubanResults = [];
  $('#luban-c-results').innerHTML = '<div class="loading">正在搜索…</div>';
  $('#luban-c-loadmore').innerHTML = '';
  $('#luban-c-count').textContent = '';

  const tryList = [serviceRaw];
  const lower = serviceRaw.toLowerCase();
  if (LUBAN_SERVICE_ALIAS[lower]) tryList.push(LUBAN_SERVICE_ALIAS[lower]);
  else if (LUBAN_SERVICE_ALIAS[serviceRaw]) tryList.push(LUBAN_SERVICE_ALIAS[serviceRaw]);
  const seen = {};
  const finalTry = [];
  tryList.forEach(w => { if (w && !seen[w]){ seen[w] = true; finalTry.push(w); } });

  function tryNext(idx){
    if (idx >= finalTry.length){ finishSearch(serviceRaw, finalTry); return; }
    const kw = finalTry[idx];
    let url = `/api/luban?action=client_services&language=zh&page=1`;
    if (country) url += '&countryName=' + encodeURIComponent(country);
    if (kw) url += '&service=' + encodeURIComponent(kw);
    fetch(url)
      .then(r => r.json())
      .then(d => {
        if (d.code === 0 && Array.isArray(d.msg) && d.msg.length > 0){
          const existSet = {};
          _lubanResults.forEach(x => { existSet[String(x.service_id)] = true; });
          d.msg.forEach(x => {
            const sid = String(x.service_id);
            if (!existSet[sid]){ existSet[sid] = true; _lubanResults.push(x); }
          });
        }
        tryNext(idx + 1);
      })
      .catch(() => tryNext(idx + 1));
  }
  tryNext(0);
}

function loadLubanPage(country, service, page){
  $('#luban-c-loadmore').innerHTML = '<div class="loading">加载中…</div>';
  let url = `/api/luban?action=client_services&language=zh&page=${page}`;
  if (country) url += '&countryName=' + encodeURIComponent(country);
  if (service) url += '&service=' + encodeURIComponent(service);
  fetch(url)
    .then(r => r.json())
    .then(d => {
      if (d.code !== 0){ $('#luban-c-loadmore').innerHTML = ''; return; }
      const list = Array.isArray(d.msg) ? d.msg : [];
      if (list.length === 0){ $('#luban-c-loadmore').innerHTML = '<div class="muted" style="font-size:12px">已显示全部结果</div>'; return; }
      const existSet = {};
      _lubanResults.forEach(x => { existSet[String(x.service_id)] = true; });
      list.forEach(x => {
        const sid = String(x.service_id);
        if (!existSet[sid]){ existSet[sid] = true; _lubanResults.push(x); }
      });
      renderLubanResults();
      $('#luban-c-count').textContent = `共 ${_lubanResults.length} 个`;
      if (list.length >= 15){
        $('#luban-c-loadmore').innerHTML = `<button class="btn ghost" onclick="loadLubanPage('${esc(country)}','${esc(service)}',${page + 1})">加载更多</button>`;
      } else $('#luban-c-loadmore').innerHTML = '<div class="muted" style="font-size:12px">已显示全部结果</div>';
    })
    .catch(() => { $('#luban-c-loadmore').innerHTML = ''; });
}

function finishSearch(serviceRaw, tryList){
  if (_lubanResults.length === 0){
    const hint = (serviceRaw && tryList.length > 1) ? `（已尝试用「${tryList.join('」「')}」搜索）` : '';
    $('#luban-c-results').innerHTML = `<div class="empty">没有找到匹配的服务 ${hint}</div>`;
    $('#luban-c-count').textContent = '';
    $('#luban-c-loadmore').innerHTML = '';
    return;
  }
  renderLubanResults();
  $('#luban-c-count').textContent = `共 ${_lubanResults.length} 个`;
  if (_lubanResults.length >= 15 && tryList.length === 1 && tryList[0]){
    const country = ($('#luban-c-country') && $('#luban-c-country').value) || '';
    $('#luban-c-loadmore').innerHTML = `<button class="btn ghost" onclick="loadLubanPage('${esc(country)}','${esc(tryList[0])}',2)">加载更多</button>`;
  } else {
    $('#luban-c-loadmore').innerHTML = '<div class="muted" style="font-size:12px">已显示全部结果</div>';
  }
}

function renderLubanPayBox(priceFen){

        html += '<div class="balance-row" style="background:#f1f5f9;border-color:#cbd5e1;color:#475569"><div class="lbl" style="color:#475569">💎 会员余额为 0，充值后可用余额支付</div><a href="#/member" onclick="closeModal()" style="font-size:13px;color:#6366f1;font-weight:600">去充值 →</a></div>';
      }
    } else {
      html += '<div class="balance-row" style="background:#f1f5f9;border-color:#cbd5e1;color:#475569"><div class="lbl" style="color:#475569">💎 登录会员可用余额抵扣，享便捷支付</div><a href="#/member" onclick="closeModal()" style="font-size:13px;color:#6366f1;font-weight:600">去登录 / 注册 →</a></div>';

    html += `<label class="field"><span>支付方式</span>
      <div class="pay-methods" id="luban-pay-methods">
        ${usdtEnabled ? '<label class="' + usdtClass + '" data-method="usdt"><input type="radio" name="luban-pay" value="usdt"' + usdtChecked + '><span class="logo">🪙</span> USDT</label>' : ''}
        ${alipayEnabled ? `<label class="${alipayClass}" data-method="alipay"><input type="radio" name="luban-pay" value="alipay"${alipayChecked}><span class="logo">💰</span> 支付宝</label>` : ''}
        ${(member && (member.balance||0) > 0) ? '<label class="pay-method" data-method="balance"><input type="radio" name="luban-pay" value="balance"><span class="logo">💎</span> 余额支付(' + usdt(member.balance) + ')</label>' : ''}

      document.querySelectorAll('#luban-pay-methods .pay-method').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      const r = el.querySelector('input[type=radio]'); if (r) r.checked = true;
      renderLubanPayBox(priceFen);
    });
  });

function lubanSubmitClientBuy(serviceId){
  const svc = _lubanResults.find(x => String(x.service_id) === String(serviceId));
  if (!svc){ toast('服务不存在','error'); return; }
  const priceFen = svc.price_cny || 0;
  const secret = $('#luban-buy-secret').value.trim();
  const sErr = validateSecret(secret);
  if (sErr){ toast(sErr,'error'); return; }
  const db = loadDB();
  const cfg = getConfig(db);
  const member = getCurrentMember(db);
  const balanceEnabled = cfg.balance_enabled !== false;
  const cb = $('#luban-use-balance');
  const useBalance = cb && cb.checked && balanceEnabled && member;
  let deduct = useBalance ? Math.min(member ? (member.balance || 0) : 0, priceFen) : 0;
  /* ⭐ 纯余额支付 radio 选中：全额扣余额（覆盖部分抵扣） */
  var _payRadio = document.querySelector('input[name="luban-pay"]:checked');
  if (_payRadio && _payRadio.value === 'balance'){
    if (!member){ toast('请先登录会员','error'); return; }
    if ((member.balance||0) < priceFen){ toast('余额不足，请充值或换其他支付方式','error'); return; }
    deduct = priceFen;
  }
  const due = priceFen - deduct;
  let payMethod = 'balance';
  if (due > 0){
    const radio = document.querySelector('input[name="luban-pay"]:checked');
    if (!radio){ toast('请选择支付方式','error'); return; }
    payMethod = radio.value;
  }
  if (deduct > 0){
    if (!deductBalance(db, member.username, deduct)){ toast('余额扣除失败','error'); return; }
  }
  const orderNo = genOrderNo();
  const order = {
    order_no: orderNo, product_id: 0,
    product_name: `[接码] ${svc.service_name} · ${svc.country_name_zh || svc.country_name_en || ''}`,
    sku_id: 0, sku_name: '', category_id: 0, quantity: 1,
    amount: priceFen, balance_used: deduct, amount_due: due,
    secret, username: member ? member.username : '',
    status: 'pending', pay_method: payMethod, cards: [],
    note: '请在 20 分钟内完成目标平台注册，超时号码将自动释放',
    created_at: now(), delivered_at: '',
    source: 'luban', luban_type: 'sms',
    luban_service_id: String(svc.service_id),
    luban_service_name: svc.service_name,
    luban_country: svc.country_name_zh || svc.country_name_en || '',
    usdt_rate: usdtRate()   /* ⭐ 汇率快照 */
  };
  if (payMethod === 'alipay') order.redpacket_code = genRedpacketCode(cfg.pay_alipay_redpacket_prefix);
  db.orders.unshift(order);
  saveDB(db);
  saveMyOrder(orderNo, secret);
  localStorage.setItem(LS_SECRET, secret);
  closeModal();
  if (due === 0){
    payOrder(orderNo);
    toast('支付成功，正在分配号码…','success');
    if (location.hash === '#/order/' + orderNo) route();
    else location.hash = '#/order/' + orderNo;
  } else showPayModal('order', orderNo);
}

     多设备同步模块（独立）
     ================================================================== -->
<script>
(function(){
  var API = '/api/state';
  var rev = 0;
  var _saveDB = window.saveDB;
  var _loadDB = window.loadDB;

  /* ⭐ 立即就绪，先用本地数据渲染，不卡"正在同步数据" */
  window.__ready = true;
  if (window.route) window.route();

  /* 保存时推送到服务器 */
  window.saveDB = function(db){
    _saveDB(db);
    fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({db:db, baseRev:rev})})
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.ok) rev = d.rev; })
      .catch(function(e){ console.warn('push fail', e); });
  };

  /* 拉取服务器最新数据 */
  function pull(){
    fetch(API + '?t=' + Date.now(), {headers:{'Content-Type':'application/json'}})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok || !d.db) return;
        if (d.rev !== rev){
          rev = d.rev;
          var local = _loadDB() || {};
          var srv = d.db;
          /* ⭐ 防数据丢失：服务器订单/会员/卡密/分类全空但本地有，用本地恢复服务器，不覆盖本地 */
          var srvEmpty = (!srv.orders||srv.orders.length===0) && (!srv.members||srv.members.length===0) && (!srv.cards||srv.cards.length===0) && (!srv.categories||srv.categories.length===0);
          var localHas = (local.orders&&local.orders.length>0) || (local.members&&local.members.length>0) || (local.cards&&local.cards.length>0) || (local.categories&&local.categories.length>0);
          if (srvEmpty && localHas){ window.saveDB(local); return; }
          try { _saveDB(srv); } catch(e){}
          if (window.applySiteConfig) window.applySiteConfig();
          var ae = document.activeElement;
          if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;  /* ⭐ 用户正在输入时不重渲染，避免打断 */
          if (window.route) window.route();
        }
      })
      .catch(function(e){ console.warn('pull fail', e); });
  }

  pull();
  setInterval(pull, 4000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) pull(); });
  window.addEventListener('online', pull);
})();
</script>

<script>
(function(){
  var DEFAULT_SUB = '选择国家和平台，实时接码，全自动发货';
  function loadCloud(cb){
    fetch('/api/sms-config?t=' + Date.now())
      .then(r => r.json())
      .then(d => {
        if (d && d.sub){
          localStorage.setItem('yf_sms_config', JSON.stringify(d));
          if (cb) cb(d);
        }
      }).catch(() => console.warn('云端拉取失败，使用本地缓存'));
  }
  function saveCloud(sub, luban){
    var payload = { sub, luban };
    localStorage.setItem('yf_sms_config', JSON.stringify(payload));
    fetch('/api/sms-config', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    }).then(r => r.json()).then(d => {
      if (d.success) alert('✅ 设置已保存，多设备同步成功！');
      else alert('❌ 保存失败：' + (d.error || '未知错误'));

  function applyCfg(){

        var tab = tabs[j];

          tab.style.display = cfg.luban ? '' : 'none';
          if (!cfg.luban && (tab.style.backgroundColor === 'rgb(99, 102, 241)' || tab.classList.contains('active'))){
            for (var k = 0; k < tabs.length; k++){

            }

    }
  }
  function injectPanel(){

    var allEls = document.querySelectorAll('div, section');
    var target = null;
    for (var i = 0; i < allEls.length; i++){

    if (!panel){
      panel = document.createElement('div');
      panel.id = 'yf-sms-config-panel';
      target.appendChild(panel);
    }
    if (panel.getAttribute('data-cloud') === 'true') return;
    panel.innerHTML = '';
    panel.setAttribute('data-cloud', 'true');
    var cfgStr = localStorage.getItem('yf_sms_config');
    var cfg = cfgStr ? JSON.parse(cfgStr) : { sub: DEFAULT_SUB, luban: true };
    panel.style.cssText = 'margin-top:20px;padding:16px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.05);';
    panel.insertAdjacentHTML('beforeend', `
      <h3 style="margin:0 0 12px 0;font-size:15px;font-weight:600;display:flex;align-items:center;">☁️ 云端同步设置（多设备生效）</h3>
      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:13px;color:#666;margin-bottom:6px;">全球接码副标题：</label>
        <input id="yf-c-sub" type="text" style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:13px;" value="${cfg.sub.replace(/"/g, '&quot;')}">
      </div>
      <div style="margin-bottom:16px;">
        <label style="display:flex;align-items:center;font-size:13px;color:#666;cursor:pointer;">
          <input id="yf-c-luban" type="checkbox" style="margin-right:8px;width:16px;height:16px;" ${cfg.luban ? 'checked' : ''}> 启用 LubanSms 接码插件
        </label>
      </div>
      <button id="yf-c-save" style="padding:10px 20px;background:#6366f1;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;width:100%;">保存并同步到云端</button>
    `);
    document.getElementById('yf-c-save').onclick = function(){
      var subVal = document.getElementById('yf-c-sub').value.trim() || DEFAULT_SUB;
      var lubanVal = document.getElementById('yf-c-luban').checked;
      saveCloud(subVal, lubanVal);
    };
  }
  setInterval(function(){ applyCfg(); injectPanel(); }, 5000);
  loadCloud(function(){ applyCfg(); injectPanel(); });
  setInterval(function(){ loadCloud(); }, 30000);
})();

<script>

    var changed = false;
    if (db.config.smm_markup === undefined){ db.config.smm_markup = 1.5; changed = true; }
    /* smm_usd_cny 已废弃，统一使用后台 pay_usdt_rate（USDT汇率）联动换算 */
    /* ===== 自动重算旧SMM商品价格（USDT结算单位） ===== */
    var rate = usdtRate();
    var markup = Number(db.config.smm_markup) || 1.5;
    var recalc = 0;
    db.products.forEach(function(p){
      if (p.source === 'smm' && p.smm_rate_usd){
        var expect = (p.smm_custom_price > 0) ? p.smm_custom_price : Math.max(1, Math.round(parseFloat(p.smm_rate_usd) * markup * 100));
        if (p.smm_price_ver !== 2 || p.price !== expect){
          p.price = expect;
          p.smm_price_ver = 2;
          recalc++;
        }
      }
    });
    if (recalc > 0){ changed = true; console.log('[SMM] 自动重算 ' + recalc + ' 个商品价格为USDT结算'); }
    if (changed) saveDB(db);
    try { fetch('/api/smm-store').then(function(r){return r.json();}).then(function(d){
      if(d&&d.ok&&d.products&&d.products.length){ var db2=loadDB(); var eid={};
        d.products.forEach(function(p){eid[p.smm_service_id]=p;});
        db2.products=db2.products.filter(function(p){return p.source!=='smm'||!eid[p.smm_service_id];});

  })();

  /* 后端调用 */
  function smmApi(action, payload){
    return fetch('/api/smm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ action: action }, payload || {}))
    }).then(function(r){ return r.json(); });
  }

  /* 判断是否为套餐类型（Package 或 min=max=1），套餐价格为总价而非每1000个单价 */
  function smmIsPackage(p){
    if (!p) return false;
    if (p.smm_type === 'Package') return true;
    var mn = parseInt(p.smm_min), mx = parseInt(p.smm_max);
    return (mn === 1 && mx === 1);

  window.smmSaveCfg = function(){
    var markup = parseFloat($('#smm-markup').value);
    if (!markup || markup < 1){ toast('加价倍数至少为 1','error'); return; }
    var rate = usdtRate();  /* 统一使用后台 USDT→CNY 汇率 */
    var db = loadDB();
    db.config.smm_markup = markup;
    var count = 0;
    db.products.forEach(function(p){
      if (p.source === 'smm' && p.smm_rate_usd){
        /* USDT售价 = USD成本 × 加价倍数；人民币分 = USDT售价 × 汇率 × 100；自定义价优先 */
        p.price = (p.smm_custom_price > 0) ? p.smm_custom_price : Math.max(1, Math.round(parseFloat(p.smm_rate_usd) * markup * 100));
        p.smm_price_ver = 2;
        count++;
      }
    });
    saveDB(db);
    toast('已保存，重算了 ' + count + ' 个商品（上游人民币计价，USDT显示=售价÷汇率' + rate + '）','success');
    renderSmmTab();
  };
