<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>云发卡 · 自动发货</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e8eaf0;--primary:#6366f1;--primary2:#8b5cf6;--danger:#ef4444;--ok:#10b981;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -8px rgba(16,24,40,.12);--tg-btn-color:#0088cc;--tg-btn-shadow:rgba(0,136,204,.6)}
*{box-sizing:border-box}html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;touch-action:pan-y;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}button{font-family:inherit}
.nav{position:-webkit-sticky;position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:inline-block;flex-shrink:0}
.nav nav{display:flex;gap:6px;align-items:center}
.nav nav a{padding:8px 14px;border-radius:10px;font-size:14px;color:var(--muted);transition:.15s;white-space:nowrap}
.nav nav a:hover{background:#f0f1f6;color:var(--text)}
.tg-btn{display:inline-flex!important;align-items:center;gap:5px;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;color:#fff!important;background:var(--tg-btn-color);box-shadow:0 4px 12px -4px var(--tg-btn-shadow);transition:.18s}
.tg-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.tg-btn svg{width:16px;height:16px;fill:#fff}
.tg-float{position:fixed;right:20px;bottom:24px;width:54px;height:54px;border-radius:50%;background:var(--tg-btn-color);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -6px var(--tg-btn-shadow);z-index:150;transition:.2s}
.tg-float:hover{transform:scale(1.08) translateY(-2px)}
.tg-float svg{width:26px;height:26px;fill:#fff}
.tg-float::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--tg-btn-color);opacity:.35;animation:pulse 2.2s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
main{max-width:1080px;margin:0 auto;padding:24px 20px 90px;min-height:80vh}
.btn{border:0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;background:#eef0f6;color:var(--text)}
.btn:hover{filter:brightness(.97)}.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 14px -4px rgba(99,102,241,.6)}
.btn.danger{background:#fee2e2;color:#b91c1c}.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}.btn.block{display:block;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;outline:none;transition:.15s;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
input[type=checkbox]{width:auto;accent-color:var(--primary)}
label.field{display:block;margin-bottom:14px}
label.field > span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}.hidden{display:none!important}
.hero{background:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#a855f7);border-radius:20px;padding:34px 30px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden}
.hero h1{margin:0 0 8px;font-size:26px;letter-spacing:.5px}.hero p{margin:0;opacity:.92;font-size:14px}
.hero .blob{position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.14);right:-70px;top:-90px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;max-width:100%}
.cat-tab{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-align:center}
.cat-tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;font-family:inherit;white-space:nowrap;line-height:1.4}
.cat-tab:hover{border-color:#c7cbe0;color:var(--text)}
.cat-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;box-shadow:0 4px 12px -4px rgba(99,102,241,.55)}
.cat-tab .n{opacity:.65;font-weight:500;margin-left:5px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:100%}
.product{padding:20px;display:flex;flex-direction:column;gap:12px;transition:.18s}
.product:hover{transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(16,24,40,.22)}
.p-name{font-size:16px;font-weight:700}
.p-desc{font-size:13px;color:var(--muted);line-height:1.6;min-height:21px}
.p-price{font-size:22px;font-weight:800;color:#e11d48}.p-price small{font-size:13px;font-weight:600}
.p-price .from{font-size:12px;font-weight:600;color:#6b7280;margin-left:2px}
.sku-tags{display:flex;flex-wrap:wrap;gap:4px}
.sku-tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f5f3ff;color:#6366f1;font-weight:600}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.badge.ok{background:#dcfce7;color:#15803d}.badge.no{background:#fee2e2;color:#b91c1c}
.badge.gray{background:#eef0f6;color:#6b7280}.badge.cat{background:#eef2ff;color:#4f46e5}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.src{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.badge.src-luban{background:#fef3c7;color:#b45309;border:1px solid #fcd34d}
.pay-methods{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:10px;max-width:320px;margin:0 auto}
.pay-method{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 10px;border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:.2s;background:#fff;font-weight:600;font-size:14px;user-select:none;-webkit-user-select:none;text-align:center;min-height:56px}
.pay-method input[type="radio"]{display:none;}
.pay-method::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid #cbd5e1;display:inline-block;flex-shrink:0;transition:.2s;}
.pay-method.active::before{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 3px #fff;}
.pay-method.active{border-color:var(--primary);background:#f5f3ff;color:var(--primary);}
.pay-method .logo{font-size:20px;}
.sku-options{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.sku-option{padding:12px 16px;border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:#fff;font-size:14px;font-weight:700;user-select:none;-webkit-user-select:none;font-family:inherit;min-width:100px;text-align:center;}
.sku-option:hover{border-color:#c7cbe0;}
.sku-option.active{border-color:var(--primary);background:#f5f3ff;color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.1);}
.sku-option small{display:block;font-size:13px;color:#e11d48;margin-top:4px;font-weight:800;}
.sku-option.active small{color:var(--primary);}
.balance-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fef9e7;border:1px dashed #fcd34d;border-radius:10px;margin-bottom:14px;font-size:14px}
.balance-row .lbl{display:flex;align-items:center;gap:8px;font-weight:600;color:#92400e}
.balance-row .val{color:#b45309;font-weight:700}
.panel{padding:24px;margin-bottom:16px}
.panel h2{margin:0 0 18px;font-size:17px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right;word-break:break-all}
.codebox{background:#0f172a;color:#7dd3fc;padding:14px 16px;border-radius:10px;font-size:15px;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.codebox span{word-break:break-all}
.codebox button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;flex-shrink:0}
.qr-wrap{text-align:center;padding:14px;background:#f8fafc;border-radius:12px;margin:12px 0}
.qr-wrap img{max-width:220px;width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.qr-tip{font-size:12px;color:var(--muted);margin-top:8px}
.addr-box{background:#0f172a;color:#7dd3fc;padding:12px 14px;border-radius:10px;font-size:13px;word-break:break-all;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.addr-box span{flex:1;text-align:left}
.addr-box button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;flex-shrink:0}
.redpacket-box{background:linear-gradient(135deg,#ff5722,#e91e63);color:#fff;border-radius:14px;padding:22px 20px;text-align:center;margin:14px 0;position:relative;overflow:hidden}
.redpacket-box::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);right:-50px;top:-50px}
.redpacket-box .lbl{font-size:13px;opacity:.9;margin-bottom:8px;position:relative;z-index:1}
.redpacket-box .code{font-size:32px;font-weight:900;letter-spacing:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-bottom:12px;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.redpacket-box .copy-btn{background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.4);color:#fff;padding:9px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;position:relative;z-index:1;font-family:inherit}
.redpacket-box .copy-btn:hover{background:rgba(255,255,255,.4)}
.redpacket-steps{background:#fff5f5;border:1px dashed #fc8181;border-radius:10px;padding:14px 18px;font-size:13px;color:#742a2a;line-height:2;margin-bottom:14px}
.redpacket-steps ol{margin:0;padding-left:20px}
.redpacket-steps b{color:#c53030}
.session-box{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border-radius:14px;padding:22px 24px;margin:14px 0;position:relative;overflow:hidden}
.session-box::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-60px}
.session-box .lbl{font-size:13px;opacity:.9;margin-bottom:6px;position:relative;z-index:1}
.session-box .num{font-size:26px;font-weight:900;letter-spacing:1px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-bottom:12px;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.2);word-break:break-all}
.session-box .timer{font-size:14px;font-weight:600;opacity:.95;position:relative;z-index:1;display:inline-block;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:8px}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fade .18s;overscroll-behavior:contain!important;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:18px;width:100%;max-width:440px;padding:24px;box-shadow:0 24px 60px -12px rgba(0,0,0,.35);animation:pop .2s;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain!important;}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 18px;font-size:17px}
.modal.wide{max-width:560px}
.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);background:#1f2430;color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#b91c1c}.toast.success{background:#047857}.toast.info{background:#0369a1}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{padding:9px 16px;border-radius:10px;border:0;background:#eef0f6;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.tabs button .nb{background:#ef4444;color:#fff;font-size:10px;border-radius:99px;padding:1px 6px;margin-left:5px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.stat .n{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tbody tr:hover{background:#fafbfe}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.section-title{font-size:15px;font-weight:700;margin:26px 0 12px}
.member-card{background:linear-gradient(135deg,#1e293b,#334155);border-radius:18px;padding:22px 24px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden}
.member-card::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(99,102,241,.25);right:-70px;bottom:-90px}
.member-card .lbl{font-size:13px;opacity:.75;margin-bottom:4px}
.member-card .amt{font-size:34px;font-weight:800;letter-spacing:.5px}
.member-card .amt small{font-size:16px;font-weight:600;opacity:.85}
.member-card .id{font-size:12px;opacity:.7;margin-top:8px;position:relative;z-index:1;line-height:1.8}
.member-card .id b{color:#c7d2fe}
.quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick-amounts button{padding:10px 18px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);font-family:inherit;transition:.15s}
.quick-amounts button:hover{border-color:var(--primary);color:var(--primary)}
.quick-amounts button.active{background:#f5f3ff;border-color:var(--primary);color:var(--primary)}
.auth-panel{max-width:420px;margin:40px auto}
.auth-tabs{display:flex;background:#eef0f6;border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:10px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);border-radius:9px;transition:.15s;font-family:inherit}
.auth-tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px -2px rgba(16,24,40,.12)}
.auth-tip{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.7}
.field-err{color:#b91c1c;font-size:12px;margin-top:6px;display:block;min-height:14px}
.find-pwd-link{text-align:center;font-size:13px;margin:10px 0 0}
.find-pwd-link a{color:#6366f1;font-weight:600}
.rp-code-cell{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;color:#e91e63;letter-spacing:1px;font-size:13px}
.sku-editor{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.sku-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.sku-row input{padding:8px 10px;font-size:13px}
.sku-row .sku-name{flex:2}
.sku-row .sku-price{flex:1}
.sku-row .sku-del{flex:0 0 auto;background:#fee2e2;color:#b91c1c;border:0;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-weight:600}
.sku-add{margin-top:4px;background:#eef2ff;color:#4f46e5;border:1px dashed #a5b4fc;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.sku-add:hover{background:#e0e7ff}
.sku-hint{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.6}
.tg-hint{background:#e0f2fe;border:1px solid #7dd3fc;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#075985;line-height:1.7}
.tg-hint code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px}
.luban-hint{background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:12px 16px;margin:14px 0;font-size:13px;color:#92400e;line-height:1.7}
.color-swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.color-swatch{width:34px;height:34px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:.15s}
.color-swatch:hover{transform:scale(1.1)}
.cs-float{position:fixed;right:20px;bottom:88px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -6px rgba(16,185,129,.6);z-index:140;cursor:pointer;transition:.2s;border:0;font-size:24px}
.cs-float:hover{transform:scale(1.08) translateY(-2px)}
.cs-float::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #10b981;opacity:.35;animation:pulse 2.2s infinite}
.cs-float .cs-dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#ef4444;border:2px solid #fff;display:none}
.cs-float.has-msg .cs-dot{display:block;animation:csPulse 1.5s infinite}
@keyframes csPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.cs-panel{position:fixed;right:16px;bottom:148px;width:340px;max-width:calc(100vw - 32px);height:480px;max-height:calc(100vh - 200px);background:#fff;border-radius:16px;box-shadow:0 20px 60px -12px rgba(0,0,0,.25);z-index:250;display:none;flex-direction:column;overflow:hidden;border:1px solid #e5e7eb;overscroll-behavior:contain!important;}
.cs-panel.open{display:flex}
.cs-header{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.cs-header h3{margin:0;font-size:15px;font-weight:700}
.cs-header .cs-close{background:rgba(255,255,255,.2);border:0;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;}
.cs-msgs{flex:1;overflow-y:auto;padding:14px;background:#f9fafb;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch;}
.cs-msg{max-width:82%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.5;word-break:break-word;animation:csIn .2s}
@keyframes csIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cs-msg.customer{align-self:flex-end;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-bottom-right-radius:4px}
.cs-msg.admin{align-self:flex-start;background:#fff;border:1px solid #e5e7eb;border-bottom-left-radius:4px;color:#1f2937}
.cs-msg .cs-time{display:block;font-size:10px;opacity:.6;margin-top:4px}
.cs-input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #e5e7eb;background:#fff;flex-shrink:0}
.cs-input input{flex:1;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;outline:none}

function copyText(text, btn){
  const done = () => { const o = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(() => { btn.textContent = o; }, 1400); };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){ toast('复制失败','error'); }

}

function hexToRgba(hex, alpha){
  const h = String(hex||'#0088cc').replace('#','');
  const full = h.length === 3 ? h.split('').map(c => c+c).join('') : h;
  const r = parseInt(full.slice(0,2),16)||0, g = parseInt(full.slice(2,4),16)||0, b = parseInt(full.slice(4,6),16)||0;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function hashPwd(pwd){
  const salt = 'yfk2024salt::v2::';
  let str = salt + pwd + salt;
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let round = 0; round < 1000; round++){
    for (let i = 0; i < str.length; i++){
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = Math.imul(h2 + c, 0x85ebca6b) >>> 0;
    }
    str = h1.toString(16) + h2.toString(16) + pwd + salt;
  }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
function hashPwdOld(pwd){
  const salt = 'yfk2024salt';
  const str = salt + '::' + pwd + '::' + salt;
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 + c, 0x85ebca6b) >>> 0;
  }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
function verifyPwd(input, storedHash, upgradeCallback){
  if (hashPwd(input) === storedHash) return true;
  if (hashPwdOld(input) === storedHash){
    if (upgradeCallback) upgradeCallback(hashPwd(input));
    return true;
  }
  return false;
}
window.hashPwd = hashPwd; window.hashPwdOld = hashPwdOld; window.verifyPwd = verifyPwd;

function rawLoadDB(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw){ const d = seedDB(); localStorage.setItem(STORE_KEY, JSON.stringify(d)); return d; }
    const d = JSON.parse(raw);
    if (!d.products || !d.cards || !d.orders) throw new Error('bad');
    if (!d.config) d.config = Object.assign({}, DEFAULT_CONFIG);
    Object.keys(DEFAULT_CONFIG).forEach(k => { if (d.config[k] === undefined) d.config[k] = DEFAULT_CONFIG[k]; });
    if (!Array.isArray(d.categories)) d.categories = [];
    if (!Array.isArray(d.members)) d.members = [];
    if (!Array.isArray(d.recharges)) d.recharges = [];
    d.products.forEach(p => { if (!Array.isArray(p.skus)) p.skus = []; if (!p.source) p.source = 'local'; });
    d.cards.forEach(c => { if (c.sku_id === undefined) c.sku_id = 0; });
    d.members = d.members.filter(m => m && m.username && m.password);
    d.members.forEach(m => { if (m.secret === undefined && m.contact !== undefined) m.secret = m.contact; });
    d.orders.forEach(o => {
      if (o.secret === undefined && o.contact !== undefined) o.secret = o.contact;
      if (!o.source) o.source = 'local';
    });
    if (!d.seq) d.seq = {product:0, card:0, category:0};
    if (!d.seq.category) d.seq.category = d.categories.reduce((m, c) => Math.max(m, c.id||0), 0);
    return d;
  } catch(e){
    const d = seedDB(); localStorage.setItem(STORE_KEY, JSON.stringify(d)); return d;
  }
}

  openModal(`<h3>${isLuban ? '确认接码' : '确认购买'}</h3>
    <div class="kv"><span class="k">商品</span><span class="v">${esc(p.name)}</span></div>

    <div class="kv" style="margin-bottom:14px"><span class="k">单价</span><span class="v" style="color:#e11d48" id="buy-unit">${usdt(initialPrice)} USDT</span></div>

function confirmPay(type, id){
  if (window._confirmLock && window._confirmLock[type + ':' + id] && Date.now() - window._confirmLock[type + ':' + id] < 3000) {
    toast('正在处理，请勿重复提交', 'warn'); return;
  }
  window._confirmLock = window._confirmLock || {};
  window._confirmLock[type + ':' + id] = Date.now();

  const db = loadDB();
  if (type === 'order'){
    const o = db.orders.find(x => x.order_no === id);
    if (!o) return;
    if (o.pay_method === 'usdt'){
      if (!o.usdt_notified_at){ o.usdt_notified_at = now(); saveDB(db); notifyTg(o.order_no); }
      toast('已通知商家，系统正在自动检测到账','success');
      closeModal();
      location.hash = '#/order/' + id;
      if (location.hash === '#/order/' + id) route();
      return;
    }
    if (o.pay_method === 'alipay'){ showPayerNameInput('order', id); return; }
    o.status = 'pending_review';
    o.submitted_at = now();
    saveDB(db);
    closeModal();
    toast('已提交，正在通知商家审核','success');
    notifyTg(o.order_no);
    location.hash = '#/order/' + id;
    if (location.hash === '#/order/' + id) route();
  } else if (type === 'recharge'){
    const r = db.recharges.find(x => x.id === id);
    if (!r) return;
    if (r.status === 'success'){ toast('该充值已到账','success'); return; }
    if (r.method === 'usdt'){
      if (!r.usdt_notified_at){ r.usdt_notified_at = now(); saveDB(db); try{notifyTg(r.id);}catch(e){} }
      toast('已提交，系统正在自动检测USDT到账…','success');
      closeModal();
      startUsdtPolling(r.id);
      location.hash = '#/member';
      if (location.hash === '#/member') route();
      return;
    }
    if (r.method === 'alipay'){ showPayerNameInput('recharge', id); return; }
    r.status = 'pending_review';
    r.submitted_at = now();
    saveDB(db);
    closeModal();
    toast('已提交，管理员核实收款后到账','success');
    try{notifyTg(r.id);}catch(e){}
    location.hash = '#/member';
    if (location.hash === '#/member') route();
  }
}

}

/* ============ 订单处理 payOrder ============ */
function payOrder(orderNo){
  const db = loadDB();
  const o = db.orders.find(x => x.order_no === orderNo);
  if (!o || o.status !== 'pending') return;
  if (o.source === 'luban'){
    o.status = 'processing'; saveDB(db);
    if (o.luban_type === 'common') {
      const params = { keyword: o.luban_keyword || '' };
      if (o.luban_country) params.country = o.luban_country;
      if (o.luban_phone) params.phone = o.luban_phone;
      if (o.luban_cardtype && o.luban_cardtype !== '全部') params.cardType = o.luban_cardtype;
      if (o.luban_filter === '是') params.filter = '1';
      lubanStartCommon(orderNo, params);
    } else lubanStartSession(orderNo);
    return;
  }
  if (o.source === 'smm') {
    o.status = 'processing'; saveDB(db);
    smmApi('add', { service: o.smm_service_id, link: o.smm_link, quantity: o.quantity })
      .then(r => {
        var db2 = loadDB(); var o2 = db2.orders.find(x => x.order_no === orderNo); if (!o2) return;
        if (r.ok && r.data && r.data.order) {
          o2.smm_order_id = String(r.data.order); o2.smm_state = 'In progress'; saveDB(db2);
          toast('已提交到上游，订单号：' + r.data.order, 'success'); startPoll(orderNo);
        } else {
          o2.status = 'luban_error'; o2.luban_error = (r.data && r.data.error) || '提交失败'; saveDB(db2);
          toast('提交失败：' + o2.luban_error, 'error');
        }
        if (location.hash === '#/order/' + orderNo) route();
      }).catch(e => {
        var db2 = loadDB(); var o2 = db2.orders.find(x => x.order_no === orderNo);
        if (o2){ o2.status = 'luban_error'; o2.luban_error = '网络错误：' + e.message; saveDB(db2); }
      });
    return;
  }
  const orderSku = o.sku_id || 0;
  const available = db.cards.filter(c => c.product_id === o.product_id && c.status === 'unused' && String(c.sku_id || 0) === String(orderSku));
  if (available.length >= o.quantity){
    const usedIds = new Set(db.orders.flatMap(x => x.cards || []));
    const safeCards = available.filter(c => !usedIds.has(c.content));
    const toUse = safeCards.length >= o.quantity ? safeCards.slice(0, o.quantity) : available.slice(0, o.quantity);
    toUse.forEach(c => { c.status = 'used'; c.order_no = o.order_no; c.used_at = now(); o.cards.push(c.content); });
    o.status = 'delivered'; o.delivered_at = now();
  } else if (available.length === 0){
    o.status = 'delivered'; o.delivered_at = now(); o.cards = ['虚拟商品·自动发货（无需卡密）'];
  } else o.status = 'out_of_stock';
  saveDB(db);
  if (o.status === 'delivered' || o.status === 'out_of_stock') {
    yfSendTgNow((o.status==='delivered'?'✅ 已自动发货':'⚠️ 缺货待补发') + '\n订单号：<code>'+o.order_no+'</code>\n商品：'+o.product_name+'\n数量：'+o.quantity+'\n金额：¥'+yuan(o.amount_due)+'\n支付：余额抵扣\n会员：'+(o.username||'匿名'));
  }
}

/* ============ USDT 轮询 ============ */
let _usdtPollTimer = null;
function startUsdtPolling(orderNo){
  if (_usdtPollTimer) clearInterval(_usdtPollTimer);
  const check = () => {
    if (document.hidden) return;
    fetch('/api/usdt-check?order=' + encodeURIComponent(orderNo))
      .then(r => r.json()).then(d => {
        if (d.ok && d.status && d.status !== 'pending'){
          clearInterval(_usdtPollTimer); _usdtPollTimer = null;
          toast('USDT 已到账，系统正在处理 🎉','success');
          var _db = loadDB();
          var _r = _db.recharges.find(x => x.id === orderNo);
          if (_r && _r.status !== 'success'){ processRecharge(orderNo); }
          else { var _o = _db.orders.find(x => x.order_no === orderNo); if (_o && _o.status === 'pending'){ try{payOrder(orderNo);}catch(e){} } }
          setTimeout(() => { route(); }, 800);
        }
      }).catch(()=>{});
  };
  check();
  _usdtPollTimer = setInterval(check, 30000);
}
window.startUsdtPolling = startUsdtPolling;

  if (!confirm('确认已收款 ' + orderUsdt(o.amount_due, o) + ' USDT，为客户发货？')) return;
  if (o.source === 'luban'){
    o.status = 'processing'; saveDB(db); toast('已确认，正在请求号码…','success');
    if (o.luban_type === 'common') {
      const params = { keyword: o.luban_keyword || '' };
      if (o.luban_country) params.country = o.luban_country;
      if (o.luban_phone) params.phone = o.luban_phone;
      if (o.luban_cardtype && o.luban_cardtype !== '全部') params.cardType = o.luban_cardtype;
      if (o.luban_filter === '是') params.filter = '1';
      lubanStartCommon(orderNo, params);
    } else lubanStartSession(orderNo);
    renderOrders(); return;
  }
  const orderSku = o.sku_id || 0;
  const available = db.cards.filter(c => c.product_id === o.product_id && c.status === 'unused' && String(c.sku_id || 0) === String(orderSku));
  if (available.length < o.quantity){ toast(`该规格库存不足，需要 ${o.quantity} 条，只有 ${available.length} 条`, 'error'); return; }
  const usedIds2 = new Set(db.orders.flatMap(x => x.cards || []));
  const safeCards2 = available.filter(c => !usedIds2.has(c.content));
  const toUse2 = safeCards2.length >= o.quantity ? safeCards2.slice(0, o.quantity) : available.slice(0, o.quantity);
  toUse2.forEach(c => { c.status = 'used'; c.order_no = o.order_no; c.used_at = now(); o.cards.push(c.content); });
  o.status = 'delivered'; o.delivered_at = now(); o.approved_at = now();
  saveDB(db); toast('已确认发货 ✅','success'); renderOrders();
}
window.approveOrder = approveOrder;

function rejectOrder(orderNo){
  const db = loadDB();
  const o = db.orders.find(x => x.order_no === orderNo);
  if (!o) return;
  if (!confirm('确定驳回订单 ' + orderNo + '？客户将看到"订单已驳回"。')) return;
  o.status = 'rejected'; o.rejected_at = now();
  if (o.balance_used > 0 && o.username) {
    addBalance(db, o.username, o.balance_used); o.refunded_at = now(); o.refunded_amount = o.balance_used; o.balance_used = 0;
  }
  saveDB(db); toast('订单已驳回','success'); renderOrders();
}
window.rejectOrder = rejectOrder;

function cancelOrderRefund(orderNo){
  var db = loadDB();
  var o = db.orders.find(x => x.order_no === orderNo);
  if (!o || o.status !== 'pending'){ toast('订单状态不允许取消','error'); return; }
  if (o.balance_used > 0 && o.username) { addBalance(db, o.username, o.balance_used); o.refunded_amount = o.balance_used; o.refunded_at = now(); o.balance_used = 0; }
  o.status = 'rejected'; o.completed_at = now();
  saveDB(db); toast('订单已取消，余额已退还','success'); route();
}
window.cancelOrderRefund = cancelOrderRefund;

  document.querySelectorAll('#rc-methods .pay-method').forEach(el => {

function submitRecharge(){
  if (_submitting){ toast('正在处理，请勿重复提交','warn'); return; }

  const db = loadDB();
  const cfg = getConfig(db);

  if (!member){ toast('请先登录','error'); return; }
  const amount = Math.round(parseFloat($('#rc-amount').value || '0') * 100);
  const min = cfg.recharge_min || 1000;
  if (!(amount >= min)){ toast('最低充值 ' + yuan(min) + ' 元（≈' + usdt(min) + ' USDT）','error'); return; }
  const radio = document.querySelector('input[name="rc-method"]:checked');

function yfRecoverOrder(){
  var no = (document.getElementById('yf-recover-no') || {}).value;
  var amt = parseFloat((document.getElementById('yf-recover-amt') || {}).value || '0');
  no = (no || '').trim();
  if (!no || !amt){ toast('请填写订单号和金额','error'); return; }
  var db = loadDB(); var o = db.orders.find(x => x.order_no === no);
  if (!o){ toast('订单不存在','error'); return; }
  if (Math.abs(o.amount / 100 - amt) > 0.01){ toast('金额不匹配','error'); return; }
  try { var m = JSON.parse(localStorage.getItem(MY_KEY) || '{}'); m[no] = o.secret; localStorage.setItem(MY_KEY, JSON.stringify(m)); } catch(e){}
  toast('找回成功，正在跳转…','success');
  location.hash = '#/order/' + no; if (location.hash === '#/order/' + no && window.route) route();
}

function categoryOptions(db, selectedId){
  const sel = String(selectedId || 0);
  const opts = [`<option value="0" ${sel === '0' ? 'selected' : ''}>未分类</option>`];
  db.categories.forEach(c => opts.push(`<option value="${c.id}" ${sel === String(c.id) ? 'selected' : ''}>${esc(c.name)}</option>`));
  return opts.join('');
}
function skuEditorHtml(skus){
  const list = Array.isArray(skus) ? skus : [];
  const rows = list.length ? list.map(s => `<div class="sku-row" data-sku-id="${s.id}">
      <input class="sku-name" type="text" value="${esc(s.name)}" placeholder="规格名" maxlength="20">
      <input class="sku-price" type="number" step="0.01" value="${(s.price/100).toFixed(2)}" placeholder="价格">
      <button class="sku-del" type="button" onclick="removeSkuRow(this)">删除</button></div>`).join('') : '';
  return `<div class="sku-editor" id="sku-editor"><div class="sku-hint">💡 不添加规格 = 单价格商品</div><div id="sku-rows">${rows}</div><button class="sku-add" type="button" onclick="addSkuRow()">+ 添加规格</button></div>`;
}
window.skuEditorHtml = skuEditorHtml;
function addSkuRow(){
  const box = document.getElementById('sku-rows'); if (!box) return;
  const div = document.createElement('div'); div.className = 'sku-row'; div.dataset.skuId = String(genSkuId());
  div.innerHTML = '<input class="sku-name" type="text" placeholder="规格名" maxlength="20"><input class="sku-price" type="number" step="0.01" placeholder="价格"><button class="sku-del" type="button" onclick="removeSkuRow(this)">删除</button>';
  box.appendChild(div); div.querySelector('.sku-name').focus();
}
window.addSkuRow = addSkuRow;
function removeSkuRow(btn){ const row = btn.closest('.sku-row'); if (row) row.remove(); }
window.removeSkuRow = removeSkuRow;
function collectSkusFromEditor(){
  const rows = document.querySelectorAll('#sku-rows .sku-row'); const skus = []; const seen = {};
  rows.forEach(r => {
    const name = r.querySelector('.sku-name').value.trim();
    const price = Math.round(parseFloat(r.querySelector('.sku-price').value || '0') * 100);
    if (!name || seen[name]) return; seen[name] = true;
    let id = parseInt(r.dataset.skuId); if (!id) id = genSkuId();
    r.dataset.skuId = String(id); skus.push({id, name, price: price >= 0 ? price : 0});
  });
  return skus;
}

function createProduct(){
  const name = $('#np-name').value.trim(); const price = Math.round(parseFloat($('#np-price').value || '0') * 100); const skus = collectSkusFromEditor();
  if (!name){ toast('请填写商品名称','error'); return; }
  if (!skus.length && !(price >= 0)){ toast('请填写正确的价格','error'); return; }
  const db = loadDB(); db.seq.product++;
  db.products.push({ id: db.seq.product, name, price: skus.length ? skus[0].price : price, description: $('#np-desc').value.trim(), note: $('#np-note').value.trim(), category_id: parseInt($('#np-cat').value) || 0, active: true, created_at: now(), skus, source: 'local' });
  saveDB(db); toast(skus.length ? `创建成功，已添加 ${skus.length} 个规格` : '创建成功','success'); renderProducts();
}

function saveProduct(id){

function renderCategories(){

function createCategory(){

window.createCategory = createCategory;

function editCategory(id){ openModal(`<h3>重命名分类</h3><label class="field"><span>分类名称</span><input id="ec-name" value="${esc(loadDB().categories.find(x=>x.id===id).name)}" maxlength="12"></label><div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveCategory(${id})">保存</button></div>`); $('#ec-name').focus(); }
window.editCategory = editCategory;

function saveCategory(id){
  const name = $('#ec-name').value.trim(); if (!name){ toast('分类名称不能为空','error'); return; }
  const db = loadDB(); if (db.categories.some(c => c.id !== id && c.name === name)){ toast('该分类名已存在','error'); return; }

function moveCategory(id, dir){
  const db = loadDB(); const i = db.categories.findIndex(c => c.id === id); const j = i + dir;
  if (i < 0 || j < 0 || j >= db.categories.length) return;
  [db.categories[i], db.categories[j]] = [db.categories[j], db.categories[i]]; saveDB(db); renderCategories();
}
window.moveCategory = moveCategory;

function deleteCategory(id){
  const db = loadDB(); const c = db.categories.find(x => x.id === id); if (!c) return;
  const n = db.products.filter(p => String(p.category_id) === String(id)).length;
  if (!confirm(n > 0 ? `分类「${c.name}」下有 ${n} 个商品，删除后这些商品将变为「未分类」。确定删除？` : `确定删除分类「${c.name}」？`)) return;
  db.categories = db.categories.filter(x => x.id !== id); db.products.forEach(p => { if (String(p.category_id) === String(id)) p.category_id = 0; });

}
window.deleteCategory = deleteCategory;

function renderCards(){
  const db = loadDB(); const localProducts = db.products.filter(p => p.source !== 'luban' && p.source !== 'smm');
  const opts = localProducts.map(p => `<option value="${p.id}">${esc(p.name)} ${hasSkus(p)?'（多规格）':`（可用 ${stockOf(db, p.id)}）`}</option>`).join('');

      <div id="ic-sku-wrap"></div>
      <label class="field"><span>卡密内容（一行一条，自动去重）</span><textarea id="ic-text" rows="6" placeholder="CARD-0001-XXXX-YYYY&#10;CARD-0002-AAAA-BBBB"></textarea></label>

    <div class="card panel"><div class="spread"><h2 style="margin:0">卡密列表</h2><select id="ic-filter" style="width:auto" onchange="loadCards()"><option value="unused">未使用</option><option value="used">已售出</option><option value="all">全部</option></select></div><div id="cards-list" style="margin-top:16px"><div class="loading">加载中…</div></div></div>`;
  onCardProductChange();
}
window.renderCards = renderCards;

function onCardProductChange(){
  const db = loadDB(); const pid = parseInt($('#ic-pid').value); const wrap = $('#ic-sku-wrap');
  if (!wrap) return;
  if (!pid){ wrap.innerHTML = ''; loadCards(); return; }
  const p = db.products.find(x => x.id === pid); const skus = getSkus(p);
  if (!skus.length) wrap.innerHTML = '';
  else wrap.innerHTML = `<label class="field"><span>选择规格</span><select id="ic-skuid" onchange="loadCards()">${skus.map(s => { const cnt = db.cards.filter(c => c.product_id === pid && String(c.sku_id) === String(s.id) && c.status === 'unused').length; return `<option value="${s.id}">${esc(s.name)} ${usdt(s.price)} USDT（可用 ${cnt}）</option>`; }).join('')}</select></label>`;
  loadCards();
}
window.onCardProductChange = onCardProductChange;

function importCards(){
  const db = loadDB(); const pid = parseInt($('#ic-pid').value); let text = $('#ic-text').value;
  if (!pid){ toast('请先创建商品','error'); return; }
  if (!text.trim()){ toast('请输入卡密内容','error'); return; }
  /* P29 安全修复：过滤危险字符 */
  text = text.split('\n').map(line => line.replace(/[<>"'`\\\x00-\x1F\x7F]/g, '').trim()).filter(Boolean).join('\n');
  const p = db.products.find(x => x.id === pid); const skus = getSkus(p); let skuId = 0;
  if (skus.length){ const skuEl = $('#ic-skuid'); if (!skuEl){ toast('请选择规格','error'); return; } skuId = parseInt(skuEl.value); }
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  const existSet = {}; db.cards.filter(c => c.product_id === pid && String(c.sku_id || 0) === String(skuId)).forEach(c => { existSet[c.content] = true; });
  let added = 0, skipped = 0;
  lines.forEach(line => {
    if (existSet[line]){ skipped++; return; }
    existSet[line] = true; db.seq.card++;
    db.cards.push({id: db.seq.card, product_id: pid, sku_id: skuId, content: line, status: 'unused', order_no: '', used_at: '', created_at: now()}); added++;
  });
  saveDB(db); $('#ic-text').value = ''; toast(`成功导入 ${added} 条` + (skipped ? `，跳过重复 ${skipped} 条` : ''),'success'); renderCards();
}
window.importCards = importCards;

function loadCards(){
  const db = loadDB(); const pidEl = $('#ic-pid'); const box = $('#cards-list');
  if (!pidEl || !box) return;
  const pid = parseInt(pidEl.value); const filter = $('#ic-filter').value;
  if (!pid){ box.innerHTML = '<div class="empty">请先创建商品</div>'; return; }
  const p = db.products.find(x => x.id === pid); let list = db.cards.filter(c => c.product_id === pid);
  if (p && hasSkus(p)){ const skuEl = $('#ic-skuid'); if (skuEl){ const sid = parseInt(skuEl.value); list = list.filter(c => String(c.sku_id || 0) === String(sid)); } }
  if (filter !== 'all') list = list.filter(c => c.status === filter);
  if (!list.length){ box.innerHTML = '<div class="empty">暂无卡密</div>'; return; }
  box.innerHTML = `<div style="overflow-x:auto"><table><thead><tr><th>卡密</th><th>状态</th><th>关联订单</th><th>时间</th><th></th></tr></thead><tbody>${list.map(c => `<tr><td class="mono">${esc(c.content)}</td><td><span class="badge ${c.status === 'unused' ? 'ok' : 'gray'}">${c.status === 'unused' ? '未使用' : '已售出'}</span></td><td class="mono muted" style="font-size:12px">${esc(c.order_no || '-')}</td><td class="muted" style="font-size:12px">${esc(c.used_at || c.created_at)}</td><td style="text-align:right">${c.status === 'unused' ? `<button class="btn sm danger" onclick="deleteCard(${c.id})">删除</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
window.loadCards = loadCards;

function deleteCard(id){
  if (!confirm('确定删除这条卡密？')) return;
  const db = loadDB(); db.cards = db.cards.filter(c => c.id !== id); saveDB(db); toast('已删除','success'); loadCards();

/* ============ 订单管理 ============ */
function renderOrders(){
  const db = loadDB(); const orders = db.orders;
  const doneCount = orders.filter(o => o.status === 'delivered' || o.status === 'rejected').length;
  const rows = orders.length ? orders.map(o => {
    const rpCell = o.redpacket_code ? `<span class="rp-code-cell" data-copy="${esc(o.redpacket_code)}" style="cursor:pointer">${esc(o.redpacket_code)}</span>` : '-';
    const srcTag = o.source === 'luban' ? ' <span class="badge src-luban">接码</span>' : '';
    let actionBtns = '';
    if (o.status === 'pending_review') actionBtns += `<button class="btn sm primary" onclick="approveOrder('${esc(o.order_no)}')">处理</button> <button class="btn sm danger" onclick="rejectOrder('${esc(o.order_no)}')">驳回</button> `;
    if (o.status === 'out_of_stock') actionBtns += `<button class="btn sm primary" onclick="redeliver('${esc(o.order_no)}')">补发</button> `;
    if (o.cards && o.cards.length) actionBtns += `<button class="btn sm ghost" onclick="viewOrderCards('${esc(o.order_no)}')">卡密</button> `;
    actionBtns += `<button class="btn sm danger" onclick="deleteOrder('${esc(o.order_no)}')">🗑</button>`;
    return `<tr><td class="mono" style="font-size:12px">${esc(o.order_no)}</td><td>${esc(o.product_name)}${srcTag} <div class="muted" style="font-size:12px">×${o.quantity}</div></td><td>${orderUsdt(o.amount, o)} USDT${o.balance_used>0?'<div class="muted" style="font-size:11px">余额抵扣'+orderUsdt(o.balance_used,o)+' USDT</div>':''}</td><td>${o.pay_method === 'balance' ? '余额' : (o.pay_method === 'alipay' ? '支付宝' : 'USDT')}</td><td>${rpCell}</td><td class="muted" style="font-size:12px">${esc(o.secret)}</td><td><span class="badge ${STATUS_CLASS[o.status] || 'gray'}">${STATUS_TEXT[o.status] || o.status}</span></td><td class="muted" style="font-size:12px">${esc(o.created_at)}</td><td style="text-align:right;white-space:nowrap">${actionBtns}</td></tr>`;
  }).join('') : '<tr><td colspan="9" class="empty">暂无订单</td></tr>';
  $('#tab-body').innerHTML = `<div class="card panel"><div class="spread"><h2 style="margin:0">订单列表（${orders.length}）</h2><button class="btn danger sm" onclick="clearCompletedOrders()">清理已发货（${doneCount}）</button></div><div style="overflow-x:auto;margin-top:16px"><table><thead><tr><th>订单号</th><th>商品</th><th>金额</th><th>支付</th><th>红包口令</th><th>暗号</th><th>状态</th><th>时间</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  setTimeout(() => {
    document.querySelectorAll('.rp-code-cell').forEach(el => {
      el.onclick = function(){
        var txt = el.textContent;
        fallbackCopy(txt, function(){ el.textContent = '已复制 ✓'; setTimeout(() => { el.textContent = txt; }, 1200); });
      };
    });
  }, 50);
}
window.renderOrders = renderOrders;

function deleteOrder(orderNo){
  const db = loadDB(); const o = db.orders.find(x => x.order_no === orderNo); if (!o) return;
  if (!confirm(`确定删除订单「${orderNo}」？`)) return;
  db.orders = db.orders.filter(x => x.order_no !== orderNo); saveDB(db); toast('订单已删除','success'); renderOrders();
}
window.deleteOrder = deleteOrder;

function clearCompletedOrders(){
  const db = loadDB(); const done = db.orders.filter(o => o.status === 'delivered' || o.status === 'rejected');
  if (!done.length){ toast('没有可清理的订单','error'); return; }
  if (!confirm(`确定批量删除 ${done.length} 条「已发货/已驳回」订单？`)) return;
  db.orders = db.orders.filter(o => o.status !== 'delivered' && o.status !== 'rejected'); saveDB(db); toast(`已清理 ${done.length} 条订单`,'success'); renderOrders();
}
window.clearCompletedOrders = clearCompletedOrders;

function redeliver(orderNo){
  const db = loadDB(); const o = db.orders.find(x => x.order_no === orderNo); if (!o) return;
  const need = o.quantity - o.cards.length; const orderSku = o.sku_id || 0;
  const available = db.cards.filter(c => c.product_id === o.product_id && c.status === 'unused' && String(c.sku_id || 0) === String(orderSku));
  if (available.length < need){ toast(`该规格库存仍不足，还需 ${need - available.length} 条`,'error'); return; }
  available.slice(0, need).forEach(c => { c.status = 'used'; c.order_no = o.order_no; c.used_at = now(); o.cards.push(c.content); });
  o.status = 'delivered'; o.delivered_at = now(); saveDB(db); toast('补发成功','success'); renderOrders();
}
window.redeliver = redeliver;

function viewOrderCards(orderNo){
  const db = loadDB(); const o = db.orders.find(x => x.order_no === orderNo); if (!o || !o.cards.length){ toast('该订单暂无卡密','error'); return; }
  openModal(`<h3>订单卡密</h3><p class="muted mono" style="font-size:12px;margin-top:-10px">${esc(orderNo)}</p>${o.cards.map(c => `<div class="codebox"><span class="mono">${esc(c)}</span><button data-v="${esc(c)}" onclick="copyText(this.dataset.v,this)">复制</button></div>`).join('')}<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" onclick="closeModal()">关闭</button></div>`);
}
window.viewOrderCards = viewOrderCards;

function renderMembers(){

function recalcAllPrices(db){
  const cfg = db.config || {};
  const rate = Number(cfg.pay_usdt_rate) || 7.2;
  const smmMarkup = Number(cfg.smm_markup) || 1.5;
  const lbMarkup = Number(cfg.luban_markup) || 1.3;
  const costCur = cfg.smm_cost_currency || 'CNY';
  let smmN = 0, lbN = 0;
  (db.products || []).forEach(p => {
    if (p.source === 'smm') {
      if (p.smm_custom_price > 0) { p.price = p.smm_custom_price; return; }
      const r = parseFloat(p.smm_rate_usd || 0);
      const cny = costCur === 'USD' ? r * rate : r;
      p.price = Math.max(1, Math.round(cny * smmMarkup * 100)); smmN++;
    } else if (p.source === 'luban' && p.luban_type === 'sms') {
      const origin = parseFloat(p.luban_origin_cost || 0);
      if (origin > 0) { p.price = Math.max(1, Math.round(origin * rate * lbMarkup * 100)); lbN++; }
    }
  });
  return { smmN, lbN };
}
window.recalcAllPrices = recalcAllPrices;

function lubanCommonPriceFen(cfg){

  const cost = Number(cfg.luban_common_cost) || 2;
  const mk = Number(cfg.luban_markup) || 1.3;
  return Math.max(1, Math.round(cost * mk * 100));
}

/* ============ Luban 同步工具 ============ */
window.yfLubanFetchAll = function(){
  var page = 1;
  var allItems = [];
  var emptyStreak = 0;
  var maxPages = 50;
  function fetchPage(){
    return fetch('/api/luban?action=services&language=zh&page=' + page)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.code !== 0) throw new Error(d.msg || '拉取失败');
        var list = Array.isArray(d.msg) ? d.msg : [];
        if (list.length > 0){
          allItems.push.apply(allItems, list);
          emptyStreak = 0;
          page++;
          if (page > maxPages) return null;
          return new Promise(function(res){ setTimeout(function(){ res(fetchPage()); }, 150); });
        }
        emptyStreak++;
        if (emptyStreak >= 2) return null;
        page++;
        if (page > maxPages) return null;
        return new Promise(function(res){ setTimeout(function(){ res(fetchPage()); }, 300); });
      });
  }
  return fetchPage().then(function(){ return allItems; });
};

window.yfLubanMergeServices = function(allItems){
  var db = loadDB();
  var m = Number(db.config.luban_markup) || 1.3;
  var rt = Number(db.config.pay_usdt_rate) || 7.2;
  var added = 0, updated = 0, removed = 0, restored = 0;
  var remoteIds = {};

  allItems.forEach(function(s){
    var sid = String(s.service_id);
    if (!sid) return;
    remoteIds[sid] = true;

    var origin = parseFloat(s.origin_cost);
    if (isNaN(origin)) origin = (parseFloat(s.cost) || 0) / 1.3;
    var newPrice = Math.max(1, Math.round(origin * rt * m * 100));

    var exist = (db.products || []).find(function(p){
      return p.source === 'luban' && String(p.luban_service_id) === sid;
    });

    if (exist){
      var oldCost = parseFloat(exist.luban_origin_cost || 0);
      var oldPrice = exist.price;
      var wasRemoved = !!exist.luban_removed;

      exist.luban_origin_cost = origin.toFixed(2);
      exist.price = newPrice;
      exist.luban_service_name = s.service_name || exist.luban_service_name;
      exist.luban_country = s.country_name_zh || s.country_name_en || exist.luban_country;
      exist.name = '[接码] ' + (s.service_name || '') + ' · ' + (s.country_name_zh || '');
      exist.description = '国家：' + (s.country_name_zh || '') + ' ｜ 服务：' + s.service_name;

      if (wasRemoved){
        exist.luban_removed = false;
        exist.active = true;
        restored++;
      } else if (oldCost !== origin || oldPrice !== newPrice){
        updated++;
      }
    } else if (s.service_name){
      db.seq.product++;
      db.products.push({
        id: db.seq.product,
        name: '[接码] ' + s.service_name + ' · ' + (s.country_name_zh || ''),
        price: newPrice,
        description: '国家：' + (s.country_name_zh || '') + ' ｜ 服务：' + s.service_name,
        note: '请在 20 分钟内完成注册',
        category_id: 0, active: true, created_at: now(),
        skus: [], source: 'luban', luban_type: 'sms',
        luban_service_id: sid,
        luban_service_name: s.service_name,
        luban_country: s.country_name_zh || s.country_name_en || '',
        luban_origin_cost: origin.toFixed(2)
      });
      added++;
    }
  });

  (db.products || []).forEach(function(p){
    if (p.source === 'luban' && p.luban_type === 'sms' && p.luban_service_id && p.active){
      if (!remoteIds[String(p.luban_service_id)]){
        p.active = false;
        p.luban_removed = true;
        removed++;
      }
    }
  });

  db.config.luban_last_sync = Date.now();
  saveDB(db);
  return { added: added, updated: updated, removed: removed, restored: restored };
};

/* ============ 自动同步定时器 ============ */
(function(){
  function autoCheck(){
    try {
      var db = loadDB();
      var cfg = db.config || {};
      if (cfg.luban_auto_sync === false) return;
      var last = Number(cfg.luban_last_sync) || 0;
      var hours = Number(cfg.luban_sync_interval_hours) || 6;
      if (Date.now() - last < hours * 3600 * 1000) return;

      console.log('[Luban自动同步] 触发…');
      yfLubanFetchAll().then(function(items){
        if (!items || !items.length) return;
        var r = yfLubanMergeServices(items);
        var total = r.added + r.updated + r.removed + r.restored;
        if (total > 0){
          toast('🔄 Luban 自动同步：新增 ' + r.added + '，改价 ' + r.updated + '，下架 ' + r.removed + '，恢复 ' + r.restored);
        }
        if (location.hash.indexOf('#/admin') === 0 && renderLuban){
          setTimeout(function(){ renderLuban(); }, 500);
        }
      }).catch(function(e){ console.warn('[Luban自动同步] 失败:', e); });
    } catch(e){}
  }
  setInterval(autoCheck, 10 * 60 * 1000);
  setTimeout(autoCheck, 30 * 1000);
})();

    if (country) url += '&countryName=' + encodeURIComponent(country);
    if (service) url += '&service=' + encodeURIComponent(service);
    return fetch(url).then(r => r.json()).then(d => {
      if (d.code !== 0) throw new Error(d.msg || '拉取失败');
      const list = Array.isArray(d.msg) ? d.msg : [];
      if (list.length > 0){ allServices.push(...list); emptyStreak = 0; page++; return new Promise(resolve => setTimeout(() => resolve(fetchPage()), 150)); }

    });

      }
    });
    saveDB(db); toast(`拉取完成！新增 ${added} 个，更新 ${updated} 个`,'success'); renderLuban();
  }).catch(e => toast('同步失败：' + e.message,'error'));
}

  const seen = {}; const finalTry = [];
  tryList.forEach(w => { if (w && !seen[w]){ seen[w] = true; finalTry.push(w); } });

/* ============ 订单超时自动取消 ============ */
function autoCancelTimeoutOrders(){
  try {
    var db = window.loadDB();
    var changed = false;
    var nowTs = Date.now();
    (db.orders || []).forEach(function(o){
      if (o.status !== 'pending') return;
      var ts = Date.parse((o.created_at || '').replace(/-/g, '/'));
      if (!ts) return;
      if (nowTs - ts < 30 * 60 * 1000) return;
      if (o.balance_used > 0 && o.username){
        var m = db.members.find(function(x){ return x.username === o.username; });
        if (m){ m.balance = (m.balance || 0) + o.balance_used; }
        o.refunded_amount = o.balance_used;
        o.refunded_at = _now();
        o.balance_used = 0;
      }
      o.status = 'rejected';
      o.completed_at = _now();
      o.timeout_cancel = true;
      o.luban_error = '支付超时（30分钟）自动取消';
      changed = true;
    });
    if (changed) window.saveDB(db);
  } catch(e){}
}

setTimeout(autoCancelTimeoutOrders, 3000);

/* ============ 接码验证码强提醒 ============ */
var _origTitle = document.title;
var _titleInterval = null;
function yfStrongAlert(msg){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
    setTimeout(function(){
      var osc2 = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.connect(gain2); gain2.connect(ctx.destination);
      osc2.frequency.value = 1100;
      gain2.gain.setValueAtTime(0.35, ctx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
      osc2.start(); osc2.stop(ctx.currentTime + 0.45);
    }, 400);
  } catch(e){}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]); } catch(e){}
  if (_titleInterval) clearInterval(_titleInterval);
  var blinkOn = false;
  _titleInterval = setInterval(function(){
    document.title = blinkOn ? ('🔴 新验证码！' + _origTitle) : _origTitle;
    blinkOn = !blinkOn;
  }, 800);
  setTimeout(function(){
    if (_titleInterval){ clearInterval(_titleInterval); _titleInterval = null; }
    document.title = _origTitle;
  }, 30000);
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:16px 24px;border-radius:14px;box-shadow:0 20px 60px -12px rgba(16,185,129,.6);z-index:99999;font-size:15px;font-weight:700;max-width:90vw;text-align:center';
  box.innerHTML = '🎉 收到验证码<br><span style="font-size:26px;letter-spacing:3px;font-family:ui-monospace,monospace;display:block;margin-top:6px">' + _esc(msg) + '</span>';
  document.body.appendChild(box);
  setTimeout(function(){ if (box.parentNode) box.parentNode.removeChild(box); }, 6000);
  _toast('🎉 收到验证码：' + msg, 'success');
}

/* ============ 客服系统 ============ */
var CS_KEY = 'yunfaka_chat_session';
var csSession = localStorage.getItem(CS_KEY);
if (!csSession){ csSession = 'C' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); localStorage.setItem(CS_KEY, csSession); }
var csPollTimer = null;
function csEsc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

window.csRender = function(msgs){
  var box = document.getElementById('cs-msgs'); if (!box) return;
  if (!msgs || !msgs.length){
    var emptyHtml = '<div class="cs-empty">有任何问题请留言，店主会尽快回复～</div>';
    if (box._lastHtml === emptyHtml){ box.scrollTop = box.scrollHeight; return; }
    box._lastHtml = emptyHtml;
    box.innerHTML = emptyHtml;
    return;
  }
  var html = msgs.map(function(m){
    var role = (m.role === 'admin') ? 'admin' : 'customer';
    return '<div class="cs-msg ' + role + '">' + csEsc(m.text) + '<span class="cs-time">' + csEsc(m.time || '') + '</span></div>';
  }).join('');
  if (box._lastHtml === html){ box.scrollTop = box.scrollHeight; return; }
  var oldCount = box.querySelectorAll('.cs-msg').length;
  box._lastHtml = html;
  box.innerHTML = html;
  var all = box.querySelectorAll('.cs-msg');
  for (var i = 0; i < oldCount && i < all.length; i++){ all[i].style.animation = 'none'; }
  box.scrollTop = box.scrollHeight;
  var adminCount = msgs.filter(function(m){ return m.role === 'admin'; }).length;
  var csPanel = document.getElementById('cs-panel');
  if (adminCount > (window._csLastAdmin || 0) && csPanel && !csPanel.classList.contains('open')){
    var floatBtn = document.getElementById('cs-float');
    if (floatBtn) floatBtn.classList.add('has-msg');
  }
  window._csLastAdmin = adminCount;
};

window.csPoll = function(){
  fetch('/api/chat?session=' + encodeURIComponent(csSession) + '&t=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){ if (d.ok && d.messages){ window.csRender(d.messages); } }).catch(function(){});
};

window.csSend = function(){
  var input = document.getElementById('cs-input'); if (!input) return;
  var text = input.value.trim(); if (!text) return;
  var btn = document.getElementById('cs-send'); var msgsBox = document.getElementById('cs-msgs');
  if (msgsBox){
    var emptyDiv = msgsBox.querySelector('.cs-empty');
    if (emptyDiv) emptyDiv.remove();
    var now = new Date();
    var p = function(n){ return String(n).padStart(2, '0'); };
    var timeStr = now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate())+' '+p(now.getHours())+':'+p(now.getMinutes())+':'+p(now.getSeconds());
    var msgDiv = document.createElement('div');
    msgDiv.className = 'cs-msg customer';
    msgDiv.innerHTML = csEsc(text) + '<span class="cs-time">' + timeStr + '</span>';
    msgsBox.appendChild(msgDiv);
    msgsBox.scrollTop = msgsBox.scrollHeight;
    msgsBox._lastHtml = '__local_append__';
  }
  input.value = '';
  if (btn){ btn.disabled = true; btn.textContent = '发送中'; }
  fetch('/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ session: csSession, text: text })
  }).then(function(r){ return r.json(); }).then(function(d){
    if (btn){ btn.disabled = false; btn.textContent = '发送'; }
    if (d.ok){ if (window.csPoll) window.csPoll(); }
    else alert('发送失败：' + (d.msg||'未知错误'));
  }).catch(function(){
    if (btn){ btn.disabled = false; btn.textContent = '发送'; }
    alert('网络错误，请检查网络后重试');
  });
};

var sendBtn = document.getElementById('cs-send');
if (sendBtn) sendBtn.onclick = window.csSend;
var inputEl = document.getElementById('cs-input');
if (inputEl) inputEl.addEventListener('keydown', function(e){ if (e.key==='Enter') window.csSend(); });

document.addEventListener('click', function(e){
  var floatBtn = e.target.closest && e.target.closest('#cs-float');
  var closeBtn = e.target.closest && e.target.closest('#cs-close');
  var panel = document.getElementById('cs-panel');
  if (floatBtn && panel){
    e.preventDefault(); panel.classList.add('open');
    window.csPoll(); setTimeout(function(){ document.getElementById('cs-input').focus(); }, 100);
    if (!csPollTimer){ csPollTimer = setInterval(window.csPoll, 5000); }
  }
  if (closeBtn && panel){
    e.preventDefault(); panel.classList.remove('open');
    if (csPollTimer){ clearInterval(csPollTimer); csPollTimer = null; }
  }
});
setTimeout(function(){ if (window.csPoll) window.csPoll(); }, 2000);

console.log('%c[P1-P20 整合补丁] 已加载', 'color:#10b981;font-weight:bold;font-size:13px');
})();

(function(){

var API = '/api/state'; var rev = 0;
var _saveDB = window.saveDB; var _loadDB = window.loadDB;

      if (d && d.ok) { rev = d.rev; return; }
      if (d && d.rev !== undefined) {

          .then(function(r2){ return r2.json(); }).then(function(d2){
            if (d2 && d2.ok) { rev = d2.rev; }
          }).catch(function(){});
        return;
      }
    }).catch(function(e){ console.warn('push fail', e); });
};

function pull(){
  fetch(API + '?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
    if (!d || !d.ok || !d.db) return;
    if (d.rev !== rev){
      rev = d.rev;
      var local = _loadDB() || {};
      var srv = d.db;
      var srvEmpty = (!srv.orders||!srv.orders.length) && (!srv.members||!srv.members.length) && (!srv.cards||!srv.cards.length);
      var localHas = (local.orders&&local.orders.length>0) || (local.members&&local.members.length>0);
      if (srvEmpty && localHas){ window.saveDB(local); return; }
      try { _saveDB(srv); } catch(e){}
      if (window.applySiteConfig) window.applySiteConfig();
      var ae = document.activeElement;
      if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
      if (window.route) window.route();
    }
  }).catch(function(e){ console.warn('pull fail', e); });
}
pull(); setInterval(pull, 15000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) pull(); });
window.addEventListener('online', pull);
})();

/* ============ P22 实时同步 ============ */
(function(){
'use strict';
if (!window.loadDB || !window.saveDB) return;

var _bc = null;
try { _bc = new BroadcastChannel('yf_sync'); } catch(e){}

var _origSaveDB = window.saveDB;
window.saveDB = function(db){
  var r = _origSaveDB.apply(this, arguments);
  if (_bc){ try { _bc.postMessage({ type:'db_changed', ts:Date.now() }); } catch(e){} }
  setTimeout(yfPullNow, 300);
  return r;
};

var _yfRev = null;
var _yfPulling = false;

function yfPullNow(){
  if (_yfPulling) return;
  _yfPulling = true;
  fetch('/api/state?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      _yfPulling = false;
      if (!d || !d.ok || !d.db) return;
      if (_yfRev === null){ _yfRev = d.rev; return; }
      if (d.rev === _yfRev) return;
      _yfRev = d.rev;
      try { localStorage.setItem('yunfaka_db_v15', JSON.stringify(d.db)); } catch(e){}
      if (window.applySiteConfig) { try { window.applySiteConfig(); } catch(e){} }
      var ae = document.activeElement;
      if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')){
        setTimeout(yfPullNow, 3000);
        return;
      }
      if (window.route) { try { window.route(); } catch(e){} }
    })
    .catch(function(){ _yfPulling = false; });
}
window.yfPullNow = yfPullNow;

fetch('/api/state?t=' + Date.now(), { cache:'no-store' })
  .then(function(r){ return r.json(); })
  .then(function(d){ if (d && d.ok) _yfRev = d.rev; })
  .catch(function(){});

setInterval(yfPullNow, 10000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) setTimeout(yfPullNow, 300); });
window.addEventListener('online', function(){ setTimeout(yfPullNow, 300); });
if (_bc){ _bc.onmessage = function(e){ if (e.data && e.data.type === 'db_changed'){ setTimeout(yfPullNow, 300); } }; }
window.addEventListener('storage', function(e){ if (e.key === 'yunfaka_db_v15' && e.newValue){ setTimeout(yfPullNow, 500); } });
})();

/* ============ P23 版本检测 ============ */
(function(){
'use strict';
var KEY = 'yf_build_id';
var CHECK_INTERVAL = 5 * 60 * 1000;
var _currentBuild = null;
var _checking = false;

function fetchBuild(){
  return fetch('/api/build?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); });
}

fetchBuild().then(function(d){
  if (!d || !d.ok || !d.build){ return; }
  _currentBuild = d.build;
  var lastBuild = localStorage.getItem(KEY);
  if (!lastBuild){ localStorage.setItem(KEY, _currentBuild); return; }
  if (lastBuild !== _currentBuild){
    localStorage.setItem(KEY, _currentBuild);
    try {
      if (window.caches){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
    } catch(e){}
    setTimeout(function(){ location.reload(true); }, 200);
  }
}).catch(function(e){ console.warn('[版本检测] 首次检查失败:', e); });

function checkBuild(){
  if (_checking) return;
  _checking = true;
  fetchBuild().then(function(d){
    _checking = false;
    if (!d || !d.ok || !d.build){ return; }
    if (_currentBuild === null){ _currentBuild = d.build; localStorage.setItem(KEY, d.build); return; }
    if (d.build !== _currentBuild){
      _currentBuild = d.build;
      localStorage.setItem(KEY, d.build);
      var ae = document.activeElement;
      var isEditing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
      if (!isEditing && !document.hidden){
        if (window.toast) window.toast('🔄 检测到新版本，正在刷新…', 'info');
        setTimeout(function(){ location.reload(true); }, 500);
      } else {
        if (window.toast) window.toast('🔄 有新版本，稍后自动刷新', 'info');
        setTimeout(function(){
          var ae2 = document.activeElement;
          if (!ae2 || (ae2.tagName !== 'INPUT' && ae2.tagName !== 'TEXTAREA')){ location.reload(true); }
        }, 30000);
      }
    }
  }).catch(function(){ _checking = false; });
}
setInterval(checkBuild, CHECK_INTERVAL);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) setTimeout(checkBuild, 1000); });
})();

/* ============ P31 上架保护（DIRTY 机制） ============ */
(function(){
'use strict';
if (!window.loadDB || !window.saveDB) return;

var DIRTY_TTL_MS = 10000;
var SETTLE_MS    = 5000;

window.__YF_DIRTY          = false;
window.__YF_DIRTY_TS       = 0;
window.__YF_LOCAL_SNAPSHOT = null;

var _p31SaveDB = window.saveDB;
var _p31LoadDB = window.loadDB;

window.loadDB = function(){
  if (window.__YF_DIRTY &&
      window.__YF_LOCAL_SNAPSHOT &&
      Date.now() - window.__YF_DIRTY_TS < DIRTY_TTL_MS){
    return window.__YF_LOCAL_SNAPSHOT;
  }
  return _p31LoadDB.apply(this, arguments);
};

window.saveDB = function(db){
  if (db) window.__YF_LOCAL_SNAPSHOT = db;
  window.__YF_DIRTY = true;
  window.__YF_DIRTY_TS = Date.now();
  var ret = _p31SaveDB.apply(this, arguments);
  setTimeout(function(){
    if (Date.now() - window.__YF_DIRTY_TS > SETTLE_MS - 1000){
      window.__YF_DIRTY = false;
      window.__YF_LOCAL_SNAPSHOT = null;
      console.log('%c[P31] DIRTY 已清除（保存已稳定）', 'color:#10b981;font-size:11px');
    }
  }, SETTLE_MS);
  return ret;
};

setInterval(function(){
  if (!window.__YF_DIRTY) return;
  if (Date.now() - window.__YF_DIRTY_TS < DIRTY_TTL_MS) return;
  window.__YF_DIRTY = false;
  window.__YF_LOCAL_SNAPSHOT = null;
}, 1500);

var _p31OrigRoute = window.route;
window.route = function(){
  if (window.__YF_DIRTY && window.__YF_LOCAL_SNAPSHOT){
    try {
      localStorage.setItem('yunfaka_db_v15', JSON.stringify(window.__YF_LOCAL_SNAPSHOT));
    } catch(e){}
  }
  return _p31OrigRoute.apply(this, arguments);
};

function extendDirty(){
  window.__YF_DIRTY = true;
  window.__YF_DIRTY_TS = Date.now();
  try {
    var cur = _p31LoadDB.call(window);
    if (cur) window.__YF_LOCAL_SNAPSHOT = cur;
  } catch(e){}
}

window.yfSmmDiag = function(){
  var db = window.loadDB();
  var rawDb = _p31LoadDB ? _p31LoadDB.call(window) : null;
  function summarize(d){
    if (!d || !Array.isArray(d.products)) return {smm:0, smmOn:0, luban:0, lubanOn:0};
    var smm = d.products.filter(function(p){ return p.source === 'smm'; });
    var lb  = d.products.filter(function(p){ return p.source === 'luban'; });
    return { smm: smm.length, smmOn: smm.filter(function(p){ return p.active; }).length, luban: lb.length, lubanOn: lb.filter(function(p){ return p.active; }).length };
  }
  var a = summarize(db); var b = summarize(rawDb);

  console.log('原始数据: SMM ' + b.smm + '/' + b.smmOn + '，Luban ' + b.luban + '/' + b.lubanOn);
  console.log('DIRTY: ' + window.__YF_DIRTY);
  console.groupEnd();
};

window.yfRecoverAllLubanSmm = function(){
  var db = _p31LoadDB ? _p31LoadDB.call(window) : window.loadDB();
  var candidates = (db.products || []).filter(function(p){ return (p.source === 'smm' || p.source === 'luban') && !p.active; });
  if (!candidates.length){ toast('没有需要上架的商品', 'info'); return; }
  if (!confirm('将 ' + candidates.length + ' 个 SMM/Luban 商品批量上架？')) return;
  candidates.forEach(function(p){ p.active = true; });
  window.saveDB(db);
  toast('已批量上架 ' + candidates.length + ' 个商品', 'success');
  setTimeout(function(){ if (window.route) window.route(); }, 500);
};
