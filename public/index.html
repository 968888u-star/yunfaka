  window.smmSaveCats = function(){
    var t = ($('#smm-cats-text') ? $('#smm-cats-text').value : '');
    var db = loadDB();
    var defaultCats = 'Telegram\nInstagram\nYouTube\nTikTok\nFacebook\nTwitter/X\nAI/ChatGPT\nNetflix\nSpotify\nDiscord\nGoogle\nApple\n腾讯/微信\n抖音\nB站\n小红书\n微博\n快手\n其他'.split('\n');
    var oldCats = ((db.config.smm_categories||'').split('\n').map(function(s){return s.trim();}).filter(Boolean));
    if (!oldCats.length) oldCats = defaultCats;  /* 首次保存用默认分类作为基准 */
    var newCats = t.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    db.config.smm_categories = newCats.join('\n');
    /* ⭐ 强制重新识别所有SMM商品分类（按新分类列表关键词匹配，不依赖旧smm_platform） */
    var reidentified = 0;
    db.products.forEach(function(p){
      if (p.source !== 'smm') return;
      var newCat = smmCatOf(p.smm_service_name || p.name, null);  /* null强制按名称重新识别 */
      if (newCats.indexOf(newCat) < 0) newCat = newCats[newCats.length-1] || '其他';  /* 不在列表里归最后一个 */
      if (p.smm_platform !== newCat){ p.smm_platform = newCat; reidentified++; }
    });
    saveDB(db); toast('分类已保存，重新识别 '+reidentified+' 个商品分类，前台刷新生效','success'); renderSmmTab(); setTimeout(function(){try{smmPushToCloud();}catch(e){}},500);
  };

  window.smmPushToCloud = function(showMsg){

      var db=loadDB(); var sp=db.products.filter(function(p){return p.source==='smm';});
      if(!sp.length){ if(showMsg) toast('没有SMM商品可同步','warn'); return; }
      fetch('/api/smm-store',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'yunfaka-smm-sync-2026',products:sp})})
        .then(function(r){return r.json();})
        .then(function(d){
          if(d && d.ok){ if(showMsg) toast('☁️ 已同步到云端 '+sp.length+' 个商品，所有设备可查看','success'); }

        })
        .catch(function(e){ if(showMsg) toast('☁️ 云端同步失败：'+e.message,'error'); });
    } catch(e){ if(showMsg) toast('☁️ 同步异常：'+e.message,'error'); }

  window.smmSyncCore = function(silent){
    if (!silent && !confirm('将从 chinayinliu 拉取全部服务并加价上架，已存在的会更新价格。继续？')) return;
    if (!silent) toast('正在拉取服务列表…');
    smmApi('services').then(function(r){
      if (!r.ok){ toast('拉取失败：' + (r.msg || ''), 'error'); return; }
      var list = r.data;
      if (!Array.isArray(list)){ toast('返回格式异常', 'error'); return; }
      var db = loadDB();
      var cfg = getConfig(db);
      var markup = Number(cfg.smm_markup) || 1.5;
      var rate = usdtRate();  /* 统一使用后台 USDT→CNY 汇率 */
      var added = 0, updated = 0;
      list.forEach(function(s){
        var serviceId = String(s.service || '');
        if (!serviceId) return;
        var rateUsd = parseFloat(s.rate) || 0;
        var priceFen = Math.max(1, Math.round(rateUsd * markup * 100));
        var exist = null;
        for (var i = 0; i < db.products.length; i++){
          if (db.products[i].source === 'smm' && String(db.products[i].smm_service_id) === serviceId){ exist = db.products[i]; break; }
        }
        var name = '[推广] ' + (s.name || '');
        var desc = '类别：' + (s.category || '') + ' ｜ 类型：' + (s.type || '') + ' ｜ 起订 ' + (s.min || '') + ' ~ 上限 ' + (s.max || '');
        var min = parseInt(s.min) || 1;
        var max = parseInt(s.max) || 100000;
        if (exist){
          exist.name = name; exist.description = desc;
          exist.smm_rate_usd = rateUsd.toFixed(4); exist.smm_price_ver = 2;
          exist.smm_min = min; exist.smm_max = max;
          exist.smm_type = s.type || ''; exist.smm_category = s.category || '';
          exist.smm_refill = !!s.refill; exist.smm_cancel = !!s.cancel;
          /* ⭐ 保留自定义价：设置过自定义价的商品，上游更新不覆盖售价 */
          if (!exist.smm_custom_price || exist.smm_custom_price <= 0) exist.price = priceFen;
          updated++;
        } else {
          db.seq.product++;
          db.products.push({
            id: db.seq.product, name: name, price: priceFen,
            description: desc, note: '下单后自动提交上游，进度可在订单详情查看',
            category_id: 0, active: true, created_at: now(), skus: [], source: 'smm',
            smm_service_id: serviceId, smm_service_name: s.name || '',
            smm_type: s.type || '', smm_category: s.category || '',
            smm_rate_usd: rateUsd.toFixed(4), smm_min: min, smm_max: max,
            smm_refill: !!s.refill, smm_cancel: !!s.cancel, smm_price_ver: 2
          });
          added++;
        }
      });
      saveDB(db);
      if (!silent) toast('同步完成：新增 ' + added + '，更新 ' + updated, 'success');
      setTimeout(function(){try{smmPushToCloud();}catch(e){}},500);
      renderSmmTab();
    }).catch(function(e){ if(!silent) toast('网络错误：' + e.message, 'error'); });
  };

    var _useBal = $('#smm-use-balance'); var _deduct = 0;
    var _smmPayRadio = document.querySelector('input[name="smm-pay"]:checked');
    if (_smmPayRadio && _smmPayRadio.value === 'balance'){
      if ((member.balance||0) < amount){ toast('余额不足，请充值或换其他支付方式','error'); return; }
      _deduct = amount;
      if (!deductBalance(db, member.username, _deduct)){ toast('余额扣除失败','error'); return; }
    } else
    if (member && (member.balance || 0) > 0 && (!_useBal || _useBal.checked)){
      _deduct = Math.min(member.balance || 0, amount);
      if (_deduct > 0 && !deductBalance(db, member.username, _deduct)){ _deduct = 0; }
    }
    var _due = amount - _deduct;
    var orderNo = genOrderNo();
    var order = {
      order_no: orderNo, product_id: id, product_name: p.name,
      sku_id: 0, sku_name: '', category_id: 0, quantity: qty,
      amount: amount, balance_used: _deduct, amount_due: _due,
      secret: secret, username: member ? member.username : '',
      /* ⭐ 全额余额支付也保持 pending，由 payOrder 拦截触发上游提交 */
      status: 'pending', pay_method: (_due <= 0 ? 'balance' : radio.value), cards: [],
      note: p.note || '', created_at: now(), delivered_at: '',
      source: 'smm',
      smm_service_id: p.smm_service_id,
      smm_service_name: p.smm_service_name,
      smm_link: link,
      usdt_rate: usdtRate()
    };
    if (radio.value === 'alipay' && _due > 0) order.redpacket_code = genRedpacketCode(cfg.pay_alipay_redpacket_prefix);
    db.orders.unshift(order);
    saveDB(db);
    saveMyOrder(orderNo, secret);
    localStorage.setItem(LS_SECRET, secret);
    closeModal();
    if (_due <= 0){
      /* ⭐ 余额全额支付：直接触发 payOrder 提交上游，并跳转订单页 */
      payOrder(orderNo);
      toast('余额支付成功，已提交上游处理 🎉','success');
      if (location.hash === '#/order/' + orderNo) route();
      else location.hash = '#/order/' + orderNo;
    } else {
      showPayModal('order', orderNo);
    }
  };

  /* ========== payOrder 拦截 ========== */
  var _origPayOrder = window.payOrder;
  window.payOrder = function(orderNo){
    var db = loadDB();
    var o = db.orders.filter(function(x){ return x.order_no === orderNo; })[0];
    if (!o || o.status !== 'pending') return;
    if (o.source === 'smm'){
      o.status = 'processing';
      saveDB(db);
      smmApi('add', { service: o.smm_service_id, link: o.smm_link, quantity: o.quantity })
        .then(function(r){
          var db2 = loadDB();
          var o2 = db2.orders.filter(function(x){ return x.order_no === orderNo; })[0];
          if (!o2) return;
          if (r.ok && r.data && r.data.order){
            o2.smm_order_id = String(r.data.order);
            o2.smm_state = 'In progress';
            saveDB(db2);
            toast('已提交到上游，订单号：' + r.data.order, 'success');
            startPoll(orderNo);
          } else {
            var errMsg = (r.data && (r.data.error || r.data.msg)) || r.msg || '提交失败';
            o2.status = 'luban_error';
            o2.luban_error = errMsg;
            saveDB(db2);
            toast('提交失败：' + errMsg, 'error');
          }
          if (location.hash === '#/order/' + orderNo) route();
        }).catch(function(e){
          var db2 = loadDB();
          var o2 = db2.orders.filter(function(x){ return x.order_no === orderNo; })[0];
          if (o2){ o2.status = 'luban_error'; o2.luban_error = '网络错误：' + e.message; saveDB(db2); }
          toast('网络错误：' + e.message, 'error');
        });
      return;
    }
    return _origPayOrder.apply(this, arguments);
  };

  /* ========== 订单状态轮询 ========== */
  var _timers = {};
  function startPoll(orderNo){
    if (_timers[orderNo]) clearInterval(_timers[orderNo]);
    function check(){
      var db = loadDB();
      var o = db.orders.filter(function(x){ return x.order_no === orderNo; })[0];
      if (!o || !o.smm_order_id){ clearInterval(_timers[orderNo]); delete _timers[orderNo]; return; }
      if (o.status === 'delivered' || o.status === 'rejected'){ clearInterval(_timers[orderNo]); delete _timers[orderNo]; return; }
      smmApi('status', { order: o.smm_order_id }).then(function(r){
        if (!r.ok || !r.data) return;
        var db2 = loadDB();
        var o2 = db2.orders.filter(function(x){ return x.order_no === orderNo; })[0];
        if (!o2) return;
        var d = r.data;
        o2.smm_state = d.status || '';
        o2.smm_start_count = d.start_count || '';
        o2.smm_remains = d.remains || '';
        o2.smm_charge = d.charge || '';
        o2.smm_last_check = now();
        var st = String(o2.smm_state);
        if (/Canceled|Cancelled|Refunded/i.test(st)) o2.status = 'rejected';
        else if (/Completed/i.test(st) && !/Partial/i.test(st)){ o2.status = 'delivered'; o2.delivered_at = o2.delivered_at || now(); }
        else o2.status = 'processing';
        saveDB(db2);
        if (location.hash === '#/order/' + orderNo) route();
      }).catch(function(){});
    }
    check();
    _timers[orderNo] = setInterval(check, 60000);
  }

  window.smmManualCheck = function(orderNo){
    var db = loadDB();
    var o = db.orders.filter(function(x){ return x.order_no === orderNo; })[0];
    if (!o || !o.smm_order_id){ toast('还没有上游订单号','error'); return; }
    toast('正在查询…');
    smmApi('status', { order: o.smm_order_id }).then(function(r){
      if (!r.ok || !r.data){ toast('查询失败','error'); return; }
      var db2 = loadDB();
      var o2 = db2.orders.filter(function(x){ return x.order_no === orderNo; })[0];
      if (!o2) return;
      var d = r.data;
      o2.smm_state = d.status || '';
      o2.smm_start_count = d.start_count || '';
      o2.smm_remains = d.remains || '';
      o2.smm_charge = d.charge || '';
      o2.smm_last_check = now();
      var st = String(o2.smm_state);
      if (/Canceled|Cancelled|Refunded/i.test(st)) o2.status = 'rejected';
      else if (/Completed/i.test(st) && !/Partial/i.test(st)){ o2.status = 'delivered'; o2.delivered_at = o2.delivered_at || now(); }
      else o2.status = 'processing';
      saveDB(db2);
      toast('状态：' + o2.smm_state, 'success');
      if (location.hash === '#/order/' + orderNo) route();
    }).catch(function(e){ toast('网络错误：' + e.message,'error'); });
  };

  window.smmRefill = function(orderNo){
    var db = loadDB();
    var o = db.orders.filter(function(x){ return x.order_no === orderNo; })[0];
    if (!o || !o.smm_order_id){ toast('没有上游订单号','error'); return; }
    if (!confirm('确定补单？')) return;
    smmApi('refill', { order: o.smm_order_id }).then(function(r){
      if (r.ok && r.data && r.data.refill){
        var db2 = loadDB();
        var o2 = db2.orders.filter(function(x){ return x.order_no === orderNo; })[0];
        o2.smm_refill_id = String(r.data.refill);
        saveDB(db2);
        toast('补单已提交：' + r.data.refill,'success');
      } else {
        toast((r.data && r.data.error) || '补单失败','error');
      }
    });
  };

  window.smmCancel = function(orderNo){
    var db = loadDB();
    var o = db.orders.filter(function(x){ return x.order_no === orderNo; })[0];
    if (!o || !o.smm_order_id){ toast('没有上游订单号','error'); return; }
    if (!confirm('确定取消？上游可能已处理一部分，无法退款。')) return;
    smmApi('cancel', { orders: o.smm_order_id }).then(function(r){
      var arr = Array.isArray(r.data) ? r.data : [r.data];
      var first = arr[0] || {};
      if (first.cancel && typeof first.cancel === 'object' && first.cancel.error){
        toast('取消失败：' + first.cancel.error, 'error');
        return;
      }
      if (first.cancel){
        toast('取消请求已提交','success');
        setTimeout(function(){ window.smmManualCheck(orderNo); }, 3000);
      } else toast('取消失败','error');
    }).catch(function(e){ toast('网络错误：' + e.message,'error'); });
  };

  /* ========== 订单详情装饰 ========== */
  var _origRenderOrderView = window.renderOrderView;
  window.renderOrderView = function(orderNo, secret){
    _origRenderOrderView.apply(this, arguments);
    var db = loadDB();
    var o = db.orders.filter(function(x){ return x.order_no === orderNo && x.secret === secret; })[0];
    if (!o || o.source !== 'smm') return;
    var app = document.getElementById('app');
    var allDivs = app.querySelectorAll(':scope > div');
    var bodyDiv = null;
    for (var i = 0; i < allDivs.length; i++){
      var d = allDivs[i];
      if (d.style && d.style.maxWidth === '640px' && d.style.margin === '0px auto'){ bodyDiv = d; break; }
    }
    if (!bodyDiv){
      bodyDiv = document.createElement('div');
      bodyDiv.style.maxWidth = '640px';
      bodyDiv.style.margin = '0 auto';
      app.appendChild(bodyDiv);
    }
    var p = db.products.filter(function(x){ return x.id === o.product_id; })[0];
    var canRefill = p ? p.smm_refill : false;
    var canCancel = p ? p.smm_cancel : false;
    var html = '<div class="card panel" style="background:#f0fdf4;border-color:#86efac;padding:20px;margin-bottom:16px">';
    html += '<div class="spread" style="margin-bottom:10px"><h3 style="margin:0;font-size:15px">📈 推广进度</h3><span class="badge ' + (STATUS_CLASS[o.status] || 'gray') + '">' + (STATUS_TEXT[o.status] || o.status) + '</span></div>';
    html += '<div class="kv"><span class="k">目标链接</span><span class="v mono" style="font-size:12px;word-break:break-all">' + esc(o.smm_link || '-') + '</span></div>';
    html += '<div class="kv"><span class="k">上游订单号</span><span class="v mono">' + esc(o.smm_order_id || '待分配') + '</span></div>';
    html += '<div class="kv"><span class="k">上游状态</span><span class="v">' + esc(o.smm_state || '等待上游处理') + '</span></div>';
    if (o.smm_start_count) html += '<div class="kv"><span class="k">起始数量</span><span class="v">' + esc(o.smm_start_count) + '</span></div>';
    if (o.smm_remains) html += '<div class="kv"><span class="k">剩余未完成</span><span class="v">' + esc(o.smm_remains) + '</span></div>';
    if (o.smm_charge) html += '<div class="kv"><span class="k">上游费用</span><span class="v">$' + esc(o.smm_charge) + '</span></div>';
    if (o.smm_refill_id) html += '<div class="kv"><span class="k">补单号</span><span class="v mono">' + esc(o.smm_refill_id) + '</span></div>';
    html += '<div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap">';
    if (canRefill && o.status === 'delivered' && !o.smm_refill_id) html += '<button class="btn ghost" onclick="smmRefill(\'' + esc(o.order_no) + '\')">🔄 补单</button>';
    if (canCancel && o.status === 'processing') html += '<button class="btn ghost" onclick="smmCancel(\'' + esc(o.order_no) + '\')">❌ 取消</button>';
    html += '<button class="btn primary" onclick="smmManualCheck(\'' + esc(o.order_no) + '\')">立即查询</button>';
    html += '</div></div>';
    bodyDiv.innerHTML = html + bodyDiv.innerHTML;
    if (o.smm_order_id && o.status === 'processing') startPoll(o.order_no);
  };

  /* ========== 路由拦截（双重保险） ========== */
  function isSmm(){ return location.hash.replace(/^#/, '').indexOf('/smm') === 0; }
  var _origRoute = window.route;
  window.route = function(){ if (isSmm()) return renderSmmClient(); return _origRoute.apply(this, arguments); };
  var _origRenderHome = window.renderHome;
  window.renderHome = function(){ if (isSmm()) return renderSmmClient(); return _origRenderHome.apply(this, arguments); };

  /* ========== 首页入口卡片 ========== */
  /* SMM入口已直接渲染，旧注入代码已移除 */

  window.__smmLoaded = true;
  console.log('[YunFaKa] SMM 模块已加载 (chinayinliu)');
})();
</script>
<!-- ============================================================
     加固补丁 v1 · 末尾追加
     覆盖：支付 / 会员 / SMM / 接码
     原理：所有被覆盖的函数在原脚本中均为「函数声明」或 window 属性，

<script>
(function(){
  'use strict';

  if (!window.loadDB || !window.saveDB){
    console.warn('[Patch] 核心 API 未就绪，补丁未加载'); return;
  }

  var _toast = function(m, t){ try { if (window.toast) window.toast(m, t||''); } catch(e){} };
  var _now = function(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+
           p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  };
  var _yuan = function(fen){ return (Number(fen||0)/100).toFixed(2); };

  /* ============================================================
     [1] 支付 · 修复汇率读取
     原 usdtRate() 读 window.__DB.config.pay_usdt_rate_recharge_bonus
     —— 键名错误 + window.__DB 几乎不赋值 → 恒返回 7.2
     修复：直接读 loadDB().config.pay_usdt_rate
     ============================================================ */
  window.usdtRate = function(){
    try {
      var db = window.loadDB();
      var cfg = (db && db.config) || {};
      var r = Number(cfg.pay_usdt_rate);
      return (r > 0) ? r : 7.2;
    } catch(e){ return 7.2; }
  };
  // 兜底：给老代码里仍读 window.__DB 的位置写入正确值
  (function(){
    function sync(){
      try {
        var db = window.loadDB();
        window.__DB = window.__DB || {};
        window.__DB.config = window.__DB.config || {};
        window.__DB.config.pay_usdt_rate_recharge_bonus =
          (db.config && db.config.pay_usdt_rate) || 7.2;
      } catch(e){}
    }
    sync(); setInterval(sync, 3000);
  })();

  /* ============================================================
     [2] 通用 · 订单余额退款（幂等，有 refunded_at 保护）
     ============================================================ */
  window.refundOrderBalance = function(orderNo, reason){
    try {
      var db = window.loadDB();
      var o = db.orders.find(function(x){ return x.order_no === orderNo; });
      if (!o) return false;
      if (o.refunded_at) return false;                       // 已退过
      if (!o.balance_used || o.balance_used <= 0) return false;
      if (!o.username) return false;                         // 匿名订单退不了
      var m = db.members.find(function(x){ return x.username === o.username; });
      if (!m) return false;
      var refund = o.balance_used;
      m.balance = (m.balance || 0) + refund;
      if (!Array.isArray(m.balance_log)) m.balance_log = [];
      m.balance_log.unshift({ delta: refund, type: 'refund', ref: orderNo, reason: reason||'', at: _now() });
      if (m.balance_log.length > 200) m.balance_log.length = 200;
      o.refunded_amount = (o.refunded_amount || 0) + refund;
      o.refunded_at = _now();
      o.refund_reason = reason || '订单取消';
      o.balance_used = 0;                                    // 清零防重复
      window.saveDB(db);
      return true;
    } catch(e){ console.warn('[Patch] refund fail', e); return false; }
  };

  /* ============================================================
     [3] 会员 · 修复 memberLogout 清错 key
     原：localStorage.removeItem('LS_SECRET') 传的是字符串
     实际 key 是 'yunfaka_last_secret'
     ============================================================ */
  window.memberLogout = function(){
    try { localStorage.removeItem('yunfaka_member_user'); } catch(e){}
    try { localStorage.removeItem('yunfaka_last_secret'); } catch(e){}
    _toast('已退出登录');
    if (window.route) window.route();
  };

  /* ============================================================
     [4] 支付 · confirmPay 加幂等锁（同一订单 3 秒内只能点一次）
     ============================================================ */
  var _origConfirmPay = window.confirmPay;
  var _confirmLock = {};
  window.confirmPay = function(type, id){
    var key = type + ':' + id, t = Date.now();
    if (_confirmLock[key] && t - _confirmLock[key] < 3000){
      _toast('正在处理，请勿重复提交', 'warn'); return;
    }
    _confirmLock[key] = t;
    return _origConfirmPay.apply(this, arguments);
  };

  /* ============================================================
     [5] 支付 · submitBuy 加幂等锁
     ============================================================ */
  var _origSubmitBuy = window.submitBuy;
  var _submitLock = {};
  window.submitBuy = function(id){
    var key = 'buy:' + id, t = Date.now();
    if (_submitLock[key] && t - _submitLock[key] < 3000){
      _toast('正在提交，请勿重复点击', 'warn'); return;
    }
    _submitLock[key] = t;
    return _origSubmitBuy.apply(this, arguments);
  };

  /* ============================================================
     [6] 支付 · USDT 轮询加 30 分钟超时 + 页面隐藏暂停
     ============================================================ */
  var _usdtTimer = null, _usdtStart = 0;
  window.startUsdtPolling = function(orderNo){
    if (_usdtTimer) { clearInterval(_usdtTimer); _usdtTimer = null; }
    _usdtStart = Date.now();
    var MAX_MS = 30 * 60 * 1000;
    function check(){
      if (Date.now() - _usdtStart > MAX_MS){
        if (_usdtTimer){ clearInterval(_usdtTimer); _usdtTimer = null; }
        return;
      }
      if (document.hidden) return;   // 隐藏时跳过请求
      fetch('/api/usdt-check?order=' + encodeURIComponent(orderNo))
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d.ok && d.status && d.status !== 'pending'){
            if (_usdtTimer){ clearInterval(_usdtTimer); _usdtTimer = null; }
            _toast('USDT 已到账，系统正在处理 🎉', 'success');
            var _db = window.loadDB();
            var _r = _db.recharges.filter(function(x){ return x.id === orderNo; })[0];
            if (_r && _r.status !== 'success'){
              if (window.processRecharge) window.processRecharge(orderNo);
            } else {
              var _o = _db.orders.filter(function(x){ return x.order_no === orderNo; })[0];
              if (_o && _o.status === 'pending'){
                try { window.payOrder(orderNo); } catch(e){}
              }
            }
            setTimeout(function(){ if (window.route) window.route(); }, 800);
          }
        }).catch(function(){});
    }
    check();
    _usdtTimer = setInterval(check, 30000);
  };

  /* ============================================================
     [7] 支付 · approveOrder 剩余应收二次确认
     ============================================================ */
  var _origApproveOrder = window.approveOrder;
  window.approveOrder = function(orderNo){
    var db = window.loadDB();
    var o = db.orders.find(function(x){ return x.order_no === orderNo; });
    if (!o) return;
    if (o.status !== 'pending_review'){ _toast('订单状态不对','error'); return; }
    // 剩余应收警告
    if (o.amount_due > 0 && o.pay_method !== 'balance'){
      var rate = Number(o.usdt_rate) || window.usdtRate();
      var usdtAmt = (o.amount_due / 100 / rate).toFixed(2);
      if (!confirm('该订单剩余应收：' + usdtAmt + ' USDT / ¥' + _yuan(o.amount_due) +
                   '\n\n确认已收到这笔款项？')) return;
    }
    return _origApproveOrder.apply(this, arguments);
  };

  /* ============================================================
     [8] 支付 · rejectOrder 驳回自动退款
     ============================================================ */
  var _origRejectOrder = window.rejectOrder;
  window.rejectOrder = function(orderNo){
    var before = window.loadDB().orders.find(function(x){ return x.order_no === orderNo; });
    var wasReview = before && before.status === 'pending_review';
    var r = _origRejectOrder.apply(this, arguments);
    var after = window.loadDB().orders.find(function(x){ return x.order_no === orderNo; });
    if (wasReview && after && after.status === 'rejected'){
      try { window.refundOrderBalance(orderNo, '管理员驳回'); } catch(e){}
    }
    return r;
  };

  /* ============================================================
     [9] 接码 · 超时 / 释放 / 请求失败 → 退款

  var _origLubanAutoRelease = window.lubanAutoRelease;
  window.lubanAutoRelease = function(orderNo, reason){
    var db = window.loadDB();
    var o = db.orders.find(function(x){ return x.order_no === orderNo; });
    if (!o || o.status === 'delivered') return;
    var r = _origLubanAutoRelease.apply(this, arguments);
    try { window.refundOrderBalance(orderNo, reason || '接码超时'); } catch(e){}
    return r;
  };

  // lubanRelease 完全重写：幂等 + 余额退回
  window.lubanRelease = function(orderNo){
    var db = window.loadDB();
    var o = db.orders.find(function(x){ return x.order_no === orderNo; });
    if (!o) return;
    if (o.status !== 'waiting_sms' && o.status !== 'processing'){
      _toast('当前状态不可释放','info'); return;
    }
    if (!confirm('确定释放号码？释放后无法再接收短信，余额将退回。')) return;

      ? '/api/luban?action=common_release&phone=' + encodeURIComponent(o.luban_number || '')
      : '/api/luban?action=change_status&request_id=' + encodeURIComponent(o.luban_request_id || '') + '&status=reject';
    fetch(url).then(function(r){ return r.json(); }).then(function(){
      var db2 = window.loadDB();
      var o2 = db2.orders.find(function(x){ return x.order_no === orderNo; });
      if (!o2) return;
      if (o2.status === 'delivered'){ _toast('订单已完成，无需释放','info'); return; }
      o2.status = 'rejected';
      o2.luban_released_at = _now();
      o2.luban_error = '客户主动释放';
      window.saveDB(db2);

  function _watchLubanFailure(orderNo, maxTries){
    var tries = 0;
    var t = setInterval(function(){
      tries++;
      if (tries > (maxTries||15)){ clearInterval(t); return; }
      var db = window.loadDB();
      var o = db.orders.find(function(x){ return x.order_no === orderNo; });
      if (!o){ clearInterval(t); return; }
      if (o.status === 'luban_error'){
        clearInterval(t);
        try { window.refundOrderBalance(orderNo, o.luban_error || '接码失败'); } catch(e){}
      } else if (o.status === 'delivered' || o.status === 'rejected'){
        clearInterval(t);
      }
    }, 3000);
  }
  var _origLubanStartSession = window.lubanStartSession;
  window.lubanStartSession = function(orderNo){
    var r = _origLubanStartSession.apply(this, arguments);
    _watchLubanFailure(orderNo, 15);
    return r;
  };
  var _origLubanStartCommon = window.lubanStartCommon;
  window.lubanStartCommon = function(orderNo, params){
    var r = _origLubanStartCommon.apply(this, arguments);
    _watchLubanFailure(orderNo, 15);
    return r;
  };

  /* ============================================================
     [10] SMM · 提交失败 / 上游取消 → 退款
     包装最外层 payOrder，链式叠加在 SMM 模块的 payOrder 之上
     ============================================================ */
  var _origPayOrder = window.payOrder;
  window.payOrder = function(orderNo){
    var db = window.loadDB();
    var o = db.orders.find(function(x){ return x.order_no === orderNo; });
    var r = _origPayOrder.apply(this, arguments);
    if (o && (o.source === 'smm' || o.source === 'luban')){
      _watchLubanFailure(orderNo, 40);   // 最长监控 2 分钟
    }
    return r;
  };

  // smmCancel 后 30 秒检测取消结果，成功则退款
  if (typeof window.smmCancel === 'function'){
    var _origSmmCancel = window.smmCancel;
    window.smmCancel = function(orderNo){
      var r = _origSmmCancel.apply(this, arguments);
      setTimeout(function(){
        var db = window.loadDB();
        var o = db.orders.find(function(x){ return x.order_no === orderNo; });
        if (o && (o.status === 'rejected' || o.status === 'luban_error')){
          try { window.refundOrderBalance(orderNo, '客户取消 SMM 订单'); } catch(e){}
        }
      }, 30000);
      return r;
    };
  }

  /* ============================================================
     [11] SMM · 人工分类写独立字段 smm_platform_manual
     避免「一键自动分类 / 保存分类」把人工调整覆盖掉
     ============================================================ */
  if (typeof window.smmSetPlatform === 'function'){
    var _origSmmSetPlatform = window.smmSetPlatform;
    window.smmSetPlatform = function(pid, platform){
      var db = window.loadDB();
      var p = db.products.find(function(x){ return String(x.id) === String(pid); });
      if (p){
        p.smm_platform = platform;
        p.smm_platform_manual = platform;   // 人工标记
        window.saveDB(db);
      }
      _toast('已移至「' + platform + '」分类','success');
      try { window.switchTab('smm'); } catch(e){}
    };
  }
  if (typeof window.smmBatchMove === 'function'){
    var _origSmmBatchMove = window.smmBatchMove;
    window.smmBatchMove = function(target){
      var r = _origSmmBatchMove.apply(this, arguments);
      try {
        var db = window.loadDB();

        ids.forEach(function(id){

          if (p){ p.smm_platform_manual = cat; p.smm_platform = cat; }
        });
        window.saveDB(db);
      } catch(e){}
      return r;
    };
  }

  /* ============================================================
     [12] SMM · 切到 SMM tab 时重置分页
     ============================================================ */
  var _origSwitchTab = window.switchTab;
  window.switchTab = function(tab){
    if (tab === 'smm'){ window._smmPage = 1; }
    return _origSwitchTab.apply(this, arguments);
  };

  /* ============================================================

  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+
         p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
};
var _yuan = function(fen){ return (Number(fen||0)/100).toFixed(2); };
var _esc  = function(s){

             + p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())
             + Math.floor(Math.random()*900000+100000);

window.yfExportOrdersCsv = function(){
  try {
    var db = window.loadDB();
    var orders = db.orders || [];
    if (!orders.length){ _toast('没有订单可导出','error'); return; }
    var headers = ['订单号','商品','规格','数量','金额(元)','已抵扣(元)','应收(元)',
                   '支付方式','暗号','账号','状态','来源','红包口令',
                   '创建时间','完成时间','退款时间','退款金额(元)'];
    var lines = [headers.join(',')];
    orders.forEach(function(o){
      var row = [
        o.order_no, o.product_name, o.sku_name || '', o.quantity,
        _yuan(o.amount), _yuan(o.balance_used||0), _yuan(o.amount_due||0),
        o.pay_method, o.secret, o.username || '', o.status, o.source || '',
        o.redpacket_code || '', o.created_at, o.delivered_at || '',
        o.refunded_at || '', _yuan(o.refunded_amount||0)
      ].map(function(v){
        var s = String(v==null?'':v);
        if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
        return s;
      });
      lines.push(row.join(','));
    });
    var csv = '\ufeff' + lines.join('\r\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'orders_' + _now().replace(/[^\d]/g,'') + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 500);
    _toast('已导出 ' + orders.length + ' 条订单','success');
  } catch(e){ _toast('导出失败：' + e.message,'error'); }
};

window.yfCustomerCancelOrder = function(orderNo){
  var db = window.loadDB();

  if (!o){ _toast('订单不存在','error'); return; }

  if (!confirm('确定取消订单？已抵扣的余额将退回。')) return;

  if (o.balance_used > 0 && window.refundOrderBalance){
    if (!window.refundOrderBalance(orderNo, '客户主动取消')){ _toast('退款失败','error'); return; }
  }
  // 重新读（refundOrderBalance 已 saveDB）
  var db2 = window.loadDB();

  o2.status = 'rejected';
  o2.completed_at = _now();
  o2.luban_error = '客户主动取消';
  window.saveDB(db2);
  _toast('订单已取消，余额已退回','success');
  if (window.route) window.route();
};

setInterval(function(){
  try {
    var db = window.loadDB();
    var changed = false;
    var nowTs = Date.now();
    (db.orders || []).forEach(function(o){
      if (o.status !== 'pending') return;
      // 解析 created_at
      var ts = Date.parse(o.created_at.replace(/-/g,'/'));
      if (!ts) return;
      if (nowTs - ts > 30*60*1000){
        if (o.balance_used > 0 && window.refundOrderBalance){
          window.refundOrderBalance(o.order_no, '支付超时自动取消');
          // refresh db
          db = window.loadDB();
          o = db.orders.find(function(x){ return x.order_no === o.order_no; });
        }
        o.status = 'rejected';
        o.completed_at = _now();
        o.luban_error = '支付超时自动取消';
        changed = true;
      }
    });
    if (changed) window.saveDB(db);
  } catch(e){}
}, 60*1000);

(function(){
  var orig = window.renderOrders;
  if (typeof orig !== 'function') return;
  window.renderOrders = function(){
    var r = orig.apply(this, arguments);
    setTimeout(function(){
      try {
        var body = document.getElementById('tab-body');
        if (!body) return;
        if (body.querySelector('#yf-batch-bar')) return;
        var bar = document.createElement('div');
        bar.id = 'yf-batch-bar';
        bar.style.cssText = 'display:flex;gap:8px;margin:8px 0;padding:10px;background:#f8fafc;border-radius:10px;flex-wrap:wrap;align-items:center';
        bar.innerHTML =
          '<span style="font-size:12px;color:#6b7280">批量操作：</span>' +
          '<button class="btn sm primary" onclick="yfBatchApprove()">✅ 批量确认待审核</button>' +
          '<button class="btn sm danger" onclick="yfBatchReject()">❌ 批量驳回待审核</button>';
        var filterBar = body.querySelector('#yf-order-filter');
        if (filterBar) filterBar.parentNode.insertBefore(bar, filterBar.nextSibling);
        else {
          var head = body.querySelector('.spread');
          if (head) head.parentNode.insertBefore(bar, head.nextSibling);
        }
      } catch(e){}
    }, 50);
    return r;
  };
  window.yfBatchApprove = function(){
    var db = window.loadDB();
    var pending = db.orders.filter(function(o){ return o.status === 'pending_review'; });
    if (!pending.length){ _toast('没有待审核订单','info'); return; }
    if (!confirm('批量确认 ' + pending.length + ' 个待审核订单？将逐一发货（含接码提交）。')) return;
    var ok = 0, fail = 0;
    pending.forEach(function(o){
      try {
        // 复用 v1 的 approveOrder，但会弹 confirm，改为直接处理逻辑
        if (o.source === 'luban'){
          o.status = 'processing';
          if (window.lubanStartSession && o.luban_type !== 'common') window.lubanStartSession(o.order_no);
          else if (window.lubanStartCommon) {
            var params = { keyword: o.luban_keyword || '' };
            if (o.luban_country) params.country = o.luban_country;
            if (o.luban_phone) params.phone = o.luban_phone;
            if (o.luban_cardtype && o.luban_cardtype !== '全部') params.cardType = o.luban_cardtype;
            if (o.luban_filter === '是') params.filter = '1';
            window.lubanStartCommon(o.order_no, params);
          }
          ok++;
        } else {
          var orderSku = o.sku_id || 0;
          var avail = db.cards.filter(function(c){
            return c.product_id === o.product_id && c.status === 'unused' && String(c.sku_id||0) === String(orderSku);
          });
          if (avail.length >= o.quantity){
            avail.slice(0, o.quantity).forEach(function(c){
              c.status = 'used'; c.order_no = o.order_no; c.used_at = _now(); o.cards.push(c.content);
            });
            o.status = 'delivered';
            o.delivered_at = _now();
            o.approved_at = _now();
            ok++;
          } else if (avail.length === 0 && o.source !== 'local'){
            o.status = 'delivered'; o.delivered_at = _now(); o.cards = ['虚拟商品·自动发货']; ok++;
          } else fail++;
        }
      } catch(e){ fail++; }
    });
    window.saveDB(db);
    _toast('批量确认完成：成功 ' + ok + '，失败 ' + fail, fail ? 'warn' : 'success');
    window.renderOrders();
  };
  window.yfBatchReject = function(){
    var db = window.loadDB();
    var pending = db.orders.filter(function(o){ return o.status === 'pending_review'; });
    if (!pending.length){ _toast('没有待审核订单','info'); return; }
    if (!confirm('批量驳回 ' + pending.length + ' 个待审核订单？已抵扣的余额将退回。')) return;
    pending.forEach(function(o){
      o.status = 'rejected';
      o.rejected_at = _now();
    });
    window.saveDB(db);
    // 逐单退款（幂等）
    pending.forEach(function(o){
      if (o.balance_used > 0 && window.refundOrderBalance) window.refundOrderBalance(o.order_no, '批量驳回');
    });
    _toast('已批量驳回，余额已退回','success');
    window.renderOrders();
  };
})();

window.yfMoveProduct = function(pid, dir){
  var db = window.loadDB();
  var list = db.products.filter(function(p){ return p.source !== 'smm' && p.source !== 'luban'; });
  var i = list.findIndex(function(p){ return p.id === pid; });
  if (i < 0) return;
  // 在完整 products 数组里找相邻
  var fullIdx = db.products.findIndex(function(p){ return p.id === pid; });
  if (fullIdx < 0) return;
  // 找下一个"本地商品"作为交换对象
  var step = dir > 0 ? 1 : -1;
  var j = fullIdx + step;
  while (j >= 0 && j < db.products.length){
    var q = db.products[j];
    if (q.source !== 'smm' && q.source !== 'luban'){
      var tmp = db.products[fullIdx];
      db.products[fullIdx] = db.products[j];
      db.products[j] = tmp;
      window.saveDB(db);
      _toast('已移动','success');
      window.renderProducts();
      return;
    }
    j += step;
  }
};

(function(){
  var orig = window.renderStats;
  if (typeof orig !== 'function') return;
  window.renderStats = function(){
    var r = orig.apply(this, arguments);
    setTimeout(function(){
      try {
        var db = window.loadDB();
        var now = new Date();
        var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        var weekStart = todayStart - 6*24*3600*1000;
        var monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
        var buckets = {today:0, week:0, month:0};
        (db.orders || []).forEach(function(o){
          if (o.status !== 'delivered') return;
          var ts = Date.parse((o.delivered_at || o.created_at || '').replace(/-/g,'/'));
          if (!ts) return;
          var net = o.amount - (o.refunded_amount||0);
          if (ts >= todayStart) buckets.today += net;
          if (ts >= weekStart)  buckets.week  += net;
          if (ts >= monthStart) buckets.month += net;
        });
        var body = document.getElementById('tab-body');
        if (!body || body.querySelector('#yf-revenue')) return;
        var panel = document.createElement('div');
        panel.id = 'yf-revenue';
        panel.className = 'card panel';
        panel.style.marginTop = '14px';
        panel.innerHTML =
          '<h2>📈 营收概览</h2>' +
          '<div class="stat-grid">' +
            '<div class="stat"><div class="n">' + window.usdt(buckets.today) + '</div><div class="l">今日营收(USDT)</div></div>' +
            '<div class="stat"><div class="n">' + window.usdt(buckets.week) + '</div><div class="l">近 7 日(USDT)</div></div>' +
            '<div class="stat"><div class="n">' + window.usdt(buckets.month) + '</div><div class="l">本月(USDT)</div></div>' +
          '</div>' +
          '<p class="muted" style="font-size:12px;margin-top:10px">统计口径：仅已发货订单，已扣除退款金额。</p>';
        body.insertBefore(panel, body.firstChild);
      } catch(e){}
    }, 120);
    return r;
  };
})();
